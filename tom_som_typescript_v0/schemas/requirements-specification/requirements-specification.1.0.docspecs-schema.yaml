        required: true
        description: "MoSCoW priority: Must, Should, Could, or Won't-This-Time"
      - fieldname: source
        required: true
        description: Stakeholder or document that originated it
      - fieldname: rationale
        description: Why this organizational change is needed
  orei-form:
    fields:
      - fieldname: impactedGroups
