form-types:
  sytore-iden-form:
    fields:
      - fieldname: systemId
        required: true
        description: Stable identifier for the legacy system being replaced
      - fieldname: systemName
        required: true
        description: Common name the organization uses for this system
      - fieldname: officialName
        description: "Vendor/product name and edition, if a commercial system"
      - fieldname: systemDescription
        description: Brief description of what the system does and who uses it
  migcon-stra-form:
    fields:
      - fieldname: overallStrategy
        description: Chosen cutover pattern for the migration program
      - fieldname: sequencingApproach
        description: Order in which systems are migrated and why
      - fieldname: interdependencyHandling
        description: How cross-system dependencies are coordinated
      - fieldname: migrationWindowStrategy
        description: "When migrations run, e.g. weekends, off-hours"
      - fieldname: blackoutPeriods
        description: Times when no migration activity is permitted
      - fieldname: parallelRunDuration
        description: How long old and new run side by side
  miri-gove-form:
    fields:
      - fieldname: riskGovernanceModel
        description: "Centralized, federated, hybrid approach"
      - fieldname: riskCommitteeCharter
        description: Mandate and remit of the risk committee
      - fieldname: riskReviewFrequency
        description: "Weekly, bi-weekly, monthly cycles"
