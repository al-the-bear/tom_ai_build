form-types:
  uacst-form:
    fields:
      - fieldname: stateModel
        description: "Linear | Graph | Hierarchical — how states relate to each other"
      - fieldname: initialState
        description: "State assigned at account creation (e.g., Pending Verification)"
      - fieldname: activeState
        description: Fully operational account state name
      - fieldname: suspendedState
        description: Temporarily restricted state name
      - fieldname: lockedState
        description: "Account locked due to security policy (e.g., failed logins)"
      - fieldname: deactivatedState
        description: "Administratively disabled, recoverable"
      - fieldname: archivedState
        description: Read-only historical state before permanent deletion
      - fieldname: deletedState
        description: Permanently removed or anonymized
      - fieldname: customStates
        description: Additional project-specific states (comma-separated)
      - fieldname: stateVisibility
        description: Which states are visible to the user vs. admin-only
      - fieldname: stateTransitionDiagramRef
        description: Reference to a state transition diagram (mermaid or external)
  urreg-form:
    fields:
      - fieldname: registrationMethods
        description: "SelfRegistration | Invitation | AdminProvisioned | BulkImport | ExternalIdP"
      - fieldname: selfRegistrationEnabled
        description: "Yes | No | PerCategory — whether users can self-register"
      - fieldname: identityProofingLevel
        description: "None | Email | Phone | Document | InPerson — per NIST SP 800-63A IAL"
      - fieldname: emailVerificationRequired
        description: "Yes | No | Optional"
      - fieldname: phoneVerificationRequired
        description: "Yes | No | Optional"
      - fieldname: captchaRequired
        description: "Yes | No — bot prevention during self-registration"
      - fieldname: invitationExpiryPeriod
        description: "Duration before invitation link expires (e.g., 48h, 7d)"
      - fieldname: approvalRequired
        description: "Yes | No — whether registration needs manual approval"
      - fieldname: approvalWorkflow
        description: "Single Approver | Multi-Level | Auto-Approved — workflow type"
      - fieldname: approverRole
        description: Role or person who approves new registrations
      - fieldname: requiredFieldsAtRegistration
        description: Comma-separated list of mandatory fields during signup
      - fieldname: optionalFieldsAtRegistration
        description: Comma-separated list of optional fields during signup
      - fieldname: termsAcceptanceRequired
        description: "Yes | No — must accept terms of service / privacy policy"
      - fieldname: duplicateDetection
        description: "How duplicate accounts are detected (email, phone, name matching)"
      - fieldname: welcomeNotification
        description: "Email | SMS | InApp | None — notification on successful registration"
      - fieldname: initialRoleAssignment
        description: Default role(s) assigned at registration
      - fieldname: registrationRateLimiting
        description: Max registrations per IP/time window to prevent abuse
  acact-form:
    fields:
      - fieldname: activationMethod
        description: "EmailLink | AdminApproval | Automatic | PhoneVerification | Combined"
      - fieldname: activationLinkExpiry
        description: "Duration before activation link expires (e.g., 24h)"
      - fieldname: maxActivationAttempts
        description: Number of times user can request re-activation
      - fieldname: activationPrerequisites
        description: "Conditions that must be met before activation (e.g., email verified, approved)"
      - fieldname: provisioningOnActivation
        description: "Resources provisioned when account becomes active (workspace, storage, etc.)"
      - fieldname: activationNotification
        description: "Channels notified on activation (email, SMS, admin alert)"
      - fieldname: activationTimeout
        description: Time after which unactivated accounts are purged or flagged
      - fieldname: activationTimeoutAction
        description: "Delete | Flag | Remind | Escalate — action on timeout"
      - fieldname: postActivationRedirect
        description: "Where the user is directed after activation (dashboard, onboarding wizard)"
      - fieldname: onboardingRequired
        description: "Yes | No — whether guided onboarding follows activation"
      - fieldname: onboardingSteps
        description: "Steps in onboarding flow (profile completion, tutorial, preference setup)"
  acmod-form:
    fields:
      - fieldname: selfModifiableFields
        description: "Fields the user can change themselves (display name, avatar, preferences)"
      - fieldname: adminModifiableFields
        description: "Fields only an administrator can change (role, status, organization)"
      - fieldname: systemModifiableFields
        description: "Fields updated automatically (last login, login count, risk score)"
      - fieldname: emailChangePolicy
        description: "Re-verification required | Admin approval | Confirmation to old+new email"
      - fieldname: phoneChangePolicy
        description: "Verification via old number | Admin approval"
      - fieldname: nameChangePolicy
        description: "Self-service | RequiresVerification | AdminOnly"
      - fieldname: roleChangeApproval
        description: "Who approves role changes (manager, admin, auto-approved for certain changes)"
      - fieldname: bulkModificationSupport
        description: "Yes | No — whether batch attribute updates are supported"
      - fieldname: changeAuditLogging
        description: "All changes | SensitiveOnly | None — audit trail granularity"
      - fieldname: changeNotification
        description: "User | Admin | Both | None — who receives notification of changes"
      - fieldname: historicalVersioning
        description: "Yes | No — whether previous attribute values are preserved"
      - fieldname: reverificationTriggers
        description: "Which changes trigger re-verification (email, password, security question)"
      - fieldname: modificationRateLimiting
        description: "Limits on how frequently attributes can be changed (e.g., email max 1/30d)"
      - fieldname: modificationCooldownPeriod
        description: Waiting period after sensitive changes before full access resumes
  acdea-form:
    fields:
      - fieldname: deactivationTriggers
        description: "Manual | Inactivity | PolicyViolation | ContractEnd | SecurityIncident"
      - fieldname: inactivityThreshold
        description: "Period of inactivity before automatic deactivation (e.g., 90d, 180d)"
      - fieldname: inactivityWarningPeriod
        description: "Advance notice before deactivation (e.g., warn 14d before deactivation)"
      - fieldname: deactivationApproval
        description: "Who can deactivate accounts (admin, manager, system, self)"
      - fieldname: immediateDeactivationCases
        description: "Cases where deactivation is immediate without warning (security breach, termination)"
      - fieldname: deactivatedAccountAccess
        description: Whether deactivated account data remains accessible to admins
      - fieldname: deactivationEffects
        description: "LoginBlocked | ApiKeysRevoked | SessionsTerminated | DataPreserved"
      - fieldname: reactivationPolicy
        description: "UserRequest | AdminOnly | AutoOnLogin | NotAllowed — how accounts are reactivated"
      - fieldname: reactivationApproval
        description: "Who approves reactivation (original approver, admin, manager)"
      - fieldname: reactivationReverification
        description: "PasswordReset | MFA | IdentityProofing — verification at reactivation"
      - fieldname: maxDeactivationPeriod
        description: Maximum time an account can stay deactivated before escalation to deletion
      - fieldname: deactivationNotification
        description: "User | Admin | Manager | All — channels notified on deactivation"
      - fieldname: gracePeriodAfterDeactivation
        description: Window during which deactivation is easily reversible
      - fieldname: dataPreservationDuration
        description: "How long deactivated account data is preserved (30d, 1y, indefinitely)"
  acdel-form:
    fields:
      - fieldname: deletionTriggers
        description: "UserRequest | RetentionExpiry | AdminDecision | RegulatoryOrder"
      - fieldname: deletionApproval
        description: "Who approves deletion (admin, data protection officer, auto-approved)"
      - fieldname: softDeleteEnabled
        description: "Yes | No — whether accounts are soft-deleted before hard deletion"
      - fieldname: softDeleteRetention
        description: "Duration in soft-deleted state before permanent removal (e.g., 30d, 90d)"
      - fieldname: permanentDeletionProcess
        description: "Anonymize | Purge | Archive — what happens to data on permanent deletion"
      - fieldname: dataAnonymizationStrategy
        description: "Fields anonymized, pseudonymization method, referential integrity handling"
      - fieldname: retainedDataAfterDeletion
        description: "Data kept for legal/audit reasons (transaction logs, audit trails)"
      - fieldname: retentionPeriodAfterDeletion
        description: How long retained data is kept post-deletion
      - fieldname: dataExportBeforeDeletion
        description: "Yes | No — whether users can export their data before deletion"
      - fieldname: exportFormats
        description: "JSON | CSV | XML | PDF — formats for data export"
      - fieldname: cascadeDeletionBehavior
        description: "What happens to associated content (posts, files, records) on user deletion"
      - fieldname: deletionConfirmation
        description: "PasswordEntry | EmailConfirmation | WaitingPeriod — confirmation method"
      - fieldname: deletionNotification
        description: "User | Admin | DPO | All — who is notified on deletion"
      - fieldname: rightToErasureCompliance
        description: "GDPR Art.17 | CCPA | None — applicable right-to-be-forgotten regulations"
      - fieldname: erasureResponseTime
        description: "Maximum time to fulfill an erasure request (e.g., 30 days per GDPR)"
      - fieldname: thirdPartyDataDeletion
        description: How data shared with third parties is removed or anonymized
  ultrs-form:
    fields:
      - fieldname: transitionModel
        description: "StateMachine | Workflow | Hybrid — how transitions are modeled"
      - fieldname: approvalPolicyDefault
        description: "SingleApprover | DualControl | AutoApproved — default for all transitions"
      - fieldname: escalationPolicy
        description: "What happens if approval is not granted within SLA (auto-deny, escalate, remind)"
      - fieldname: escalationTimeframe
        description: "Time before pending approval is escalated (e.g., 48h)"
      - fieldname: auditTrailRequired
        description: "Yes | No — whether every transition is logged"
      - fieldname: notificationOnTransition
        description: "User | Approver | Admin | All — who is notified on state change"
      - fieldname: bulkTransitionSupport
        description: "Yes | No — whether multiple accounts can transition at once"
      - fieldname: automatedTransitions
        description: "Transitions triggered automatically (inactivity → deactivated, expiry → deleted)"
      - fieldname: transitionUndoPolicy
        description: Which transitions are reversible and within what time window
  ssacm-form:
    fields:
      - fieldname: profileUpdateEnabled
        description: "Yes | No — users can update their own profile information"
      - fieldname: passwordChangeEnabled
        description: "Yes | No — users can change their own password"
      - fieldname: passwordResetEnabled
        description: "Yes | No — users can reset forgotten passwords"
      - fieldname: passwordResetMethods
        description: "Email | SMS | SecurityQuestions | AdminAssisted"
      - fieldname: mfaEnrollmentSelfService
        description: "Yes | No — users can enroll/change MFA devices"
      - fieldname: accountDeactivationSelfService
        description: "Yes | No — users can deactivate their own account"
      - fieldname: accountDeletionSelfService
        description: "Yes | No — users can request deletion of their own account"
      - fieldname: dataExportSelfService
        description: "Yes | No — users can export their own data"
      - fieldname: sessionManagementSelfService
        description: "Yes | No — users can view and terminate their active sessions"
      - fieldname: apiKeyManagementSelfService
        description: "Yes | No — users can create/revoke their own API keys"
      - fieldname: notificationPreferences
        description: "Yes | No — users can configure their notification preferences"
      - fieldname: delegationEnabled
        description: "Yes | No — users can delegate account actions to another user"
      - fieldname: delegationScope
        description: "What actions can be delegated (read, write, approve)"
      - fieldname: accountRecoveryProcess
        description: "Steps when a user loses all credentials (identity re-proofing, admin reset)"
  saclc-serv-form:
    fields:
      - fieldname: serviceAccountTypes
        description: "API Client | Bot | SystemIntegration | ScheduledJob | DeviceIdentity"
      - fieldname: creationProcess
        description: "How service accounts are created (admin, DevOps pipeline, self-service)"
      - fieldname: creationApproval
        description: "Who approves service account creation (security team, admin)"
      - fieldname: ownerAssignment
        description: "Yes | No — whether each service account must have a human owner"
      - fieldname: ownerReviewFrequency
        description: "How often owners must recertify service accounts (quarterly, annually)"
      - fieldname: credentialRotationPolicy
        description: "How often credentials (keys, secrets, certificates) must be rotated"
      - fieldname: credentialStorageMethod
        description: "VaultService | EnvironmentVariable | SecretManager | HSM"
      - fieldname: scopeLimitation
        description: Principle of least privilege — minimum permissions for service accounts
      - fieldname: ipRestriction
        description: "Yes | No — whether service accounts are restricted to specific IPs"
      - fieldname: expirationPolicy
        description: "Whether service accounts expire and after how long (e.g., 1y, never)"
      - fieldname: renewalProcess
        description: Steps to renew an expiring service account
      - fieldname: decommissioningProcess
        description: "How service accounts are retired (revoke, archive, delete)"
      - fieldname: monitoringRequirements
        description: "Anomaly detection, usage thresholds, alerting for service accounts"
      - fieldname: serviceAccountNamingConvention
        description: "Naming pattern for service accounts (e.g., svc-{app}-{environment})"
      - fieldname: documentationRequirements
        description: "What must be documented for each service account (purpose, owner, scope)"
  mc-form:
    fields:
      - fieldname: mfaRequired
        description: "Yes | No | Conditional — whether MFA is mandatory"
      - fieldname: mfaEnforcementScope
        description: "AllUsers | AdminOnly | PrivilegedRoles | ExternalAccess | Conditional"
      - fieldname: defaultSecondFactor
        description: "TOTP | Push | FIDO2 | SMS | Email | HardwareToken"
      - fieldname: allowedSecondFactors
        description: Comma-separated list of permitted second-factor types
      - fieldname: assuranceLevelTarget
        description: "AAL1 | AAL2 | AAL3 — target NIST authentication assurance level"
      - fieldname: phishingResistanceRequired
        description: "Yes | No — whether phishing-resistant authenticators are required (AAL3)"
      - fieldname: stepUpAuthenticationEnabled
        description: "Yes | No — whether sensitive operations trigger higher AAL re-authentication"
      - fieldname: stepUpTriggers
        description: "Operations that trigger step-up (payment, admin actions, data export)"
      - fieldname: rememberDevicePolicy
        description: "Duration a device is remembered before MFA re-prompt (e.g., 30d, never)"
      - fieldname: recoveryCodePolicy
        description: How many one-time recovery codes are issued and their validity
      - fieldname: enrollmentGracePeriod
        description: "Time allowed for users to enroll MFA after it becomes required (e.g., 14d)"
      - fieldname: mfaBypassPolicy
        description: "Conditions under which MFA can be bypassed (break-glass, service accounts)"
  sp-form:
    fields:
      - fieldname: ssoEnabled
        description: "Yes | No — whether SSO is implemented"
      - fieldname: ssoProtocol
        description: "SAML2.0 | OIDC | OAuth2 | WS-Federation | Kerberos"
      - fieldname: identityProviderType
        description: "Internal | External | Hybrid — where the IdP is hosted"
      - fieldname: identityProviderProduct
        description: "Specific IdP product or service (e.g., Keycloak, Azure AD, Okta, Auth0)"
      - fieldname: federationProtocol
        description: "Protocol for cross-organization federation (SAML, OIDC, SCIM)"
      - fieldname: attributeMapping
        description: How IdP attributes map to application roles and permissions
      - fieldname: justInTimeProvisioning
        description: "Yes | No — whether accounts are auto-created on first SSO login"
      - fieldname: sessionSynchronization
        description: "Yes | No — whether logout from one app logs out all SSO-connected apps"
      - fieldname: singleLogoutEnabled
        description: "Yes | No — whether SLO (Single Logout) is implemented across services"
      - fieldname: ssoFallbackMethod
        description: "Local password | Backup IdP | None — fallback when IdP is unavailable"
      - fieldname: ssoScopePolicy
        description: "Which applications are included in SSO (all, internal only, selected)"
      - fieldname: externalIdpTrustPolicy
        description: Validation requirements for external identity providers
  cap-form:
    fields:
      - fieldname: certificateAuthEnabled
        description: "Yes | No — whether certificate-based authentication is supported"
      - fieldname: certificateTypes
        description: "X.509 | PIV | CAC | SmartCard — types of certificates accepted"
      - fieldname: certificateIssuance
        description: "InternalCA | ExternalCA | SelfSigned — who issues the certificates"
      - fieldname: certificateAuthority
        description: CA product or service used for certificate issuance
      - fieldname: keyStorageRequirement
        description: "TPM | HSM | SmartCard | SoftwareKeystore — where private keys must be stored"
      - fieldname: mutualTlsRequired
        description: "Yes | No — whether mTLS (client certificate) is required for API access"
      - fieldname: certificateValidation
        description: "OCSP | CRL | OCSP-Stapling — certificate revocation checking method"
      - fieldname: certificateLifetime
        description: "Maximum validity period for certificates (e.g., 1y, 2y)"
      - fieldname: renewalProcess
        description: "Automatic | Manual | AdminApproval — certificate renewal method"
      - fieldname: revocationProcess
        description: How compromised certificates are revoked and propagated
      - fieldname: minimumKeyStrength
        description: "RSA-2048 | RSA-4096 | EC-P256 | EC-P384 — minimum key requirements"
      - fieldname: fipsComplianceRequired
        description: "Yes | No — whether FIPS 140-2/3 validated modules are required"
  bap-form:
    fields:
      - fieldname: biometricAuthEnabled
        description: "Yes | No — whether biometric authentication is supported"
      - fieldname: biometricModalities
        description: "Fingerprint | FacialRecognition | IrisScan | VoicePrint — supported modalities"
      - fieldname: biometricUsageContext
        description: "DeviceUnlock | TransactionApproval | MfaActivation — when biometrics are used"
      - fieldname: biometricAsActivationFactor
        description: "Yes | No — whether biometric is used as MFA activation factor per NIST guidance"
      - fieldname: localVsCentralComparison
        description: "Local | Central — where biometric comparison is performed (local preferred)"
      - fieldname: falseMatchRateTarget
        description: "Target FMR (e.g., 1:10000 per NIST SP 800-63B)"
      - fieldname: presentationAttackDetection
        description: "Yes | No — whether PAD is implemented (required for facial recognition)"
      - fieldname: maxConsecutiveFailures
        description: "Maximum failed biometric attempts before fallback (e.g., 5 without PAD, 10 with PAD)"
      - fieldname: fallbackMethod
        description: "PIN | Password | AlternateModality — fallback when biometric fails"
      - fieldname: biometricDataStorage
        description: "DeviceOnly | EncryptedCentral | Never — where biometric templates are stored"
      - fieldname: privacyConsiderations
        description: "Consent requirements, data retention policy, right to withdraw"
      - fieldname: accessibilityAlternative
        description: Alternative authentication for users unable to use biometric modalities
  akmp-form:
    fields:
      - fieldname: apiKeyAuthEnabled
        description: "Yes | No — whether API key authentication is supported"
      - fieldname: apiKeyTypes
        description: "Static | Rotating | Scoped | ShortLived — types of API keys supported"
      - fieldname: keyGenerationMethod
        description: "Cryptographic random | UUID | JWT — how API keys are generated"
      - fieldname: keyLength
        description: "Minimum key length or entropy (e.g., 256-bit, 32 bytes)"
      - fieldname: keyRotationPolicy
        description: "Rotation frequency and method (e.g., 90d, automatic, manual)"
      - fieldname: keyExpirationPolicy
        description: "Maximum key lifetime (e.g., 1y, never, custom)"
      - fieldname: keyScopeRestrictions
        description: "Yes | No — whether API keys can be limited to specific resources/actions"
      - fieldname: ipAllowlisting
        description: "Yes | No — whether API keys can be restricted to specific IP addresses"
      - fieldname: rateLimitingPerKey
        description: "Yes | No — whether rate limiting is enforced per API key"
      - fieldname: keyRevocationProcess
        description: "Immediate | Graceful — how revoked keys stop working"
      - fieldname: keyStorageGuidance
        description: "VaultService | EnvironmentVariable | SecretManager — recommended storage"
      - fieldname: keyAuditLogging
        description: "Yes | No — whether API key usage is logged for audit purposes"
      - fieldname: serviceTokenSupport
        description: "OAuth2ClientCredentials | JWT | Custom — machine-to-machine token types"
      - fieldname: tokenLifetime
