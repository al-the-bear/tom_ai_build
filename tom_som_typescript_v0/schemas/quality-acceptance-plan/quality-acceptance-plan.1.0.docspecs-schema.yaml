form-types:
  qlfwk-fram-form:
    fields:
      - fieldname: qualityModel
        description: "ISO 25010, McCall, Boehm, custom"
      - fieldname: qualityModelVersion
        description: Specific version of quality model
      - fieldname: qualityModelAdaptations
        description: How standard model is adapted for this project
  qfobj-form:
    fields:
      - fieldname: objectivesHierarchy
        description: How quality objectives are structured
      - fieldname: objectivesAlignment
        description: How quality objectives align with business goals
      - fieldname: objectivesMeasurability
        description: "All objectives SMART, key objectives only"
  qftrd-form:
    fields:
      - fieldname: primaryQualityAttribute
        description: Most important attribute when trade-offs required
      - fieldname: secondaryQualityAttribute
        description: Attribute yielded when the primary attribute takes precedence
      - fieldname: tradeOffApproach
        description: How conflicts between attributes are resolved
      - fieldname: qualityCompromiseAuthority
        description: Who can authorize quality trade-offs
  qfver-form:
    fields:
      - fieldname: verificationStrategy
        description: "Testing, review, analysis, demonstration"
      - fieldname: verificationCoverage
        description: "All attributes, critical only, risk-based"
      - fieldname: defectClassification
        description: "Critical, major, minor, trivial"
      - fieldname: defectPriorityScheme
        description: "P1-P5, urgent/high/medium/low"
  qcadf-form:
    fields:
      - fieldname: categoryDescription
        description: Purpose and scope of this category
      - fieldname: categoryScope
        description: What aspects of quality this covers
      - fieldname: categoryPriority
        description: "Critical, high, medium, low"
      - fieldname: categoryRationale
        description: Why this priority level
  qcarl-form:
    fields:
      - fieldname: parentCategory
        description: Higher-level category if hierarchical
      - fieldname: relatedCategories
        description: Categories that interact with this one
      - fieldname: conflictingCategories
        description: Categories that may trade off against this
  qcagv-form:
    fields:
      - fieldname: categoryOwner
        description: Role responsible for this quality area
      - fieldname: reviewFrequency
        description: How often category metrics are reviewed
      - fieldname: escalationThreshold
        description: When category issues escalate
