name: full_lifecycle_walkthrough
description: >-
  TomSpecs sample — one small project carried through the phases in order,
  with every quality gate run: idea, blueprint, detailed specifications,
  CodeSpecs, derived tests, implementation.
publish_to: none

environment:
  sdk: ^3.11.4

# Hosted versions only (tom_specs_documentation_standard.md §7.1).
# tom_specs_model is here for `somCodeSpecsAreas`, the accessor over the
# CodeSpecs area catalogue Phase 4's extract pass walks. The catalogue also
# ships as generated-doc/codespecs/codespecs_areas.json; the accessor is the
# form a Dart consumer imports, and the file is what the other eight runtimes
# read (SOM §10.3).
dependencies:
  tom_som_dart_v0: ^1.3.0
  tom_som_dart_runtime: ^1.3.0
  tom_specs_model: ^1.3.0

# Phase 5 derives a test suite and Phase 6 implements against it, so unlike the
# other samples this one has a real `test/` folder and needs a test runner.
dev_dependencies:
  test: ^1.25.0
