    REQS requirements:
      content: |2-
        Functional:

        - capture orders from EDI and REST
        - validate against credit and stock
        - price synchronously and reserve stock
        - confirm within 5 minutes
        - support partial amendments and cancellations before dispatch

        Non-functional:

        - 99.9% capture-API availability
        - p95 confirmation latency < 30s
        - full audit trail
        - GDPR-compliant handling of customer data with a 7-year retention policy on
          order records
    SOAT solutionArchitectureAndTechnology:
      content: |2-
        Event-sourced order service (Dart/Flutter back office, Kotlin domain services)
        on Kubernetes, backed by PostgreSQL for read models and a managed Kafka cluster
        for the event backbone.

        The public order API is an API-gateway-fronted REST surface; EDI ingestion runs
        as an adapter that translates to the same command API. Infrastructure is
        provisioned as code.
      TECH technicalFramework:
        SDR softwareDesign:
          LAMS layeringAndModuleStructure:
            BCE-BOUN-LST boundedContexts:
              BCE-BOUN-1:
                headline: |2-
                  Ordering
                content:
                  contextName: |2-
                    Ordering
                  domainArea: |2-
                    Order capture and fulfilment
                  owningTeam: |2-
                    Order Management
                BCES scope:
                  purpose: |2-
                    Owns the order aggregate and its lifecycle from capture to dispatch.
              BCE-BOUN-2:
                headline: |2-
                  Customer
                content:
                  contextName: |2-
                    Customer
                  domainArea: |2-
                    Customer master data
                  owningTeam: |2-
                    Order Management
                BCES scope:
                  purpose: |2-
                    Owns customer identity and the credit standing orders are checked against.
              BCE-BOUN-3:
                headline: |2-
                  Catalogue
                content:
                  contextName: |2-
                    Catalogue
                  domainArea: |2-
                    Product catalogue and pricing
                  owningTeam: |2-
                    Order Management
                BCES scope:
                  purpose: |2-
                    Owns the product master and the price list orders are priced from.
    SAAM securityAndAccessModel:
      content: |2-
        Access is role-based:

        - Order Clerk
        - Order Supervisor (may release holds)
        - Pricing Admin
        - Integration (machine) accounts scoped to specific channels

        All customer PII is encrypted at rest; the public API uses OAuth2 client
        credentials with per-partner rate limits. Every state transition is attributed
        to an authenticated principal in the audit log.
      ACCM accessControl:
        USAU authorization:
          AZRO-ROLE-LST roleDefinitions:
            AZRO-ROLE-1:
              headline: |2-
                Order Clerk
              content:
                roleName: |2-
                  Order Clerk
                description: |2-
                  Works the order queue: captures, amends, and confirms orders.
                roleCategory: |2-
                  Business
              ARES structure:
                roleScope: |2-
                  Global
                inheritsFrom: |2-
                  none
                permissionSet: |2-
                  order.read, order.amend
            AZRO-ROLE-2:
              headline: |2-
                Order Supervisor
              content:
                roleName: |2-
                  Order Supervisor
                description: |2-
                  Everything a clerk may do, plus releasing credit and stock holds.
                roleCategory: |2-
                  Business
              ARES structure:
                roleScope: |2-
                  Global
                inheritsFrom: |2-
                  Order Clerk
                permissionSet: |2-
                  order.read, order.amend, order.hold.release
          ENT-ENTI-LST entitlements:
            ENT-ENTI-1:
              headline: |2-
                order.read
              content:
                entitlementName: |2-
                  order.read
                description: |2-
                  See orders in the work list and open their detail.
                accessType: |2-
                  Read
            ENT-ENTI-2:
              headline: |2-
                order.amend
              content:
                entitlementName: |2-
                  order.amend
                description: |2-
                  Change quantities and lines on an order that is not yet dispatched.
                accessType: |2-
                  Write
            ENT-ENTI-3:
              headline: |2-
                order.hold.release
              content:
                entitlementName: |2-
                  order.hold.release
                description: |2-
                  Release a credit or stock hold placed on an order.
                accessType: |2-
                  Approve
    XID experienceAndInterfaceDesign:
      content: |2-
        The operations back office is a single-page application organised around the
        order queue. The primary screen is a state-filtered work list; selecting an
        order opens a lifecycle timeline with inline actions (release hold, amend line,
        cancel).

        Design priorities:

        - keyboard-first navigation for high-volume clerks
        - an unambiguous status colour language shared with the public tracking page
