    fields:
      - fieldname: totalSecurityRequirements
        description: Total count of security requirements captured
      - fieldname: criticalCount
        description: Number of requirements at Critical priority
      - fieldname: highCount
        description: Number of requirements at High priority
      - fieldname: mediumCount
        description: Number of requirements at Medium priority
      - fieldname: securityFramework
        description: Primary framework guiding the requirements
      - fieldname: complianceRequirements
        description: Regulations the system must comply with
      - fieldname: threatCategories
        description: Classes of attack the requirements mitigate
  sereencl-form:
    fields:
      - fieldname: category
        required: true
        description: Security domain the requirement falls under
      - fieldname: subcategory
        description: More specific aspect within the category
      - fieldname: priority
        required: true
        description: "Critical, High, Medium, or Low"
      - fieldname: source
        required: true
        description: "Stakeholder, standard, or document that originated it"
      - fieldname: rationale
        description: Why this security requirement is needed
      - fieldname: threatMitigated
        description: Attack or risk this requirement prevents
      - fieldname: dataClassification
        description: Sensitivity of data the requirement protects
