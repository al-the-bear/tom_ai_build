name: tom_specs_reviewer
description: "Tree browser and structure-review tool for the TomSpecs object model, used to gather observations for further development of tom_specs_model."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  yaml: ^3.1.2
  path: ^1.9.0
  # The official generic TomSpecs object-model runtime (SOM §9). The reviewer
  # consumes its meta-model access classes (SpecModel / SpecRoot / SpecClass /
  # SpecField / FormFieldSpec / SpecFieldKind) instead of an in-tree copy.
  tom_som_dart_runtime:
    path: ../tom_som_dart_runtime
  # The TomSpecs annotation package, for the canonical `CodeSpecPart` vocabulary
  # a reviewer picks from when proposing a CodeSpecs mapping. Sourcing the enum
  # rather than the shipped model asset keeps every declared kind proposable —
  # including one no section maps to yet, which is precisely the case a reviewer
  # needs to be able to record.
  tom_specs_core:
    path: ../tom_specs_core
  # NOT here, by design: `tom_som_dart_v0`, the typed facade
  # (D00SolutionBlueprint over a SpecDocument). It earns its keep by making
  # document EDITS correctness-checked by the generated model — and this app
  # loads the class graph, never a document, so there is nothing for it to
  # check. Adding it would mean first giving the reviewer a document plane it
  # deliberately does not have, which is tom_forge/tom_specs_editor's job.
  # See tom_specs_reviewer_specification.md §2.4.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/spec_model.json
