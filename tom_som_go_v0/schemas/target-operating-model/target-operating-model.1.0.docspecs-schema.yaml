form-types:
  pvovw-form:
    fields:
      - fieldname: visionStatement
        description: One or two sentences describing the future-state process
      - fieldname: strategicAlignment
        description: Link processes to strategic goals
      - fieldname: transformationTheme
        description: "The unifying theme of the change (e.g. digital, automation)"
      - fieldname: targetMaturityLevel
        description: Desired maturity level to reach
      - fieldname: timeHorizon
        description: Timeframe for achieving the vision
      - fieldname: keyEnabler
        description: What must be in place to enable the vision
      - fieldname: changeScope
        description: How wide and deep the change reaches
      - fieldname: stakeholderImpact
        description: Groups affected and the nature of impact
  prsuc-form:
    fields:
      - fieldname: kpiTargets
        description: Concrete KPI values that signal success
      - fieldname: timeToValue
        description: How soon benefits should appear
      - fieldname: adoptionTargets
        description: Expected user adoption levels
      - fieldname: qualityTargets
        description: Target defect or error rates
      - fieldname: performanceTargets
        description: Target response time or throughput
      - fieldname: userSatisfaction
        description: Target satisfaction or NPS scores
      - fieldname: businessOutcomes
        description: Expected business-level outcomes
      - fieldname: measurementApproach
        description: How and when success is measured
  dpovw-form:
    fields:
      - fieldname: principlePhilosophy
        description: The guiding philosophy behind the principles
      - fieldname: priorityOrder
        description: How competing principles are ranked
      - fieldname: exceptionHandling
        description: How deviations from principles are handled
      - fieldname: continuousImprovement
        description: How principles adapt over time
  pcovw-form:
    fields:
      - fieldname: totalProcessCount
        description: Number of processes in the catalog
      - fieldname: scopeStatement
        description: What the catalog does and does not cover
      - fieldname: classificationFramework
        description: Framework used to classify processes
      - fieldname: namingConvention
        description: Rules for naming processes
      - fieldname: idConvention
        description: Rules for assigning process IDs
      - fieldname: processOwnership
        description: How process owners are determined
      - fieldname: governanceModel
        description: How process changes are controlled
      - fieldname: versioningApproach
        description: How process versions are tracked
  prccl-form:
    fields:
      - fieldname: level1Categories
        description: Top-level process categories
      - fieldname: level2Breakdown
        description: Major process groups within each category
      - fieldname: level3Detail
        description: Specific processes at the detailed level
      - fieldname: crossFunctional
        description: Processes that cross organisational boundaries
      - fieldname: customerFacing
        description: Processes with direct customer contact
      - fieldname: valueDriving
        description: Processes central to the value chain
      - fieldname: supportProcesses
        description: Enabling or support processes
      - fieldname: managementProcesses
        description: Governance and strategic processes
  picls-form:
    fields:
      - fieldname: parentProcess
        description: The higher-level process this rolls up to
      - fieldname: processCategory
        description: The category the process falls into
      - fieldname: processType
        description: The functional type of the process
  pidef-form:
    fields:
      - fieldname: description
        description: What the process actually does
      - fieldname: purpose
        description: Why the process exists
      - fieldname: scope
        description: Where the process starts and ends
  pigov-form:
    fields:
      - fieldname: processOwner
        description: Role or person accountable for the process
      - fieldname: processManager
        description: Role responsible for daily operation
      - fieldname: effectiveDate
        description: Date the process becomes active
      - fieldname: version
        description: Current version of the process
      - fieldname: status
        description: Lifecycle status of the process
  pcops-form:
    fields:
      - fieldname: criticality
        description: How business-critical the process is
      - fieldname: automationLevel
        description: Share of the process that is automated
      - fieldname: straightThroughRate
        description: Share completed with no human touch
      - fieldname: exceptionRate
        description: Share needing manual intervention
  pcbiz-form:
    fields:
      - fieldname: volumeEstimate
        description: Expected number of cases per period
      - fieldname: seasonality
        description: Seasonal demand variation
      - fieldname: valueAdded
        description: Value the process contributes
      - fieldname: costDriver
        description: Main factors that drive process cost
  tgovw-form:
    fields:
      - fieldname: primaryTrigger
        description: The most common way the process starts
      - fieldname: triggerChannel
        description: Channel through which triggers arrive
      - fieldname: triggerFrequency
        description: How often the process is triggered
      - fieldname: peakTriggerTime
        description: When trigger volume peaks
      - fieldname: preTriggerState
        description: System state expected before triggering
  inouov-form:
    fields:
      - fieldname: inputSummary
        description: High-level overview of required inputs
      - fieldname: outputSummary
        description: High-level overview of produced outputs
      - fieldname: dataFlowSummary
        description: How data flows through the process
  prroov-form:
    fields:
      - fieldname: primaryActor
        description: The main role that executes the process
      - fieldname: processOwner
        description: Role accountable for process outcomes
      - fieldname: supportRoles
        description: Roles that assist the process
      - fieldname: escalationPath
        description: Who issues are escalated to
      - fieldname: raciSummary
        description: Overview of the RACI assignments
  pree-form:
    fields:
      - fieldname: stepsInvolved
        description: List the steps this role performs
      - fieldname: decisionAuthority
        description: State the decisions this role may make
      - fieldname: skillsRequired
        description: List the competencies the role needs
      - fieldname: systemAccess
        description: Name the system permissions required
  prec-form:
    fields:
      - fieldname: availability
        description: Describe required availability windows
      - fieldname: backupRole
        description: Name the role that covers absences
      - fieldname: handoffTo
        description: List downstream roles receiving work
      - fieldname: handoffFrom
        description: List upstream roles supplying work
  prpeov-form:
    fields:
      - fieldname: targetCycleTime
        description: Give the expected end-to-end duration
      - fieldname: targetThroughput
        description: Give the expected cases per period
      - fieldname: targetQuality
        description: State the target error/first-time-right rate
      - fieldname: targetCost
        description: Give the target cost per transaction
      - fieldname: targetCustomerSat
        description: Give the CSAT/NPS satisfaction target
      - fieldname: monitoringFrequency
        description: State how often metrics are reviewed
      - fieldname: dashboardLocation
        description: Name where the metrics dashboard lives
      - fieldname: improvementGoals
        description: State improvement targets for next period
  pkem-form:
    fields:
      - fieldname: unit
        description: State the unit of measurement
      - fieldname: targetValue
        description: Give the target value to achieve
      - fieldname: thresholds
        description: Define the RAG threshold boundaries
      - fieldname: dataSource
        description: Name the source of the data
  pkeo-form:
    fields:
      - fieldname: calculationFrequency
        description: State how often the KPI is calculated
      - fieldname: reportingFrequency
        description: State how often the KPI is reported
      - fieldname: owner
        description: Name the accountable owner
      - fieldname: improvementLever
        description: Describe how to move the KPI
  prcoov-form:
    fields:
      - fieldname: controlFramework
        description: Name the governing control framework
      - fieldname: riskLevel
        description: State the inherent risk level
      - fieldname: complianceRequirements
        description: List applicable regulations/standards
      - fieldname: auditFrequency
        description: State how often the process is audited
      - fieldname: segregationOfDuties
        description: Describe duty separation rules
      - fieldname: approvalMatrix
        description: Define who approves which actions
      - fieldname: documentationRequirements
        description: List what must be documented
      - fieldname: retentionRequirements
        description: State record retention periods
  pceo-form:
    fields:
      - fieldname: controlDescription
        description: Describe what the control does
      - fieldname: riskAddressed
        description: State the risk it mitigates
      - fieldname: controlOwner
        description: Name the responsible owner
      - fieldname: frequency
        description: State how often the control runs
      - fieldname: automation
        description: State the automation level
  pcev-form:
