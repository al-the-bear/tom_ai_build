      - fieldname: impactedUserCount
        description: Approximate number of people affected
      - fieldname: changeType
        description: "Behavioral, Procedural, Structural, or Cultural"
      - fieldname: changeComplexity
        description: "Low, Medium, or High"
      - fieldname: resistance
        description: "Anticipated resistance: Low, Medium, or High"
  orep-form:
    fields:
      - fieldname: timeline
        description: When the change must be completed
      - fieldname: dependencies
        description: Other changes that must happen first
      - fieldname: owner
        description: Person or role accountable for the change
      - fieldname: sponsor
        description: Leadership sponsor backing the change
      - fieldname: successCriteria
        description: How success of the change is defined
      - fieldname: measurementMethod
        description: How success criteria are measured
      - fieldname: status
        required: true
        description: "Draft, Proposed, Approved, In Progress, or Completed"
  orip-plan-form:
    fields:
      - fieldname: approach
        description: "Big Bang, Phased, Pilot, or Parallel rollout"
      - fieldname: phases
        description: "Sequence of phases, if phased"
      - fieldname: pilotGroup
