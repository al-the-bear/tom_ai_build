        description: Start/Center/End/Stretch
  seeb-form:
    fields:
      - fieldname: visibilityCondition
        description: When this element is shown
      - fieldname: enabledCondition
        description: When this element is interactive
      - fieldname: readonlyCondition
        description: When this element is read-only
      - fieldname: requiredPermission
        description: Permission needed to see/interact
      - fieldname: permissionEffect
        description: Hide/Disable/Readonly
  scelenpr-form:
    fields:
      - fieldname: styleVariant
        description: Primary/Secondary/Danger/Subtle/Custom
