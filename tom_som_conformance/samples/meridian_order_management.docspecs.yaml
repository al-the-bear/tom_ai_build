    requirements:
      content: |2-
        Functional:

        - capture orders from EDI and REST
        - validate against credit and stock
        - price synchronously and reserve stock
        - confirm within 5 minutes
        - support partial amendments and cancellations before dispatch

        Non-functional:

        - 99.9% capture-API availability
        - p95 confirmation latency < 30s
        - full audit trail
        - GDPR-compliant handling of customer data with a 7-year retention policy on
          order records
    solutionArchitectureAndTechnology:
      content: |2-
        Event-sourced order service (Dart/Flutter back office, Kotlin domain services)
        on Kubernetes, backed by PostgreSQL for read models and a managed Kafka cluster
        for the event backbone.

        The public order API is an API-gateway-fronted REST surface; EDI ingestion runs
        as an adapter that translates to the same command API. Infrastructure is
        provisioned as code.
    securityAndAccessModel:
      content: |2-
        Access is role-based:

        - Order Clerk
        - Order Supervisor (may release holds)
        - Pricing Admin
        - Integration (machine) accounts scoped to specific channels

        All customer PII is encrypted at rest; the public API uses OAuth2 client
        credentials with per-partner rate limits. Every state transition is attributed
        to an authenticated principal in the audit log.
    experienceAndInterfaceDesign:
      content: |2-
        The operations back office is a single-page application organised around the
        order queue. The primary screen is a state-filtered work list; selecting an
        order opens a lifecycle timeline with inline actions (release hold, amend line,
        cancel).

        Design priorities:

        - keyboard-first navigation for high-volume clerks
        - an unambiguous status colour language shared with the public tracking page
      screens:
        screenInventory:
          SCREN-ITEM-LST items:
            SCREN-ITEM-1:
              content:
                screenId: |2-
                  SCR-01
                screenName: |2-
                  Order Work List
                purpose: |2-
                  The single, state-filtered queue from which clerks work every order.
              classification:
                content:
                  screenCategory: |2-
                    List
                  routePattern: |2-
                    /orders
              access:
                content:
                  accessLevel: |2-
                    Authenticated
                  requiredRoles: |2-
                    Order Clerk, Order Supervisor
                  permissionEffect: |2-
                    Allow
              traceability:
                content:
                  relatedUseCases: |2-
                    UC-01, UC-02
                  relatedRequirements: |2-
                    FR-01, FR-04, FR-06
                  dataEntities: |2-
                    Order
                  primaryAction: |2-
                    Open selected order
              presentation:
                content:
                  pageTitleResource: |2-
                    screen.orders.title
                  layout: |2-
                    Master-detail
              sections:
                SCRSC-ITEM-LST items:
                  SCRSC-ITEM-1:
                    content:
                      sectionId: |2-
                        SCR-01-SEC-1
                      sectionName: |2-
                        State filter bar
                      purpose: |2-
                        Filter the queue by lifecycle state.
                      sectionType: |2-
                        Toolbar
                    layout:
                      content:
                        layoutDirection: |2-
                          Horizontal
                        displayOrder: 1
                    SCREL-ELEM-LST elements:
                      SCREL-ELEM-1:
                        content:
                          elementId: |2-
                            SCR-01-EL-1
                          elementName: |2-
                            State selector
                          elementType: |2-
                            SegmentedControl
                        resources:
                          content:
                            labelResource: |2-
                              screen.orders.filter.state
                            hintResource: |2-
                              screen.orders.filter.state.hint
                  SCRSC-ITEM-2:
                    content:
                      sectionId: |2-
                        SCR-01-SEC-2
                      sectionName: |2-
                        Order table
                      purpose: |2-
                        The work list itself, keyboard-navigable for high-volume clerks.
                      sectionType: |2-
                        DataTable
                    layout:
                      content:
                        layoutDirection: |2-
                          Vertical
                        displayOrder: 2
                    SCREL-ELEM-LST elements:
                      SCREL-ELEM-1:
                        content:
                          elementId: |2-
                            SCR-01-EL-2
                          elementName: |2-
                            Order ID column
                          elementType: |2-
                            TextField
                        fieldSpec:
                          content:
                            fieldName: |2-
                              orderId
                            dataType: |2-
                              UUID
                      SCREL-ELEM-2:
                        content:
                          elementId: |2-
                            SCR-01-EL-3
                          elementName: |2-
                            Status column
                          elementType: |2-
                            StatusChip
                        fieldSpec:
                          content:
                            fieldName: |2-
                              status
                            dataType: |2-
                              Enum
              actions:
                SCRAC-ITEM-LST items:
                  SCRAC-ITEM-1:
                    content:
                      actionId: |2-
                        SCR-01-ACT-1
                      actionName: |2-
                        Open order
                      actionType: |2-
                        Navigate
