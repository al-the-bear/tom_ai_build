      - fieldname: sourceAttribute
        description: Source field name for migration mapping
      - fieldname: transformationRule
        description: Transformation applied during migration/ETL
      - fieldname: dataLineage
        description: Upstream sources that feed this attribute
      - fieldname: qualityRules
        description: "Data quality checks (e.g., completeness, accuracy)"
  keagn-form:
