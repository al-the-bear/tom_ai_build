form-types:
  stagas-form:
    fields:
      - fieldname: approachDescription
        description: Brief description of how the staging approach will be applied
      - fieldname: alternativesConsidered
        description: Other staging approaches evaluated and why rejected
      - fieldname: selectionCriteria
        description: Criteria used to select this approach
  stagrt-form:
    fields:
      - fieldname: riskReductionRationale
        description: How this approach reduces project and deployment risk
      - fieldname: earlyValueRationale
        description: How this approach enables early value delivery
      - fieldname: resourceOptimizationRationale
        description: How this approach optimizes resource utilization
      - fieldname: businessContinuityRationale
        description: How this approach ensures business operations continue
  stagrk-form:
    fields:
      - fieldname: riskTolerance
        description: Low / Medium / High — acceptable level of risk
      - fieldname: deploymentRiskFactors
        description: Key risk factors specific to deployment
      - fieldname: mitigationStrategies
        description: Risk mitigation strategies
      - fieldname: contingencyPlans
        description: Backup plans if primary approach fails
      - fieldname: rollbackTriggers
        description: Criteria that would trigger a rollback
  stagcx-form:
    fields:
      - fieldname: complexityAssessment
        description: Low / Medium / High / VeryHigh
      - fieldname: complexityFactors
        description: Primary sources of complexity
      - fieldname: integrationComplexity
        description: Level of integration needed during staging
      - fieldname: dataMigrationComplexity
        description: Complexity of data migration
      - fieldname: userImpactComplexity
        description: Complexity of user impact management
  stagrd-form:
    fields:
      - fieldname: organizationalReadinessFactors
        description: Key readiness factors
      - fieldname: organizationalReadinessLevel
        description: Low / Medium / High
      - fieldname: resourceConstraints
        description: "Staffing, budget, or infrastructure limits"
      - fieldname: skillAvailability
        description: Critical skills needed and their availability
      - fieldname: trainingRequirements
        description: Training needed per stage
      - fieldname: supportCapacity
        description: Support team capacity during transition
  stagco-form:
    fields:
      - fieldname: rollbackStrategyType
        description: FullRollback / PartialRollback / ForwardFix / NoRollback
      - fieldname: rollbackProcedure
        description: Overview of rollback procedure
      - fieldname: rollbackTimeWindow
        description: Maximum duration for rollback after deployment
      - fieldname: parallelOperationDuration
        description: Expected duration of parallel system operation
      - fieldname: parallelOperationStrategy
        description: How parallel systems will operate
      - fieldname: cutoverMethodology
        description: PilotThenExpand / InstantCutover / BlueGreen / Canary
      - fieldname: cutoverWindowPreference
        description: Preferred timing for cutovers
      - fieldname: cutoverDuration
        description: Expected duration of cutover activities
      - fieldname: cutoverCriteria
        description: Criteria that must be met before cutover
  stagsc-form:
    fields:
      - fieldname: successCriteria
        description: Criteria for declaring a stage successful
      - fieldname: keyMetrics
        description: Metrics to track during staging
      - fieldname: stabilizationPeriod
        description: Time period after deployment to monitor
      - fieldname: goNoGoCheckpoints
        description: Key decision points before each stage
      - fieldname: acceptanceCriteria
        description: Formal acceptance criteria for stage completion
  stagcm-form:
    fields:
      - fieldname: communicationStrategyOverview
        description: How staging progress will be communicated
      - fieldname: communicationChannels
        description: Channels for communication
      - fieldname: communicationCadence
        description: Frequency of communications
      - fieldname: changeManagementAlignment
        description: How staging aligns with change management plan
      - fieldname: changeChampions
        description: Roles who will champion the change
      - fieldname: feedbackMechanisms
        description: How user feedback will be collected
  stagfa-form:
    fields:
      - fieldname: pmMethodologyAlignment
        description: PMBOK / PRINCE2 / SAFe / Scrum / Hybrid
      - fieldname: piCadence
        description: SAFe Program Increment cadence if applicable
      - fieldname: stageBoundaryApproach
        description: PRINCE2 stage boundary management
      - fieldname: iterationCadence
        description: Iteration or sprint cadence within stages
      - fieldname: releaseTrainCadence
        description: SAFe release train cadence if applicable
  staggv-form:
    fields:
      - fieldname: governanceApproach
        description: How staging decisions will be governed
      - fieldname: approvalAuthority
        description: Who has authority to approve stage transitions
      - fieldname: escalationPath
        description: Escalation path for issues and decisions
      - fieldname: exceptionHandling
        description: How exceptions to the staging plan will be handled
  sgovm-form:
    fields:
      - fieldname: totalFeaturesPlanned
        description: "Total number of features or capabilities across all stages, e.g. 87 features"
      - fieldname: totalEpicsPlanned
        description: Total number of epics or major work packages across all stages
      - fieldname: totalStoriesEstimated
        description: Total user stories or work items estimated across all stages
      - fieldname: totalEffortPersonMonths
        description: "Aggregate effort across all stages in person-months, e.g. 240 person-months"
      - fieldname: averageStageDuration
        description: "Average duration of a single stage, e.g. 4.5 months"
      - fieldname: shortestStageDuration
        description: Duration of the shortest stage and which stage it is
      - fieldname: longestStageDuration
        description: Duration of the longest stage and which stage it is
  sgovbs-form:
    fields:
      - fieldname: baselineVersion
        description: "Version identifier of the current baseline plan, e.g. v2.1"
      - fieldname: baselineApprovalDate
        description: "Date the current baseline was formally approved, e.g. 2026-03-15"
      - fieldname: baselineApprovedBy
        description: Name or role of the person/board who approved the baseline
      - fieldname: plannedStartDate
        description: "Overall programme start date from baseline, e.g. 2026-04-01"
      - fieldname: plannedEndDate
        description: "Overall programme end date from baseline, e.g. 2027-09-30"
      - fieldname: lastPlanRevisionDate
        description: "Date the staging plan was last revised, e.g. 2026-06-01"
      - fieldname: revisionCount
        description: Number of baseline revisions since initial approval
      - fieldname: nextScheduledReview
        description: "Date of the next formal plan review, e.g. 2026-07-15"
  sgovdp-form:
    fields:
      - fieldname: criticalPathSummary
        description: Key activities on the critical path that determine overall duration
      - fieldname: criticalPathLength
        description: "Duration of the critical path in weeks/months, e.g. 14 months"
      - fieldname: crossStageDependencyCount
        description: "Total number of dependencies between stages, e.g. 12 dependencies"
      - fieldname: highRiskDependencies
        description: Cross-stage dependencies with highest risk of delay
      - fieldname: externalDependencyCount
        description: Number of dependencies on external parties
      - fieldname: longestLeadTimeItem
        description: Activity or procurement with the longest lead time across all stages
      - fieldname: interStagebufferDays
        description: "Average buffer time between consecutive stages, e.g. 10 working days"
  sgovrs-form:
    fields:
      - fieldname: peakTeamSize
        description: "Maximum team size across all stages, e.g. 24 FTEs"
      - fieldname: minimumTeamSize
        description: "Minimum team size during any stage, e.g. 8 FTEs"
      - fieldname: averageTeamSize
        description: Average team size weighted by stage duration
      - fieldname: resourceAllocationPattern
        description: FrontLoaded / EvenlyDistributed / BackLoaded / BellCurve
      - fieldname: internalResourcePercent
        description: Percentage of effort from internal staff vs external contractors
      - fieldname: keyRolesRequired
        description: Critical roles needed across stages
      - fieldname: sharedResourceConflicts
        description: Key resources shared across stages that may cause contention
      - fieldname: resourceOnboardingLeadTime
        description: "Average time needed to onboard new team members, e.g. 2-3 weeks"
  sgovbd-form:
    fields:
      - fieldname: budgetDistributionPattern
        description: FrontLoaded / EvenlyDistributed / BackLoaded
      - fieldname: contingencyReservePercent
        description: "Percentage of total budget reserved for contingency, e.g. 15%"
      - fieldname: contingencyReserveAmount
        description: "Absolute contingency amount, e.g. EUR 360K"
      - fieldname: managementReservePercent
        description: Percentage held back as management reserve for unknown risks
      - fieldname: expectedBurnRatePerMonth
        description: "Average monthly expenditure, e.g. EUR 130K/month"
      - fieldname: peakBurnRateMonth
        description: Month with highest expenditure and which stage drives it
      - fieldname: capitalVsOperationalSplit
        description: "Ratio of capital to operational expenditure, e.g. 60% CAPEX / 40% OPEX"
  sgovsc-form:
    fields:
      - fieldname: totalFloatDays
        description: "Total float available across the project, e.g. 30 days"
      - fieldname: freeFloatDistribution
        description: How free float is distributed across stages
      - fieldname: scheduleCompressionOptions
        description: Crashing / FastTracking / ScopeReduction
      - fieldname: scheduleCompressionLimit
        description: Maximum compression possible without unacceptable risk
      - fieldname: bufferAllocationPolicy
        description: How buffers are allocated — per-stage / project-level / critical-chain
      - fieldname: milestoneCount
        description: Total number of key milestones across all stages
  stovqu-form:
    fields:
      - fieldname: aggregateQualityTarget
        description: "Overall quality target — defect density, test coverage, pass rate"
      - fieldname: complianceMilestoneCount
        description: Number of regulatory or compliance milestones across all stages
      - fieldname: auditPointCount
        description: "Number of planned audit checkpoints, e.g. 6 audits"
      - fieldname: qualityGateCount
        description: Total number of quality gates across all stages
      - fieldname: regressionTestingApproach
        description: How regression testing is managed across stages
  stovri-form:
    fields:
      - fieldname: overallScheduleRisk
        description: Low / Medium / High / Critical — aggregate schedule risk
      - fieldname: overallBudgetRisk
        description: Low / Medium / High / Critical — aggregate budget overrun risk
      - fieldname: overallScopeRisk
        description: Low / Medium / High / Critical — risk of scope creep
      - fieldname: stageWithHighestRisk
        description: Which stage carries the most risk and why
      - fieldname: riskMitigationInvestment
        description: "Budget allocated to risk mitigation activities, e.g. EUR 200K"
      - fieldname: topThreeRisks
        description: Three most significant risks to the overall staging plan
      - fieldname: riskReviewCadence
        description: How often risks are formally reviewed
  stovst-form:
    fields:
      - fieldname: overallPlanStatus
        description: Green / Amber / Red — traffic-light status
      - fieldname: scheduleVariancePercent
        description: "Current schedule variance vs baseline, e.g. +5% behind"
      - fieldname: budgetVariancePercent
        description: "Current budget variance vs baseline, e.g. +3% over budget"
      - fieldname: scopeCompletionPercent
        description: "Overall scope completion across all stages, e.g. 35% complete"
      - fieldname: earnedValueCPI
        description: Cost Performance Index — ratio of earned value to actual cost
      - fieldname: earnedValueSPI
        description: Schedule Performance Index — ratio of earned value to planned value
      - fieldname: planConfidenceLevel
        description: High / Medium / Low — confidence in the overall timeline and budget
      - fieldname: confidenceBasis
        description: Basis for confidence level — analogous / expert / parametric / Monte Carlo
  stovco-form:
    fields:
      - fieldname: reportingCadence
        description: How often stage plan progress is reported
      - fieldname: primaryReportingAudience
        description: Primary audience for stage plan reports
      - fieldname: escalationThreshold
        description: When variances require escalation
      - fieldname: dashboardAvailability
        description: Where the live plan status is available
  stovc1-form:
    fields:
      - fieldname: keyPlanningAssumptions
        description: Top assumptions the staging plan relies on
      - fieldname: externalConstraints
        description: Constraints imposed by external factors
      - fieldname: internalConstraints
        description: Internal organizational constraints
      - fieldname: stageOverlapPolicy
        description: NoOverlap / MinimalOverlap / AggressiveOverlap
      - fieldname: stageOverlapMaxPercent
        description: "Maximum allowed overlap between consecutive stages, e.g. 20%"
  stsuid-form:
    fields:
      - fieldname: stageCodename
        description: Optional internal codename
      - fieldname: stageTheme
        description: High-level theme — Infrastructure / CoreBusiness
  stsuti-form:
    fields:
      - fieldname: plannedStartDate
        required: true
        description: "Planned start date, e.g. 2026-04-01"
      - fieldname: plannedEndDate
        required: true
        description: "Planned end date, e.g. 2026-07-31"
      - fieldname: durationWeeks
        description: Planned duration in weeks
      - fieldname: bufferWeeks
        description: Buffer time included at end
      - fieldname: overlapWithPrevious
        description: Duration of overlap with preceding stage
  stsusc-form:
    fields:
      - fieldname: featureCount
        description: Number of features delivered
      - fieldname: epicCount
        description: Number of epics or major work packages
      - fieldname: storyPointEstimate
        description: Total estimated story points
      - fieldname: keyDeliverables
        description: Top 3-5 deliverables — comma-separated
      - fieldname: outOfScopeItems
        description: Key items excluded from this stage
  stsuqu-form:
    fields:
      - fieldname: qualityTarget
        description: "Specific quality target — defect density, test pass rate"
      - fieldname: acceptanceCriteriaCount
        description: Number of formal acceptance criteria
      - fieldname: gateReviewType
        description: Formal / Informal / Automated
  stsust-form:
    fields:
      - fieldname: currentStatus
        description: NotStarted / InPlanning / InProgress / Completed
      - fieldname: percentComplete
        description: Completion percentage
      - fieldname: statusComment
        description: Brief comment on current status
      - fieldname: trafficLightStatus
        description: Green / Amber / Red
  stid-form:
    fields:
      - fieldname: stageCodename
        description: "Optional internal codename, e.g. Atlas, Phoenix"
      - fieldname: stageDescription
        description: Brief description of what this stage delivers
      - fieldname: businessObjective
        description: Primary business outcome this stage achieves
      - fieldname: stageType
        description: Foundation / Incremental / Enhancement / Optimization / Migration
  stti-form:
    fields:
      - fieldname: plannedStartDate
        required: true
      - fieldname: plannedEndDate
        required: true
      - fieldname: targetGoLiveDate
        required: true
        description: Date when stage deliverables go live
      - fieldname: actualStartDate
        description: Populated when stage begins
      - fieldname: actualEndDate
        description: Populated when stage completes
      - fieldname: durationPlanned
        description: "e.g. 12 weeks, 3 months"
      - fieldname: bufferDays
        description: Schedule buffer allocated to this stage
      - fieldname: leadTimeDays
        description: Required lead time before stage can begin
      - fieldname: freezePeriods
        description: Periods during which no changes can be deployed
  stsc-form:
    fields:
      - fieldname: scopeSummary
        description: High-level summary of features included in this stage
      - fieldname: includedFeatures
        description: Key features explicitly included
      - fieldname: excludedDeferred
        description: Features explicitly excluded and deferred
      - fieldname: mvpScope
        description: Minimum viable scope if schedule compression is needed
      - fieldname: stretchGoals
        description: Additional scope if the stage runs ahead of schedule
      - fieldname: featureCount
        description: Number of features or user stories in this stage
      - fieldname: storyPointEstimate
        description: Total estimated effort in story points
      - fieldname: technicalDebtItems
        description: Known technical debt to be addressed
  stqu-form:
    fields:
      - fieldname: entryCriteria
        description: Conditions that must be met before the stage can begin
      - fieldname: exitCriteria
        description: Conditions that must be met for stage completion
      - fieldname: qualityGates
        description: Formal checkpoints within the stage
      - fieldname: testingStrategy
        description: Testing approach for this stage
      - fieldname: acceptanceCriteriaSummary
        description: High-level criteria for business acceptance
      - fieldname: toleranceLevels
        description: "PRINCE2 tolerances — time, cost, scope, quality"
  sd-form:
    fields:
      - fieldname: deploymentApproach
        description: BlueGreen / Canary / RollingUpdate / BigBang
      - fieldname: rollbackPlan
        description: Strategy if deployment fails
      - fieldname: rollbackTriggers
        description: Conditions that trigger a rollback
      - fieldname: parallelOperationPeriod
        description: Duration of old and new system running in parallel
      - fieldname: dataMigrationScope
        description: Data entities and volumes to be migrated
      - fieldname: cutoverPlanSummary
        description: Key steps for switching from old to new system
      - fieldname: hypercarePeriod
        description: Duration of intensive post-go-live support
  stri-form:
    fields:
      - fieldname: topRisks
        description: Key risks specific to this stage
      - fieldname: riskMitigationStrategies
        description: Planned responses to top risks
      - fieldname: contingencyTriggers
        description: Conditions that activate contingency plans
      - fieldname: escalationPath
        description: Escalation process for critical issues
  stme-form:
    fields:
      - fieldname: completionPercentage
        description: 0-100 — current progress
      - fieldname: healthIndicator
        description: Green / Amber / Red
      - fieldname: scheduleVariance
        description: Days ahead or behind plan
      - fieldname: keyPerformanceIndicators
        description: KPIs to measure stage success
      - fieldname: successThreshold
        description: Minimum outcome required to declare success
  sseo-form:
    fields:
      - fieldname: description
        description: Brief description of this sub-stage or milestone
