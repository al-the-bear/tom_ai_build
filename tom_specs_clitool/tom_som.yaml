# Spec Object Model (SOM) generator configuration.
#
# Read by `bin/generate_som.dart` (see `doc/spec_object_model_config.md`).
# `output-base` is resolved **relative to this file's directory**, so `..`
# places the generated projects as siblings of `tom_specs_clitool` under
# `tom_ai/ai_build/` — e.g. `tom_ai/ai_build/tom_som_dart_v0`.
#
# Phase B shipped the Dart reference implementation; Phase C adds languages to
# `languages:` as their emitters land. All nine emitters now exist: Dart +
# Python + Java + JavaScript + TypeScript + Go + Rust + C + C++.
tom-spec-object-model:
  version-label: v0
  output-base: ..
  languages:
    - dart
    - python
    - java
    - javascript
    - typescript
    - go
    - rust
    - c
    - cpp
  # document-roots: omitted ⇒ generate every document root (all 13).
