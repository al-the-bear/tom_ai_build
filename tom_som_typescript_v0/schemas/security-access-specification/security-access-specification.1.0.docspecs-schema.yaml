      - fieldname: allowedFileExtensions
        description: "Comma-separated list of permitted extensions (e.g. jpg, png, pdf, docx)"
      - fieldname: blockedFileExtensions
        description: "Comma-separated list of explicitly blocked extensions (e.g. exe, bat, sh, php, js)"
