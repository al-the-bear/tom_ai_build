# TomSpecs document (*.docspecs.yaml). Hierarchical format v2.
version: 2
modelVersion: "1.0"
document:
  SBP D00SolutionBlueprint:
    content: |2-
      Solution Blueprint for the **Meridian Order Management (MOM)** programme.

      MOM replaces three ageing back-office systems with a single, event-driven order
      platform serving the wholesale and e-commerce channels of a mid-market
      distributor. This blueprint is the master specification from which the twelve
      Phase 3 documents (CLA, TOM, IFM, RSP, ISC, ATS, IIS, SAS, XDS, QAP, DRM, TRP)
      are derived.
    documentControl:
      content: |2-
        - Version: 1.0
        - Status: Approved
        - Approval date: 2026-05-18
        - Authors: Solution Architecture chapter
        - Approvers: Programme Sponsor (VP Operations), Enterprise Architecture Board

        Revision history is tracked in the programme wiki. This blueprint supersedes
        the 2025 "Order Platform Vision" one-pager.
    introductionAndScope:
      content: |2-
        MOM covers order capture, validation, pricing, fulfilment orchestration, and
        post-sale amendments across the wholesale (EDI) and e-commerce (REST) channels.

        Out of scope:

        - warehouse robotics control
        - general-ledger posting (delegated to the existing finance ERP via a
          published interface)
        - CRM lead management
      goals:
        content: |2-
          Primary goals:

          1. Cut median order-to-confirmation time from 4.2 hours to under 5 minutes.
          2. Remove the nightly batch window entirely.
          3. Give operations staff a single screen for the full order lifecycle.

          Secondary goal: expose a stable public order API for third-party marketplace
          integrators.

          Three legacy systems are decommissioned:

          - "OrderDesk" — green-screen order entry, 1998
          - "PriceCalc" — a spreadsheet-derived pricing service
          - "BatchSync" — the nightly file exchange with the warehouse
      requirements:
        content: |2-
          The requirements below are the contract MOM is built and accepted against.

          IDs are stable and referenced from the use cases, screens, and data model so
          every downstream artifact traces back to a requirement.
        functionalRequirements:
          FRE-REQU-LST requirements:
            FRE-REQU-1:
              content:
                requirementId: |2-
                  FR-01
                title: |2-
                  Capture orders from EDI and REST channels
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    The system must accept orders from the wholesale EDI adapter and the public REST order API, translating both into a single internal order-capture command so downstream processing is channel-agnostic.
                  requirementType: |2-
                    Functional
                  category: |2-
                    Order Capture
              priority:
                content:
                  priority: |2-
                    Must
                  businessValue: |2-
                    High
                  effort: |2-
                    M
                  riskLevel: |2-
                    Medium
              source:
                content:
                  source: |2-
                    VP Operations
                  requestDate: |2-
                    2026-04-02
                  rationale: |2-
                    Both channels must feed the same lifecycle to retire re-keying.
              verification:
                content:
                  fitCriterion: |2-
                    An EDI and a REST order both produce an Order in state Captured within 2s.
                  customerSatisfaction: |2-
                    5
                  customerDissatisfaction: |2-
                    1
              acceptanceCriteria:
                ACCR-CRIT-LST criteria:
                  ACCR-CRIT-1:
                    content:
                      criterionId: |2-
                        FR-01-AC-1
                      criterionTitle: |2-
                        EDI order accepted
                      given: |2-
                        a well-formed EDI 850 purchase order
                      when: |2-
                        the EDI adapter submits it to the capture API
                      then: |2-
                        an Order is created in state Captured and a domain event is emitted
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
                  ACCR-CRIT-2:
                    content:
                      criterionId: |2-
                        FR-01-AC-2
                      criterionTitle: |2-
                        REST order accepted
                      given: |2-
                        a valid REST order payload from an authenticated partner
                      when: |2-
                        POST /orders is called
                      then: |2-
                        an Order is created in state Captured with the same shape as EDI
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
            FRE-REQU-2:
              content:
                requirementId: |2-
                  FR-02
                title: |2-
                  Price orders synchronously at capture time
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    Pricing must be computed synchronously during order processing and the resulting unit price snapshotted onto each order line, eliminating the nightly batch and making historical orders reproducible.
                  requirementType: |2-
                    Functional
                  category: |2-
                    Pricing
              priority:
                content:
                  priority: |2-
                    Must
                  businessValue: |2-
                    High
                  effort: |2-
                    M
                  riskLevel: |2-
                    Medium
              verification:
                content:
                  fitCriterion: |2-
                    Each confirmed line carries a unitPrice snapshot equal to the price list at pricing time.
              acceptanceCriteria:
                ACCR-CRIT-LST criteria:
                  ACCR-CRIT-1:
                    content:
                      criterionId: |2-
                        FR-02-AC-1
                      criterionTitle: |2-
                        Price snapshotted onto line
                      given: |2-
                        an order with two lines
                      when: |2-
                        the order is priced
                      then: |2-
                        each line stores the resolved unit price as of the pricing timestamp
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
            FRE-REQU-3:
              content:
                requirementId: |2-
                  FR-03
                title: |2-
                  Reserve stock before confirmation
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    Before an order is confirmed the system must reserve stock for every line; insufficient stock places the affected line on Hold rather than failing the whole order.
                  requirementType: |2-
                    Functional
                  category: |2-
                    Fulfilment
              priority:
                content:
                  priority: |2-
                    Must
                  businessValue: |2-
                    High
                  effort: |2-
                    L
                  riskLevel: |2-
                    High
              acceptanceCriteria:
                ACCR-CRIT-LST criteria:
                  ACCR-CRIT-1:
                    content:
                      criterionId: |2-
                        FR-03-AC-1
                      criterionTitle: |2-
                        Stock reserved when available
                      given: |2-
                        an order whose lines all have sufficient stock on hand
                      when: |2-
                        the order is submitted for confirmation
                      then: |2-
                        every line reserves its quantity and the order is eligible to confirm
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
                  ACCR-CRIT-2:
                    content:
                      criterionId: |2-
                        FR-03-AC-2
                      criterionTitle: |2-
                        Short line placed on Hold
                      given: |2-
                        an order with one line whose demand exceeds available stock
                      when: |2-
                        reservation runs before confirmation
                      then: |2-
                        only the short line is placed on Hold while the remaining lines reserve normally
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
            FRE-REQU-4:
              content:
                requirementId: |2-
                  FR-04
                title: |2-
                  Confirm orders within five minutes
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    An order that passes validation, pricing, and reservation must reach state Confirmed within five minutes of capture, with the confirmation communicated on the operations work list and the public tracking page.
                  requirementType: |2-
                    Functional
                  category: |2-
                    Order Lifecycle
              priority:
                content:
                  priority: |2-
                    Must
                  businessValue: |2-
                    High
                  effort: |2-
                    M
                  riskLevel: |2-
                    Medium
              acceptanceCriteria:
                ACCR-CRIT-LST criteria:
                  ACCR-CRIT-1:
                    content:
                      criterionId: |2-
                        FR-04-AC-1
                      criterionTitle: |2-
                        Order confirmed within budget
                      given: |2-
                        a captured order that passes validation, pricing, and reservation
                      when: |2-
                        the lifecycle processes it under normal load
                      then: |2-
                        the order reaches state Confirmed within five minutes of capture
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
                  ACCR-CRIT-2:
                    content:
                      criterionId: |2-
                        FR-04-AC-2
                      criterionTitle: |2-
                        Confirmation surfaced to operations and tracking
                      given: |2-
                        an order that has just reached state Confirmed
                      when: |2-
                        the confirmation event is published
                      then: |2-
                        the order appears as Confirmed on the operations work list and the public tracking page
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
            FRE-REQU-5:
              content:
                requirementId: |2-
                  FR-05
                title: |2-
                  Amend or cancel an order before dispatch
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    Until an order is dispatched, a clerk must be able to amend line quantities and cancel lines or the whole order; each amendment re-runs pricing and reservation for the affected lines and is fully audited.
                  requirementType: |2-
                    Functional
                  category: |2-
                    Order Amendment
              priority:
                content:
                  priority: |2-
                    Should
                  businessValue: |2-
                    Medium
                  effort: |2-
                    M
                  riskLevel: |2-
                    Medium
              acceptanceCriteria:
                ACCR-CRIT-LST criteria:
                  ACCR-CRIT-1:
                    content:
                      criterionId: |2-
                        FR-05-AC-1
                      criterionTitle: |2-
                        Amendment re-runs pricing and reservation
                      given: |2-
                        a confirmed order that has not yet dispatched
                      when: |2-
                        a clerk changes a line quantity
                      then: |2-
                        pricing and reservation re-run for the affected line and the change is written to the audit trail
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
                  ACCR-CRIT-2:
                    content:
                      criterionId: |2-
                        FR-05-AC-2
                      criterionTitle: |2-
                        Cancellation blocked after dispatch
                      given: |2-
                        an order that has already dispatched
                      when: |2-
                        a clerk attempts to cancel it
                      then: |2-
                        the cancellation is rejected and the rejection is recorded in the audit trail
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
            FRE-REQU-6:
              content:
                requirementId: |2-
                  FR-06
                title: |2-
                  Release a manual hold
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    An Order Supervisor must be able to review an order on Hold and release it back into the lifecycle, recording a reason that is attached to the audit trail.
                  requirementType: |2-
                    Functional
                  category: |2-
                    Exception Handling
              priority:
                content:
                  priority: |2-
                    Must
                  businessValue: |2-
                    High
                  effort: |2-
                    S
                  riskLevel: |2-
                    Low
              acceptanceCriteria:
                ACCR-CRIT-LST criteria:
                  ACCR-CRIT-1:
                    content:
                      criterionId: |2-
                        FR-06-AC-1
                      criterionTitle: |2-
                        Supervisor releases hold
                      given: |2-
                        an order in state Hold
                      when: |2-
                        a supervisor releases it with a reason
                      then: |2-
                        the order resumes at the transition that placed it on Hold and the reason is audited
                      verificationMethod: |2-
                        Automated test
                      testType: |2-
                        Integration
                      priority: |2-
                        Must
                      status: |2-
                        Draft
        technicalRequirements:
          TERQ-REQU-LST requirements:
            TERQ-REQU-1:
              content:
                requirementId: |2-
                  TR-01
                title: |2-
                  Confirmation latency budget
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    The 95th-percentile order-confirmation latency must stay within budget under peak load.
                  category: |2-
                    Performance
                  subcategory: |2-
                    Latency
                  priority: |2-
                    Must
                  source: |2-
                    Operations SLA
                  rationale: |2-
                    Sub-30s p95 keeps the five-minute business promise safe under 3x peak.
              measurement:
                content:
                  metric: |2-
                    p95 capture-to-confirmation latency
                  currentValue: |2-
                    4.2h (legacy)
                  targetValue: |2-
                    < 30s
                  measurementMethod: |2-
                    Distributed tracing over the confirmation span
                  measurementEnvironment: |2-
                    Load test at 3x peak-hour volume
                  measurementFrequency: |2-
                    Per release + continuous in production
            TERQ-REQU-2:
              content:
                requirementId: |2-
                  TR-02
                title: |2-
                  Capture API availability
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    The order-capture API must meet a 99.9% monthly availability target.
                  category: |2-
                    Reliability
                  subcategory: |2-
                    Availability
                  priority: |2-
                    Must
                  source: |2-
                    Partner integration agreement
                  rationale: |2-
                    Marketplace partners depend on the capture API being continuously reachable.
              measurement:
                content:
                  metric: |2-
                    Monthly capture-API availability
                  targetValue: |2-
                    >= 99.9%
                  measurementMethod: |2-
                    Synthetic probes + gateway success-rate metrics
                  measurementFrequency: |2-
                    Monthly
            TERQ-REQU-3:
              content:
                requirementId: |2-
                  TR-03
                title: |2-
                  Event-sourced order service
                status: |2-
                  Approved
              details:
                content:
                  description: |2-
                    The order service must be event-sourced: the append-only event log is the system of record and all read models are projections rebuildable from the log.
                  category: |2-
                    Architecture
                  subcategory: |2-
                    Persistence
                  priority: |2-
                    Must
                  source: |2-
                    Enterprise Architecture Board
                  rationale: |2-
                    Reproducible history and rebuildable projections are core to auditability.
        securityRequirements:
          SECRQ-REQU-LST requirements:
            SECRQ-REQU-1:
              content:
                requirementId: |2-
                  SR-01
                title: |2-
                  Role-based access control
                description: |2-
                  Access is governed by the roles Order Clerk, Order Supervisor, Pricing Admin, and Integration (machine) accounts scoped to specific channels; every state transition is attributed to an authenticated principal.
              classification:
                content:
                  category: |2-
                    Access Control
                  subcategory: |2-
                    Authorization
                  priority: |2-
                    Must
                  source: |2-
                    Security chapter
                  rationale: |2-
                    Least privilege across human and machine actors.
                  threatMitigated: |2-
                    Unauthorized order manipulation
                  dataClassification: |2-
                    Internal
              compliance:
                content:
                  owaspCategory: |2-
                    A01:2021 Broken Access Control
                  nistControl: |2-
                    AC-6
                  complianceReference: |2-
                    Corporate IAM policy v3
            SECRQ-REQU-2:
              content:
                requirementId: |2-
                  SR-02
                title: |2-
                  Encrypt customer PII at rest
                description: |2-
                  All customer personally identifiable information must be encrypted at rest.
              classification:
                content:
                  category: |2-
                    Data Protection
                  subcategory: |2-
                    Encryption
                  priority: |2-
                    Must
                  source: |2-
                    Data Protection Officer
                  rationale: |2-
                    GDPR obligations on customer records with a 7-year retention.
                  threatMitigated: |2-
                    PII disclosure from storage compromise
                  dataClassification: |2-
                    Confidential
              compliance:
                content:
                  nistControl: |2-
                    SC-28
                  complianceReference: |2-
                    GDPR Art. 32
            SECRQ-REQU-3:
              content:
                requirementId: |2-
                  SR-03
                title: |2-
                  OAuth2 client credentials on the public API
                description: |2-
                  The public order API must authenticate partners with OAuth2 client-credentials tokens and enforce per-partner rate limits at the gateway.
              classification:
                content:
                  category: |2-
                    API Security
                  subcategory: |2-
                    Authentication
                  priority: |2-
                    Must
                  source: |2-
                    Security chapter
                  rationale: |2-
                    Machine-to-machine partner access without shared secrets in code.
                  threatMitigated: |2-
                    Credential replay and partner impersonation
                  dataClassification: |2-
                    Internal
              compliance:
                content:
                  owaspCategory: |2-
                    API2:2023 Broken Authentication
                  nistControl: |2-
                    IA-5
        organizationalRequirements:
          ORRQ-REQU-LST requirements:
            ORRQ-REQU-1:
              content:
                requirementId: |2-
                  OR-01
                title: |2-
                  Train the operations desk on MOM
                description: |2-
                  Before cutover the order-operations desk must be trained to run the full order lifecycle on MOM alone, including hold release and amendments.
              impact:
                content:
                  impactedGroups: |2-
                    Order Operations desk
                  impactedUserCount: |2-
                    25
                  changeType: |2-
                    Process + tooling
                  changeComplexity: |2-
                    Medium
                  resistance: |2-
                    Low
            ORRQ-REQU-2:
              content:
                requirementId: |2-
                  OR-02
                title: |2-
                  Staff the parallel run
                description: |2-
                  The two-week parallel run against OrderDesk requires staffing to reconcile both systems daily until the < 0.1% variance gate passes.
              impact:
                content:
                  impactedGroups: |2-
                    Order Operations, Finance
                  impactedUserCount: |2-
                    30
                  changeType: |2-
                    Temporary dual-running
                  changeComplexity: |2-
                    Medium
                  resistance: |2-
                    Medium
    glossaryAndAbbreviations:
      content: |2-
        - **MOM** — Meridian Order Management.
        - **Line** — a single product/quantity within an order.
        - **Hold** — a state in which an order awaits manual review.
        - **Fulfilment window** — the committed dispatch date range communicated to
          the customer.
        - **EDI** — the wholesale electronic data interchange channel.
    stakeholdersAndGovernance:
      content: |2-
        - Sponsor: VP Operations
        - Product owner: Head of Order Operations
        - Key stakeholder groups: wholesale account managers, e-commerce
          merchandising, warehouse operations, finance, and the external marketplace
          partners

        Governance runs through a fortnightly steering board; architectural decisions
        are recorded as ADRs owned by the Enterprise Architecture Board.
    currentLandscape:
      content: |2-
        Today, order entry is manual and channel-specific. Wholesale orders arrive by
        EDI and are re-keyed into OrderDesk; e-commerce orders drop into a queue that a
        clerk clears twice a day.

        Pricing is recomputed nightly, so intraday price changes are invisible until
        the next morning. There is no single source of truth for order status — staff
        reconcile three systems by phone.
      CUOPME-OPER-LST operationalMetrics:
        CUOPME-OPER-1:
          content: |2-
            Median order-to-confirmation time: 4.2 hours (wholesale), 9 hours (e-commerce).
        CUOPME-OPER-2:
          content: |2-
            Nightly batch window: 2h10m, during which no orders can be confirmed.
        CUOPME-OPER-3:
          content: |2-
            Manual price-override rate: 11% of wholesale lines, indicating pricing drift.
        CUOPME-OPER-4:
          content: |2-
            Order-status enquiry calls: ~340/week to the operations desk.
    assumptionsConstraintsDependencies:
      content: |2-
        - **Assumption** — the finance ERP order-posting interface remains stable for
          the programme's duration.
        - **Constraint** — the platform runs in the corporate AWS eu-central-1 landing
          zone and uses only the approved managed-database catalogue.
        - **Dependency** — the warehouse team delivers the new dispatch-event webhook
          by the end of increment 2.
    targetOperatingModelConcept:
      content: |2-
        Orders flow through a single event-driven pipeline:

        Captured -> Validated -> Priced -> Reserved -> Confirmed -> Fulfilled -> Closed

        An orthogonal Hold sub-state covers manual review. Every transition emits a
        domain event; operations staff work from one queue view filtered by state.
        Pricing becomes a synchronous call, eliminating the batch window.
      targetBusinessProcess:
        processStepsAndActorInteractions:
          actorOverview:
            ACEN-ACTO-LST actors:
              ACEN-ACTO-1:
                identification:
                  content:
                    actorId: |2-
                      ACT-01
                    actorName: |2-
                      Order Clerk
                    actorType: |2-
                      Human
                    category: |2-
                      Primary
                    description: |2-
                      Clears the order work list, amends lines, and cancels orders before dispatch.
                    organizationalUnit: |2-
                      Order Operations
                    estimatedCount: |2-
                      25
                    geographicDistribution: |2-
                      Single distribution centre
              ACEN-ACTO-2:
                identification:
                  content:
                    actorId: |2-
                      ACT-02
                    actorName: |2-
                      Order Supervisor
                    actorType: |2-
                      Human
                    category: |2-
                      Primary
                    description: |2-
                      Reviews orders on Hold and releases them back into the lifecycle.
                    organizationalUnit: |2-
                      Order Operations
                    estimatedCount: |2-
                      4
                    geographicDistribution: |2-
                      Single distribution centre
              ACEN-ACTO-3:
                identification:
                  content:
                    actorId: |2-
                      ACT-03
                    actorName: |2-
                      Pricing Admin
                    actorType: |2-
                      Human
                    category: |2-
                      Supporting
                    description: |2-
                      Maintains the price lists that the synchronous pricing step consumes.
                    organizationalUnit: |2-
                      Commercial
                    estimatedCount: |2-
                      3
                    geographicDistribution: |2-
                      Single distribution centre
              ACEN-ACTO-4:
                identification:
                  content:
                    actorId: |2-
                      ACT-04
                    actorName: |2-
                      EDI Integration Account
                    actorType: |2-
                      System
                    category: |2-
                      Primary
                    description: |2-
                      Machine account through which the wholesale EDI adapter submits orders.
                    organizationalUnit: |2-
                      Integration
                    estimatedCount: |2-
                      1
                    geographicDistribution: |2-
                      Single distribution centre
          interactionCatalog:
            INEN-INTE-LST interactions:
              INEN-INTE-1:
                identification:
                  content:
                    interactionId: |2-
                      UC-01
                    useCaseName: |2-
                      Capture Wholesale Order (EDI)
                    processReference: |2-
                      BP-Order-Capture
                    briefDescription: |2-
                      A wholesale EDI purchase order is captured, validated, priced, reserved, and confirmed.
                    fullDescription: |2-
                      The EDI adapter submits a translated purchase order to the capture command API. The system validates the customer and lines, prices each line synchronously, reserves stock, and confirms the order — emitting a domain event at every transition so the work list and public tracking page stay current.
                    primaryActor: |2-
                      ACT-04 EDI Integration Account
                    supportingActors: |2-
                      ACT-01 Order Clerk
                    goalLevel: |2-
                      User goal
                    designScope: |2-
                      System
                PRANTR-PREC-LST preconditions:
                  PRANTR-PREC-1:
                    content:
                      precondition: |2-
                        The submitting Integration account is authenticated and scoped to the wholesale channel.
                      trigger: |2-
                        An EDI 850 purchase order arrives at the wholesale adapter.
                      triggerType: |2-
                        External
                      triggerSource: |2-
                        EDI gateway
                      triggerData: |2-
                        EDI 850 document
                POANGU-POST-LST postconditions:
                  POANGU-POST-1:
                    content:
                      minimalGuarantees: |2-
                        Either an Order exists in a well-defined state or the submission is rejected with a reason; no partial order is persisted.
                      successGuarantees: |2-
                        The Order is in state Confirmed with priced, reserved lines and a full event history.
                      dataPostcondition: |2-
                        Order and OrderLine rows persisted; reservation recorded against Product stock.
                mainScenario:
                  MNSST-STEP-LST steps:
                    MNSST-STEP-1:
                      content:
                        stepNumber: 1
                        actorAction: |2-
                          EDI adapter submits the translated order to the capture API.
                        systemResponse: |2-
                          System creates the Order in state Captured and emits OrderCaptured.
                        dataInvolved: |2-
                          Order, OrderLine
                        uiElementUsed: |2-
                          —
                    MNSST-STEP-2:
                      content:
                        stepNumber: 2
                        actorAction: |2-
                          System validates customer credit and line stock references.
                        systemResponse: |2-
                          Order moves to Validated; invalid references are flagged per line.
                        dataInvolved: |2-
                          Customer, Product
                        businessRuleApplied: |2-
                          Credit limit not exceeded
                    MNSST-STEP-3:
                      content:
                        stepNumber: 3
                        actorAction: |2-
                          System prices each line against the active price list.
                        systemResponse: |2-
                          Unit price is snapshotted onto each line; Order moves to Priced.
                        dataInvolved: |2-
                          PriceList, OrderLine
                        businessRuleApplied: |2-
                          FR-02 price snapshot
                    MNSST-STEP-4:
                      content:
                        stepNumber: 4
                        actorAction: |2-
                          System reserves stock for every line.
                        systemResponse: |2-
                          Reservations recorded; Order moves to Reserved.
                        dataInvolved: |2-
                          Product
                        businessRuleApplied: |2-
                          FR-03 reserve before confirm
                    MNSST-STEP-5:
                      content:
                        stepNumber: 5
                        actorAction: |2-
                          System confirms the order.
                        systemResponse: |2-
                          Order moves to Confirmed within five minutes and appears on the work list.
                        dataInvolved: |2-
                          Order
                        businessRuleApplied: |2-
                          FR-04 five-minute confirmation
                extensions:
                  EXTEN-EXTE-LST extensions:
                    EXTEN-EXTE-1:
                      content:
                        extensionId: |2-
                          2a
                        branchPoint: |2-
                          Step 2
                        condition: |2-
                          Customer credit limit would be exceeded
                        extensionType: |2-
                          Exception
                        description: |2-
                          Validation detects the order exceeds the customer credit limit.
                        outcome: |2-
                          Order is placed on Hold for supervisor review (see UC-02).
                        returnPoint: |2-
                          Step 3 after release
                        severity: |2-
                          High
                      EXTST-STEP-LST steps:
                        EXTST-STEP-1:
                          content:
                            stepNumber: |2-
                              2a.1
                            action: |2-
                              System places the Order on Hold and emits OrderHeld.
                            response: |2-
                              Order appears in the Hold filter of the work list with reason "Credit exceeded".
                    EXTEN-EXTE-2:
                      content:
                        extensionId: |2-
                          4a
                        branchPoint: |2-
                          Step 4
                        condition: |2-
                          Insufficient stock for one or more lines
                        extensionType: |2-
                          Exception
                        description: |2-
                          Reservation cannot be fully satisfied for a line.
                        outcome: |2-
                          The affected line is placed on Hold; other lines proceed.
                        returnPoint: |2-
                          Step 5 for satisfiable lines
                        severity: |2-
                          Medium
                      EXTST-STEP-LST steps:
                        EXTST-STEP-1:
                          content:
                            stepNumber: |2-
                              4a.1
                            action: |2-
                              System holds the unsatisfiable line and reserves the rest.
                            response: |2-
                              The order is partially reserved; the held line is flagged for follow-up.
              INEN-INTE-2:
                identification:
                  content:
                    interactionId: |2-
                      UC-02
                    useCaseName: |2-
                      Release Order Hold
                    processReference: |2-
                      BP-Order-Exception
                    briefDescription: |2-
                      A supervisor reviews an order on Hold and releases it back into the lifecycle.
                    fullDescription: |2-
                      A supervisor opens an order on Hold from the work list, reviews the hold reason, and either releases it — resuming the lifecycle at the transition that placed it on Hold — or cancels it, recording a reason in both cases.
                    primaryActor: |2-
                      ACT-02 Order Supervisor
                    goalLevel: |2-
                      User goal
                    designScope: |2-
                      System
                PRANTR-PREC-LST preconditions:
                  PRANTR-PREC-1:
                    content:
                      precondition: |2-
                        An order exists in state Hold and the actor holds the Order Supervisor role.
                      trigger: |2-
                        Supervisor selects a held order from the work list.
                      triggerType: |2-
                        User
                      triggerSource: |2-
                        Order Work List screen
                POANGU-POST-LST postconditions:
                  POANGU-POST-1:
                    content:
                      successGuarantees: |2-
                        The order resumes at the transition that placed it on Hold, with the release reason audited.
                      auditTrail: |2-
                        Release attributed to the supervisor principal with timestamp and reason.
                mainScenario:
                  MNSST-STEP-LST steps:
                    MNSST-STEP-1:
                      content:
                        stepNumber: 1
                        actorAction: |2-
                          Supervisor opens the held order and reviews the reason.
                        systemResponse: |2-
                          System shows the lifecycle timeline and the hold reason.
                        dataInvolved: |2-
                          Order
                        uiElementUsed: |2-
                          Order Detail timeline
                    MNSST-STEP-2:
                      content:
                        stepNumber: 2
                        actorAction: |2-
                          Supervisor releases the order with a reason.
                        systemResponse: |2-
                          System resumes the lifecycle and emits OrderHoldReleased.
                        dataInvolved: |2-
                          Order
                        businessRuleApplied: |2-
                          FR-06 hold release
              INEN-INTE-3:
                identification:
                  content:
                    interactionId: |2-
                      UC-03
                    useCaseName: |2-
                      Amend Order Line Before Dispatch
                    processReference: |2-
                      BP-Order-Amendment
                    briefDescription: |2-
                      A clerk changes a line quantity before dispatch, re-running pricing and reservation.
                    fullDescription: |2-
                      A clerk edits the quantity of a line on a not-yet-dispatched order. The system re-prices and re-reserves only the affected line and records the amendment on the audit trail.
                    primaryActor: |2-
                      ACT-01 Order Clerk
                    goalLevel: |2-
                      User goal
                    designScope: |2-
                      System
                PRANTR-PREC-LST preconditions:
                  PRANTR-PREC-1:
                    content:
                      precondition: |2-
                        The order is not yet dispatched and the actor holds the Order Clerk role.
                      trigger: |2-
                        Clerk edits a line quantity on the Order Detail screen.
                      triggerType: |2-
                        User
                      triggerSource: |2-
                        Order Detail screen
                POANGU-POST-LST postconditions:
                  POANGU-POST-1:
                    content:
                      successGuarantees: |2-
                        The amended line carries a fresh price snapshot and reservation; the amendment is audited.
                      dataPostcondition: |2-
                        OrderLine updated; prior values retained in the event history.
                mainScenario:
                  MNSST-STEP-LST steps:
                    MNSST-STEP-1:
                      content:
                        stepNumber: 1
                        actorAction: |2-
                          Clerk changes the quantity of a line and saves.
                        systemResponse: |2-
                          System validates the new quantity and re-prices the line.
                        dataInvolved: |2-
                          OrderLine, PriceList
                        businessRuleApplied: |2-
                          FR-05 amend before dispatch
                    MNSST-STEP-2:
                      content:
                        stepNumber: 2
                        actorAction: |2-
                          System re-reserves stock for the amended line.
                        systemResponse: |2-
                          Reservation is adjusted; the order returns to Confirmed if fully satisfied.
                        dataInvolved: |2-
                          Product
                        businessRuleApplied: |2-
                          FR-03 reserve before confirm
          keyScenarios:
            SCNRY-SCEN-LST scenarios:
              SCNRY-SCEN-1:
                identification:
                  content:
                    scenarioId: |2-
                      SCN-01
                    scenarioName: |2-
                      Happy-path wholesale order, capture to fulfilment
                    scenarioType: |2-
                      End-to-end
                    description: |2-
                      A clean wholesale order flows from EDI capture through to fulfilment with no holds.
                    businessGoal: |2-
                      Confirm and fulfil a wholesale order without manual intervention.
                    primaryActor: |2-
                      ACT-04 EDI Integration Account
                    supportingActors: |2-
                      ACT-01 Order Clerk
                    priority: |2-
                      High
                    complexity: |2-
                      Medium
                SCNST-STEP-LST steps:
                  SCNST-STEP-1:
                    content:
                      stepNumber: 1
                      actor: |2-
                        ACT-04 EDI Integration Account
                      action: |2-
                        Submits a two-line wholesale order.
                      systemResponse: |2-
                        Order captured, validated, priced, reserved, and confirmed within five minutes.
                  SCNST-STEP-2:
                    content:
                      stepNumber: 2
                      actor: |2-
                        ACT-01 Order Clerk
                      action: |2-
                        Observes the confirmed order on the work list.
                      systemResponse: |2-
                        Order shows state Confirmed with both lines priced and reserved.
                  SCNST-STEP-3:
                    content:
                      stepNumber: 3
                      actor: |2-
                        System
                      action: |2-
                        Receives the warehouse dispatch webhook.
                      systemResponse: |2-
                        Order moves to Fulfilled and the public tracking page updates.
    informationAndDataModel:
      content: |2-
        Core aggregates: Order (with Lines), Customer, Product, PriceList, and
        FulfilmentPlan.

        Orders reference Customers and Products by stable IDs; prices are snapshotted
        onto each Line at pricing time so historical orders remain reproducible. The
        event log is the system of record; read models are projections.
