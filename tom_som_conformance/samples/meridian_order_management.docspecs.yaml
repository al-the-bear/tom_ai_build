                    The single, state-filtered queue from which clerks work every order.
                SCECL classification:
                  screenCategory: |2-
                    List
                  routePattern: |2-
                    order-work-list
                AZREQ access:
                  content:
                    requirementKind: |2-
                      role
                    rationale: |2-
                      The work list exposes every open order, so it is limited to the two roles that work the queue.
                  AZREQ-ROLE roleRequirement:
                    roles: |2-
                      Order Clerk, Order Supervisor
                SCETR traceability:
                  relatedUseCases: |2-
                    UC-01, UC-02
                  relatedRequirements: |2-
                    FRE-REQU-ORDER-CAPTURE, FRE-REQU-CONFIRM-SLA, FRE-REQU-HOLD-RELEASE
                  dataEntities: |2-
                    Order
                  primaryAction: |2-
                    Open selected order
                SCENPR presentation:
                  pageTitleResource: |2-
                    screen.orders.title
                  layout: |2-
                    Master-detail
                SCSE sections:
                  SCRSC-ITEM-LST items:
                    SCRSC-ITEM-1:
                      headline: |2-
                        State filter bar
