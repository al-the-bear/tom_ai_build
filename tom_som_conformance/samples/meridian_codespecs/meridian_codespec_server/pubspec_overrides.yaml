# Local-development override: tom_code_specs (a path dependency here) declares
# its tom_specs_core dependency as hosted for publishing; resolve it to the
# same workspace checkout so version solving succeeds against the unpublished
# sibling. Same mechanism as tom_som_dart_v0's generated overrides file.
dependency_overrides:
  tom_specs_core:
    path: ../../../../tom_specs_core
