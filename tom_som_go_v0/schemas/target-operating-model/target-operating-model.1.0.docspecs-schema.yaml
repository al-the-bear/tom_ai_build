      - fieldname: offlineCapability
        description: State offline operation requirements
      - fieldname: analyticsCapability
        description: State analytics/process mining needs
  prexov-form:
    fields:
      - fieldname: exceptionPhilosophy
        description: State the overall exception approach
      - fieldname: exceptionRate
        description: Give the expected exception rate
      - fieldname: exceptionRouting
        description: State where exceptions are routed
      - fieldname: resolutionSla
        description: Give the exception resolution SLA
      - fieldname: escalationPath
        description: Name who handles escalations
      - fieldname: rootCauseAnalysis
        description: Describe root-cause analysis approach
      - fieldname: continuousImprovement
        description: Describe how exceptions drive change
  peea-form:
