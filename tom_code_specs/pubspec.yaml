name: tom_code_specs
description: CodeSpecs framework — the Cs* annotation family (no base classes) and the code-side DocSpecs↔CodeSpecs link annotations for TomSpecs Phase 4.
version: 0.12.0
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  # The shared kind vocabulary (CodeSpecPart) + the type-level @CodeSpecKind
  # link annotation live in tom_specs_core; the Cs* annotation family references
  # them. tom_specs_core is a zero-dependency annotation library.
  tom_specs_core:
    path: ../tom_specs_core

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
