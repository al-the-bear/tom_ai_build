form-types:
  peprf-form:
    fields:
      - fieldname: bio
        description: Brief biographical context
      - fieldname: technicalProficiency
        description: Beginner/Intermediate/Advanced — with context
      - fieldname: accessibilityNeeds
        description: Visual/Motor/Cognitive/None
  pectx-form:
    fields:
      - fieldname: typicalUsage
        description: "Frequency, duration, and primary activities"
      - fieldname: primaryDevice
        description: Desktop/Laptop/Tablet/Mobile
      - fieldname: additionalDevices
        description: Secondary devices used
      - fieldname: workEnvironment
        description: Office/Remote/Field/Hybrid
  pends-form:
    fields:
      - fieldname: motivations
        description: What drives their behavior
      - fieldname: frustrationsWithCurrent
        description: Issues with existing solutions
      - fieldname: successCriteria
        description: How they measure success
      - fieldname: quote
        description: A quote that captures their perspective
  scecl-form:
    fields:
      - fieldname: screenCategory
        description: List/Detail/Form/Dashboard/Settings/Wizard/Dialog/Report/Landing
      - fieldname: parentScreenId
        description: Parent screen if this is a sub-screen or drill-down
      - fieldname: routePattern
        description: Route ID (SCRTEN registry) this screen is reached by — the path itself is declared once in the screen route map
  sceac-form:
    fields:
      - fieldname: accessLevel
        description: Public/Authenticated/Role-specific
      - fieldname: requiredRoles
        description: Authorization roles that may access this screen
      - fieldname: requiredPermissions
        description: Specific permissions needed
      - fieldname: permissionEffect
        description: Hide-Screen/Show-Readonly/Show-With-Restrictions
  scetr-form:
    fields:
      - fieldname: relatedUseCases
        description: ISC references this screen serves
      - fieldname: relatedRequirements
        description: RSP references this screen satisfies
      - fieldname: relatedBusinessProcesses
        description: TOM references where this screen appears
      - fieldname: dataEntities
        description: IFM entity references displayed/edited
      - fieldname: primaryAction
        description: Main user action on this screen
  scenpr-form:
    fields:
      - fieldname: pageTitleResource
        description: Message key (MSGKR registry) for the screen title text
      - fieldname: pageIconResource
        description: Resource key for the screen icon
      - fieldname: helpTopicId
        description: Link to help/documentation topic
      - fieldname: layout
        description: "Layout description, e.g., Responsive grid — 3 col desktop, 1 col mobile"
  ssel-form:
    fields:
      - fieldname: layoutDirection
        description: Horizontal/Vertical/Wrap/Grid
      - fieldname: displayOrder
        description: Position in reading order
      - fieldname: titleResource
        description: Message key (MSGKR registry) for section header text
      - fieldname: borderStyle
        description: Named style or resource key
  sseb-form:
    fields:
      - fieldname: collapsible
        description: "Yes/No — can the user collapse this section?"
      - fieldname: initiallyCollapsed
        description: Yes/No — default collapsed state
      - fieldname: visibilityCondition
        description: "When this section is shown, e.g., role==Admin"
  seer-form:
    fields:
      - fieldname: labelResource
        description: Message key (MSGKR registry) for display label
      - fieldname: hintResource
        description: Message key (MSGKR registry) for tooltip/helper text
      - fieldname: descriptionResource
        description: Message key (MSGKR registry) for extended description
      - fieldname: iconResource
        description: Resource key for icon
      - fieldname: iconPosition
        description: Leading/Trailing/Above/Below/Only
  scelenla-form:
    fields:
      - fieldname: placementOrder
        description: Order within parent section
      - fieldname: width
        description: Fill/Auto/Fixed(200)/Proportion(1/3)
