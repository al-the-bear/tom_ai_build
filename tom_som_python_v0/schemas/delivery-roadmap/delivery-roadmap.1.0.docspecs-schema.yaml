      - fieldname: informedParties
        description: Stakeholders informed of the outcome — comma-separated
  depoencr-form:
    fields:
      - fieldname: decisionCriteria
        required: true
        description: "Criteria for making this decision — cost, risk, time, quality, strategic alignment, feasibility"
      - fieldname: requiredInputs
        description: "Information or artifacts needed — cost analysis, risk assessment, prototype results, vendor proposals"
      - fieldname: constraintFactors
        description: "Constraints limiting the decision space — budget, regulatory, technology, timeline"
      - fieldname: riskIfDelayed
        description: "Consequence of not making the decision on time — schedule slip, cost increase, missed window"
  does-form:
    fields:
      - fieldname: isDefault
        description: Yes / No — whether this is the fallback if no decision is reached by deadline
      - fieldname: isRecommended
        description: Yes / No — whether the analysis team recommends this option
  doei-form:
    fields:
      - fieldname: costImpact
        description: "Estimated cost — one-time and recurring, relative or absolute"
      - fieldname: scheduleImpact
        description: "Effect on timeline — days/weeks of delay or acceleration, or no impact"
      - fieldname: qualityImpact
        description: "Effect on quality — better/worse test coverage, performance, reliability"
      - fieldname: riskImpact
        description: New risks introduced or existing risks mitigated
      - fieldname: scopeImpact
        description: "Features added, removed, or modified by this choice"
      - fieldname: resourceImpact
        description: "Team changes — additional hires, skill gaps, vendor engagement"
  doef-form:
    fields:
      - fieldname: technicalFeasibility
        description: High / Medium / Low — assessed technical feasibility
      - fieldname: organizationalFeasibility
        description: High / Medium / Low — organizational readiness for this option
      - fieldname: feasibilityNotes
        description: "Key factors — skill availability, technology maturity, vendor reliability"
  doeto-form:
    fields:
      - fieldname: advantages
        description: Key benefits of this option — comma-separated
      - fieldname: disadvantages
        description: Key drawbacks of this option — comma-separated
      - fieldname: assumptions
        description: "Assumptions this option depends on — if invalid, option may not be viable"
      - fieldname: implications
        description: "Downstream consequences — architectural, contractual, operational, political"
      - fieldname: reversibility
        description: Reversible / PartiallyReversible / Irreversible — can the decision be undone
