# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the 'recommended' set of lints from `package:lints`.
# This set helps identify many issues that may lead to problems when running
# or consuming Dart code, and enforces writing Dart using a single, idiomatic
# style and format.
#
# If you want a smaller set of lints you can change this to specify
# 'package:lints/core.yaml'. These are just the most critical lints
# (the recommended set includes the core lints).
# The core lints are also what is used by pub.dev for scoring packages.

include: package:lints/recommended.yaml

# YRD5: every model class extends `DocSpecsSection`, whose stored `content`
# field each section class re-declares (with @override) to carry its own
# @Form/@ContentType annotations. Field-over-field override is the deliberate
# design (doc/tom_specs_model_rules.md §5.2), so the lint is disabled.
linter:
  rules:
    # The package is at 100% public-API dartdoc coverage
    # (tom_specs_documentation_standard.md §5 sets the bar at 95%). The lint
    # makes `dart analyze` the ratchet: a new public member without a doc
    # comment fails at edit time rather than waiting for a coverage sweep.
    #
    # It matters more here than anywhere else in the quest. This package is the
    # single source of truth for NINE generated language runtimes, and a
    # class's or member's doc comment is captured into `spec_model.meta.json`
    # and rendered by every generated facade — so an undocumented member is an
    # undocumented API in nine languages, not one.
    public_member_api_docs: true

    # Paired with it deliberately. The campaign adds `[Reference]` links at
    # scale, and an unresolvable one is invisible until `dart doc` runs. A
    # `@Form` field name is NOT a Dart identifier, so `[role]` can never
    # resolve — see tom_specs_model_rules.md §9.6.
    comment_references: true
    overridden_fields: false

