name: tom_specs_clitool
description: CLI tools for TomSpecs model analysis and outline generation.
version: 1.0.0
# Internal build tooling with path dependencies on unpublished sibling packages
# (tom_doc_specs / tom_doc_scanner); never published to pub.dev.
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  analyzer: ^10.0.0
  args: ^2.6.0
  # The model-freshness fingerprint (lib/src/model_freshness.dart). Declared
  # explicitly rather than leaned on as an analyzer transitive.
  crypto: ^3.0.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  json2yaml: ^3.0.1
  yaml: ^3.1.2
  # Base-first home of the analyzer-summary infrastructure: the grouped
  # packages.sum builder (GroupedPackageBundleBuilder) and the package-config
  # helpers (readPackageRoots / mergePackageRootsForDirs / SummaryConfigException)
  # consumed by bin/summaries.dart. Published — version constraint, not a path.
  # Floor 0.7.2: the summary cache is partitioned by Dart SDK version, not just
  # analyzer major, so a point-SDK bundle-format drift can't crash the cached
  # `.sum` reader (RCK26); and bundles are invalidated when a transitive
  # dependency changes version, so a stale closure can't silently drop classes
  # (RCJ6). Both are correctness fixes for any summary-cache consumer.
  tom_analyzer_shared: ">=0.7.2"
  # publish_to: none package — consumed by path per the workspace convention for
  # unpublished sibling tooling (NOT a pubspec override of a published dep).
  tom_doc_specs:
    path: ../tom_doc_specs
  # The generic SOM runtime the Dart emitter targets — the emitter drives its
  # SpecModel and the generated code extends its SomNode/SomList facade base.
  tom_som_dart_runtime:
    path: ../tom_som_dart_runtime
  # The annotation library the model is written against. The validator reads
  # `deferredCodeSpecParts` from it (invariant PART-ROUTED's exemption) rather than
  # restating which CodeSpecs parts have no generated surface.
  tom_specs_core:
    path: ../tom_specs_core

dev_dependencies:
  json_schema: ^5.2.2
  lints: ^6.0.0
  test: ^1.25.6
  # Used only by the schema-generator test to scan a known-good markdown export
  # without going through DocSpecs' on-disk schema resolver.
  tom_doc_scanner:
    path: ../tom_doc_scanner
