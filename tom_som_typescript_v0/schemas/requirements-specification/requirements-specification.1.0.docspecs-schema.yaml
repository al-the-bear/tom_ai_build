        description: Reference to the automation script
      - fieldname: priority
        description: "Critical, High, Medium, or Low"
  tr1-summ-form:
    fields:
      - fieldname: totalTechnicalRequirements
        description: Total count of technical requirements captured
      - fieldname: criticalCount
        description: Number of requirements at Critical priority
      - fieldname: highCount
        description: Number of requirements at High priority
      - fieldname: mediumCount
        description: Number of requirements at Medium priority
      - fieldname: lowCount
        description: Number of requirements at Low priority
      - fieldname: architectureDrivers
        description: "e.g., 99.99% availability, sub-100ms latency, 10k concurrent users"
  tred-form:
    fields:
      - fieldname: description
        required: true
        description: "Full requirement statement, e.g., The system shall respond within 100ms"
      - fieldname: category
        required: true
        description: ISO 25010 quality characteristic the requirement addresses
      - fieldname: subcategory
        description: "More specific aspect, e.g., response time within Performance"
      - fieldname: priority
        required: true
        description: "Critical, High, Medium, or Low"
