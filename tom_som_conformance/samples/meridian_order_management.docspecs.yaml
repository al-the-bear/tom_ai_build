    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-1/acceptanceCriteria/ACCR-CRIT-LST-1/content":
      "criterionId": |2-
        FR-01-AC-1
      "criterionTitle": |2-
        EDI order accepted
      "given": |2-
        a well-formed EDI 850 purchase order
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        an Order is created in state Captured and a domain event is emitted
      "verificationMethod": |2-
        Automated test
      "when": |2-
        the EDI adapter submits it to the capture API
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-1/acceptanceCriteria/ACCR-CRIT-LST-2/content":
      "criterionId": |2-
        FR-01-AC-2
      "criterionTitle": |2-
        REST order accepted
      "given": |2-
        a valid REST order payload from an authenticated partner
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        an Order is created in state Captured with the same shape as EDI
      "verificationMethod": |2-
        Automated test
      "when": |2-
        POST /orders is called
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-1/content":
      "requirementId": |2-
        FR-01
      "status": |2-
        Approved
      "title": |2-
        Capture orders from EDI and REST channels
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-1/details/content":
      "category": |2-
        Order Capture
      "description": |2-
        The system must accept orders from the wholesale EDI adapter and the public REST order API, translating both into a single internal order-capture command so downstream processing is channel-agnostic.
      "requirementType": |2-
        Functional
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-1/priority/content":
      "businessValue": |2-
        High
      "effort": |2-
        M
      "priority": |2-
        Must
      "riskLevel": |2-
        Medium
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-1/source/content":
      "rationale": |2-
        Both channels must feed the same lifecycle to retire re-keying.
      "requestDate": |2-
        2026-04-02
      "source": |2-
        VP Operations
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-1/verification/content":
      "customerDissatisfaction": |2-
        1
      "customerSatisfaction": |2-
        5
      "fitCriterion": |2-
        An EDI and a REST order both produce an Order in state Captured within 2s.
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-2/acceptanceCriteria/ACCR-CRIT-LST-1/content":
      "criterionId": |2-
        FR-02-AC-1
      "criterionTitle": |2-
        Price snapshotted onto line
      "given": |2-
        an order with two lines
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        each line stores the resolved unit price as of the pricing timestamp
      "verificationMethod": |2-
        Automated test
      "when": |2-
        the order is priced
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-2/content":
      "requirementId": |2-
        FR-02
      "status": |2-
        Approved
      "title": |2-
        Price orders synchronously at capture time
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-2/details/content":
      "category": |2-
        Pricing
      "description": |2-
        Pricing must be computed synchronously during order processing and the resulting unit price snapshotted onto each order line, eliminating the nightly batch and making historical orders reproducible.
      "requirementType": |2-
        Functional
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-2/priority/content":
      "businessValue": |2-
        High
      "effort": |2-
        M
      "priority": |2-
        Must
      "riskLevel": |2-
        Medium
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-2/verification/content":
      "fitCriterion": |2-
        Each confirmed line carries a unitPrice snapshot equal to the price list at pricing time.
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-3/acceptanceCriteria/ACCR-CRIT-LST-1/content":
      "criterionId": |2-
        FR-03-AC-1
      "criterionTitle": |2-
        Stock reserved when available
      "given": |2-
        an order whose lines all have sufficient stock on hand
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        every line reserves its quantity and the order is eligible to confirm
      "verificationMethod": |2-
        Automated test
      "when": |2-
        the order is submitted for confirmation
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-3/acceptanceCriteria/ACCR-CRIT-LST-2/content":
      "criterionId": |2-
        FR-03-AC-2
      "criterionTitle": |2-
        Short line placed on Hold
      "given": |2-
        an order with one line whose demand exceeds available stock
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        only the short line is placed on Hold while the remaining lines reserve normally
      "verificationMethod": |2-
        Automated test
      "when": |2-
        reservation runs before confirmation
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-3/content":
      "requirementId": |2-
        FR-03
      "status": |2-
        Approved
      "title": |2-
        Reserve stock before confirmation
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-3/details/content":
      "category": |2-
        Fulfilment
      "description": |2-
        Before an order is confirmed the system must reserve stock for every line; insufficient stock places the affected line on Hold rather than failing the whole order.
      "requirementType": |2-
        Functional
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-3/priority/content":
      "businessValue": |2-
        High
      "effort": |2-
        L
      "priority": |2-
        Must
      "riskLevel": |2-
        High
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-4/acceptanceCriteria/ACCR-CRIT-LST-1/content":
      "criterionId": |2-
        FR-04-AC-1
      "criterionTitle": |2-
        Order confirmed within budget
      "given": |2-
        a captured order that passes validation, pricing, and reservation
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        the order reaches state Confirmed within five minutes of capture
      "verificationMethod": |2-
        Automated test
      "when": |2-
        the lifecycle processes it under normal load
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-4/acceptanceCriteria/ACCR-CRIT-LST-2/content":
      "criterionId": |2-
        FR-04-AC-2
      "criterionTitle": |2-
        Confirmation surfaced to operations and tracking
      "given": |2-
        an order that has just reached state Confirmed
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        the order appears as Confirmed on the operations work list and the public tracking page
      "verificationMethod": |2-
        Automated test
      "when": |2-
        the confirmation event is published
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-4/content":
      "requirementId": |2-
        FR-04
      "status": |2-
        Approved
      "title": |2-
        Confirm orders within five minutes
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-4/details/content":
      "category": |2-
        Order Lifecycle
      "description": |2-
        An order that passes validation, pricing, and reservation must reach state Confirmed within five minutes of capture, with the confirmation communicated on the operations work list and the public tracking page.
      "requirementType": |2-
        Functional
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-4/priority/content":
      "businessValue": |2-
        High
      "effort": |2-
        M
      "priority": |2-
        Must
      "riskLevel": |2-
        Medium
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-5/acceptanceCriteria/ACCR-CRIT-LST-1/content":
      "criterionId": |2-
        FR-05-AC-1
      "criterionTitle": |2-
        Amendment re-runs pricing and reservation
      "given": |2-
        a confirmed order that has not yet dispatched
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        pricing and reservation re-run for the affected line and the change is written to the audit trail
      "verificationMethod": |2-
        Automated test
      "when": |2-
        a clerk changes a line quantity
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-5/acceptanceCriteria/ACCR-CRIT-LST-2/content":
      "criterionId": |2-
        FR-05-AC-2
      "criterionTitle": |2-
        Cancellation blocked after dispatch
      "given": |2-
        an order that has already dispatched
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        the cancellation is rejected and the rejection is recorded in the audit trail
      "verificationMethod": |2-
        Automated test
      "when": |2-
        a clerk attempts to cancel it
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-5/content":
      "requirementId": |2-
        FR-05
      "status": |2-
        Approved
      "title": |2-
        Amend or cancel an order before dispatch
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-5/details/content":
      "category": |2-
        Order Amendment
      "description": |2-
        Until an order is dispatched, a clerk must be able to amend line quantities and cancel lines or the whole order; each amendment re-runs pricing and reservation for the affected lines and is fully audited.
      "requirementType": |2-
        Functional
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-5/priority/content":
      "businessValue": |2-
        Medium
      "effort": |2-
        M
      "priority": |2-
        Should
      "riskLevel": |2-
        Medium
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-6/acceptanceCriteria/ACCR-CRIT-LST-1/content":
      "criterionId": |2-
        FR-06-AC-1
      "criterionTitle": |2-
        Supervisor releases hold
      "given": |2-
        an order in state Hold
      "priority": |2-
        Must
      "status": |2-
        Draft
      "testType": |2-
        Integration
      "then": |2-
        the order resumes at the transition that placed it on Hold and the reason is audited
      "verificationMethod": |2-
        Automated test
      "when": |2-
        a supervisor releases it with a reason
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-6/content":
      "requirementId": |2-
        FR-06
      "status": |2-
        Approved
      "title": |2-
        Release a manual hold
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-6/details/content":
      "category": |2-
        Exception Handling
      "description": |2-
        An Order Supervisor must be able to review an order on Hold and release it back into the lifecycle, recording a reason that is attached to the audit trail.
      "requirementType": |2-
        Functional
    "SBP/introductionAndScope/requirements/functionalRequirements/FRE-REQU-LST-6/priority/content":
      "businessValue": |2-
        High
      "effort": |2-
        S
      "priority": |2-
        Must
      "riskLevel": |2-
        Low
    "SBP/introductionAndScope/requirements/organizationalRequirements/ORRQ-REQU-LST-1/content":
      "description": |2-
        Before cutover the order-operations desk must be trained to run the full order lifecycle on MOM alone, including hold release and amendments.
      "requirementId": |2-
        OR-01
      "title": |2-
        Train the operations desk on MOM
    "SBP/introductionAndScope/requirements/organizationalRequirements/ORRQ-REQU-LST-1/impact/content":
      "changeComplexity": |2-
        Medium
      "changeType": |2-
        Process + tooling
      "impactedGroups": |2-
        Order Operations desk
      "impactedUserCount": |2-
        25
      "resistance": |2-
        Low
    "SBP/introductionAndScope/requirements/organizationalRequirements/ORRQ-REQU-LST-2/content":
      "description": |2-
        The two-week parallel run against OrderDesk requires staffing to reconcile both systems daily until the < 0.1% variance gate passes.
      "requirementId": |2-
        OR-02
      "title": |2-
        Staff the parallel run
    "SBP/introductionAndScope/requirements/organizationalRequirements/ORRQ-REQU-LST-2/impact/content":
      "changeComplexity": |2-
        Medium
      "changeType": |2-
        Temporary dual-running
      "impactedGroups": |2-
        Order Operations, Finance
      "impactedUserCount": |2-
        30
      "resistance": |2-
        Medium
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-1/classification/content":
      "category": |2-
        Access Control
      "dataClassification": |2-
        Internal
      "priority": |2-
        Must
      "rationale": |2-
        Least privilege across human and machine actors.
      "source": |2-
        Security chapter
      "subcategory": |2-
        Authorization
      "threatMitigated": |2-
        Unauthorized order manipulation
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-1/compliance/content":
      "complianceReference": |2-
        Corporate IAM policy v3
      "nistControl": |2-
        AC-6
      "owaspCategory": |2-
        A01:2021 Broken Access Control
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-1/content":
      "description": |2-
        Access is governed by the roles Order Clerk, Order Supervisor, Pricing Admin, and Integration (machine) accounts scoped to specific channels; every state transition is attributed to an authenticated principal.
      "requirementId": |2-
        SR-01
      "title": |2-
        Role-based access control
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-2/classification/content":
      "category": |2-
        Data Protection
      "dataClassification": |2-
        Confidential
      "priority": |2-
        Must
      "rationale": |2-
        GDPR obligations on customer records with a 7-year retention.
      "source": |2-
        Data Protection Officer
      "subcategory": |2-
        Encryption
      "threatMitigated": |2-
        PII disclosure from storage compromise
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-2/compliance/content":
      "complianceReference": |2-
        GDPR Art. 32
      "nistControl": |2-
        SC-28
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-2/content":
      "description": |2-
        All customer personally identifiable information must be encrypted at rest.
      "requirementId": |2-
        SR-02
      "title": |2-
        Encrypt customer PII at rest
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-3/classification/content":
      "category": |2-
        API Security
      "dataClassification": |2-
        Internal
      "priority": |2-
        Must
      "rationale": |2-
        Machine-to-machine partner access without shared secrets in code.
      "source": |2-
        Security chapter
      "subcategory": |2-
        Authentication
      "threatMitigated": |2-
        Credential replay and partner impersonation
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-3/compliance/content":
      "nistControl": |2-
        IA-5
      "owaspCategory": |2-
        API2:2023 Broken Authentication
    "SBP/introductionAndScope/requirements/securityRequirements/SECRQ-REQU-LST-3/content":
      "description": |2-
        The public order API must authenticate partners with OAuth2 client-credentials tokens and enforce per-partner rate limits at the gateway.
      "requirementId": |2-
        SR-03
      "title": |2-
        OAuth2 client credentials on the public API
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-1/content":
      "requirementId": |2-
        TR-01
      "status": |2-
        Approved
      "title": |2-
        Confirmation latency budget
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-1/details/content":
      "category": |2-
        Performance
      "description": |2-
        The 95th-percentile order-confirmation latency must stay within budget under peak load.
      "priority": |2-
        Must
      "rationale": |2-
        Sub-30s p95 keeps the five-minute business promise safe under 3x peak.
      "source": |2-
        Operations SLA
      "subcategory": |2-
        Latency
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-1/measurement/content":
      "currentValue": |2-
        4.2h (legacy)
      "measurementEnvironment": |2-
        Load test at 3x peak-hour volume
      "measurementFrequency": |2-
        Per release + continuous in production
      "measurementMethod": |2-
        Distributed tracing over the confirmation span
      "metric": |2-
        p95 capture-to-confirmation latency
      "targetValue": |2-
        < 30s
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-2/content":
      "requirementId": |2-
        TR-02
      "status": |2-
        Approved
      "title": |2-
        Capture API availability
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-2/details/content":
      "category": |2-
        Reliability
      "description": |2-
        The order-capture API must meet a 99.9% monthly availability target.
      "priority": |2-
        Must
      "rationale": |2-
        Marketplace partners depend on the capture API being continuously reachable.
      "source": |2-
        Partner integration agreement
      "subcategory": |2-
        Availability
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-2/measurement/content":
      "measurementFrequency": |2-
        Monthly
      "measurementMethod": |2-
        Synthetic probes + gateway success-rate metrics
      "metric": |2-
        Monthly capture-API availability
      "targetValue": |2-
        >= 99.9%
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-3/content":
      "requirementId": |2-
        TR-03
      "status": |2-
        Approved
      "title": |2-
        Event-sourced order service
    "SBP/introductionAndScope/requirements/technicalRequirements/TERQ-REQU-LST-3/details/content":
      "category": |2-
        Architecture
      "description": |2-
        The order service must be event-sourced: the append-only event log is the system of record and all read models are projections rebuildable from the log.
      "priority": |2-
        Must
      "rationale": |2-
        Reproducible history and rebuildable projections are core to auditability.
      "source": |2-
        Enterprise Architecture Board
      "subcategory": |2-
        Persistence
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/actorOverview/ACEN-ACTO-LST-1/identification/content":
      "actorId": |2-
        ACT-01
      "actorName": |2-
        Order Clerk
      "actorType": |2-
        Human
      "category": |2-
        Primary
      "description": |2-
        Clears the order work list, amends lines, and cancels orders before dispatch.
      "estimatedCount": |2-
        25
      "geographicDistribution": |2-
        Single distribution centre
      "organizationalUnit": |2-
        Order Operations
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/actorOverview/ACEN-ACTO-LST-2/identification/content":
      "actorId": |2-
        ACT-02
      "actorName": |2-
        Order Supervisor
      "actorType": |2-
        Human
      "category": |2-
        Primary
      "description": |2-
        Reviews orders on Hold and releases them back into the lifecycle.
      "estimatedCount": |2-
        4
      "geographicDistribution": |2-
        Single distribution centre
      "organizationalUnit": |2-
        Order Operations
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/actorOverview/ACEN-ACTO-LST-3/identification/content":
      "actorId": |2-
        ACT-03
      "actorName": |2-
        Pricing Admin
      "actorType": |2-
        Human
      "category": |2-
        Supporting
      "description": |2-
        Maintains the price lists that the synchronous pricing step consumes.
      "estimatedCount": |2-
        3
      "geographicDistribution": |2-
        Single distribution centre
      "organizationalUnit": |2-
        Commercial
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/actorOverview/ACEN-ACTO-LST-4/identification/content":
      "actorId": |2-
        ACT-04
      "actorName": |2-
        EDI Integration Account
      "actorType": |2-
        System
      "category": |2-
        Primary
      "description": |2-
        Machine account through which the wholesale EDI adapter submits orders.
      "estimatedCount": |2-
        1
      "geographicDistribution": |2-
        Single distribution centre
      "organizationalUnit": |2-
        Integration
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/POANGU-POST-LST-1/content":
      "dataPostcondition": |2-
        Order and OrderLine rows persisted; reservation recorded against Product stock.
      "minimalGuarantees": |2-
        Either an Order exists in a well-defined state or the submission is rejected with a reason; no partial order is persisted.
      "successGuarantees": |2-
        The Order is in state Confirmed with priced, reserved lines and a full event history.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/PRANTR-PREC-LST-1/content":
      "precondition": |2-
        The submitting Integration account is authenticated and scoped to the wholesale channel.
      "trigger": |2-
        An EDI 850 purchase order arrives at the wholesale adapter.
      "triggerData": |2-
        EDI 850 document
      "triggerSource": |2-
        EDI gateway
      "triggerType": |2-
        External
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/extensions/EXTEN-EXTE-LST-1/EXTST-STEP-LST-1/content":
      "action": |2-
        System places the Order on Hold and emits OrderHeld.
      "response": |2-
        Order appears in the Hold filter of the work list with reason "Credit exceeded".
      "stepNumber": |2-
        2a.1
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/extensions/EXTEN-EXTE-LST-1/content":
      "branchPoint": |2-
        Step 2
      "condition": |2-
        Customer credit limit would be exceeded
      "description": |2-
        Validation detects the order exceeds the customer credit limit.
      "extensionId": |2-
        2a
      "extensionType": |2-
        Exception
      "outcome": |2-
        Order is placed on Hold for supervisor review (see UC-02).
      "returnPoint": |2-
        Step 3 after release
      "severity": |2-
        High
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/extensions/EXTEN-EXTE-LST-2/EXTST-STEP-LST-1/content":
      "action": |2-
        System holds the unsatisfiable line and reserves the rest.
      "response": |2-
        The order is partially reserved; the held line is flagged for follow-up.
      "stepNumber": |2-
        4a.1
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/extensions/EXTEN-EXTE-LST-2/content":
      "branchPoint": |2-
        Step 4
      "condition": |2-
        Insufficient stock for one or more lines
      "description": |2-
        Reservation cannot be fully satisfied for a line.
      "extensionId": |2-
        4a
      "extensionType": |2-
        Exception
      "outcome": |2-
        The affected line is placed on Hold; other lines proceed.
      "returnPoint": |2-
        Step 5 for satisfiable lines
      "severity": |2-
        Medium
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/identification/content":
      "briefDescription": |2-
        A wholesale EDI purchase order is captured, validated, priced, reserved, and confirmed.
      "designScope": |2-
        System
      "fullDescription": |2-
        The EDI adapter submits a translated purchase order to the capture command API. The system validates the customer and lines, prices each line synchronously, reserves stock, and confirms the order — emitting a domain event at every transition so the work list and public tracking page stay current.
      "goalLevel": |2-
        User goal
      "interactionId": |2-
        UC-01
      "primaryActor": |2-
        ACT-04 EDI Integration Account
      "processReference": |2-
        BP-Order-Capture
      "supportingActors": |2-
        ACT-01 Order Clerk
      "useCaseName": |2-
        Capture Wholesale Order (EDI)
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/mainScenario/MNSST-STEP-LST-1/content":
      "actorAction": |2-
        EDI adapter submits the translated order to the capture API.
      "dataInvolved": |2-
        Order, OrderLine
      "stepNumber": |2-
        1
      "systemResponse": |2-
        System creates the Order in state Captured and emits OrderCaptured.
      "uiElementUsed": |2-
        —
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/mainScenario/MNSST-STEP-LST-2/content":
      "actorAction": |2-
        System validates customer credit and line stock references.
      "businessRuleApplied": |2-
        Credit limit not exceeded
      "dataInvolved": |2-
        Customer, Product
      "stepNumber": |2-
        2
      "systemResponse": |2-
        Order moves to Validated; invalid references are flagged per line.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/mainScenario/MNSST-STEP-LST-3/content":
      "actorAction": |2-
        System prices each line against the active price list.
      "businessRuleApplied": |2-
        FR-02 price snapshot
      "dataInvolved": |2-
        PriceList, OrderLine
      "stepNumber": |2-
        3
      "systemResponse": |2-
        Unit price is snapshotted onto each line; Order moves to Priced.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/mainScenario/MNSST-STEP-LST-4/content":
      "actorAction": |2-
        System reserves stock for every line.
      "businessRuleApplied": |2-
        FR-03 reserve before confirm
      "dataInvolved": |2-
        Product
      "stepNumber": |2-
        4
      "systemResponse": |2-
        Reservations recorded; Order moves to Reserved.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-1/mainScenario/MNSST-STEP-LST-5/content":
      "actorAction": |2-
        System confirms the order.
      "businessRuleApplied": |2-
        FR-04 five-minute confirmation
      "dataInvolved": |2-
        Order
      "stepNumber": |2-
        5
      "systemResponse": |2-
        Order moves to Confirmed within five minutes and appears on the work list.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-2/POANGU-POST-LST-1/content":
      "auditTrail": |2-
        Release attributed to the supervisor principal with timestamp and reason.
      "successGuarantees": |2-
        The order resumes at the transition that placed it on Hold, with the release reason audited.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-2/PRANTR-PREC-LST-1/content":
      "precondition": |2-
        An order exists in state Hold and the actor holds the Order Supervisor role.
      "trigger": |2-
        Supervisor selects a held order from the work list.
      "triggerSource": |2-
        Order Work List screen
      "triggerType": |2-
        User
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-2/identification/content":
      "briefDescription": |2-
        A supervisor reviews an order on Hold and releases it back into the lifecycle.
      "designScope": |2-
        System
      "fullDescription": |2-
        A supervisor opens an order on Hold from the work list, reviews the hold reason, and either releases it — resuming the lifecycle at the transition that placed it on Hold — or cancels it, recording a reason in both cases.
      "goalLevel": |2-
        User goal
      "interactionId": |2-
        UC-02
      "primaryActor": |2-
        ACT-02 Order Supervisor
      "processReference": |2-
        BP-Order-Exception
      "useCaseName": |2-
        Release Order Hold
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-2/mainScenario/MNSST-STEP-LST-1/content":
      "actorAction": |2-
        Supervisor opens the held order and reviews the reason.
      "dataInvolved": |2-
        Order
      "stepNumber": |2-
        1
      "systemResponse": |2-
        System shows the lifecycle timeline and the hold reason.
      "uiElementUsed": |2-
        Order Detail timeline
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-2/mainScenario/MNSST-STEP-LST-2/content":
      "actorAction": |2-
        Supervisor releases the order with a reason.
      "businessRuleApplied": |2-
        FR-06 hold release
      "dataInvolved": |2-
        Order
      "stepNumber": |2-
        2
      "systemResponse": |2-
        System resumes the lifecycle and emits OrderHoldReleased.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-3/POANGU-POST-LST-1/content":
      "dataPostcondition": |2-
        OrderLine updated; prior values retained in the event history.
      "successGuarantees": |2-
        The amended line carries a fresh price snapshot and reservation; the amendment is audited.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-3/PRANTR-PREC-LST-1/content":
      "precondition": |2-
        The order is not yet dispatched and the actor holds the Order Clerk role.
      "trigger": |2-
        Clerk edits a line quantity on the Order Detail screen.
      "triggerSource": |2-
        Order Detail screen
      "triggerType": |2-
        User
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-3/identification/content":
      "briefDescription": |2-
        A clerk changes a line quantity before dispatch, re-running pricing and reservation.
      "designScope": |2-
        System
      "fullDescription": |2-
        A clerk edits the quantity of a line on a not-yet-dispatched order. The system re-prices and re-reserves only the affected line and records the amendment on the audit trail.
      "goalLevel": |2-
        User goal
      "interactionId": |2-
        UC-03
      "primaryActor": |2-
        ACT-01 Order Clerk
      "processReference": |2-
        BP-Order-Amendment
      "useCaseName": |2-
        Amend Order Line Before Dispatch
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-3/mainScenario/MNSST-STEP-LST-1/content":
      "actorAction": |2-
        Clerk changes the quantity of a line and saves.
      "businessRuleApplied": |2-
        FR-05 amend before dispatch
      "dataInvolved": |2-
        OrderLine, PriceList
      "stepNumber": |2-
        1
      "systemResponse": |2-
        System validates the new quantity and re-prices the line.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/interactionCatalog/INEN-INTE-LST-3/mainScenario/MNSST-STEP-LST-2/content":
      "actorAction": |2-
        System re-reserves stock for the amended line.
      "businessRuleApplied": |2-
        FR-03 reserve before confirm
      "dataInvolved": |2-
        Product
      "stepNumber": |2-
        2
      "systemResponse": |2-
        Reservation is adjusted; the order returns to Confirmed if fully satisfied.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/keyScenarios/SCNRY-SCEN-LST-1/SCNST-STEP-LST-1/content":
      "action": |2-
        Submits a two-line wholesale order.
      "actor": |2-
        ACT-04 EDI Integration Account
      "stepNumber": |2-
        1
      "systemResponse": |2-
        Order captured, validated, priced, reserved, and confirmed within five minutes.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/keyScenarios/SCNRY-SCEN-LST-1/SCNST-STEP-LST-2/content":
      "action": |2-
        Observes the confirmed order on the work list.
      "actor": |2-
        ACT-01 Order Clerk
      "stepNumber": |2-
        2
      "systemResponse": |2-
        Order shows state Confirmed with both lines priced and reserved.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/keyScenarios/SCNRY-SCEN-LST-1/SCNST-STEP-LST-3/content":
      "action": |2-
        Receives the warehouse dispatch webhook.
      "actor": |2-
        System
      "stepNumber": |2-
        3
      "systemResponse": |2-
        Order moves to Fulfilled and the public tracking page updates.
    "SBP/targetOperatingModelConcept/targetBusinessProcess/processStepsAndActorInteractions/keyScenarios/SCNRY-SCEN-LST-1/identification/content":
      "businessGoal": |2-
        Confirm and fulfil a wholesale order without manual intervention.
      "complexity": |2-
        Medium
      "description": |2-
        A clean wholesale order flows from EDI capture through to fulfilment with no holds.
      "primaryActor": |2-
        ACT-04 EDI Integration Account
      "priority": |2-
        High
      "scenarioId": |2-
        SCN-01
      "scenarioName": |2-
        Happy-path wholesale order, capture to fulfilment
      "scenarioType": |2-
        End-to-end
      "supportingActors": |2-
        ACT-01 Order Clerk
