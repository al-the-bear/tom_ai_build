    fields:
      - fieldname: primaryMetric
        description: Main metric for this category
      - fieldname: secondaryMetrics
        description: Supporting metrics
      - fieldname: targetValue
        description: Target for primary metric
      - fieldname: currentBaseline
        description: Starting baseline value
