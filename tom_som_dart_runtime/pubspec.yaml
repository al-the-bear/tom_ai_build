name: tom_som_dart_runtime
description: >-
  TomSpecs Specification Object Model — generic Dart runtime. The
  language-independent, hand-written runtime shared by every generated typed
  `tom_som_dart_v0` facade and the TomSpecs editor: the path-keyed in-memory
  document representation, the meta-model ("reflection") classes that load the
  exported spec-model meta-data, and the document validator. Pure Dart, no
  Flutter dependency.
# Version tracks the TomSpecs model version (kept in step by generate_som's
# packaging hook, alignRuntimeManifestVersion). The typed `tom_som_dart_v0`
# facade pins the same version.
version: 1.1.0
repository: https://github.com/al-the-bear/tom_ai_build
homepage: https://github.com/al-the-bear/tom_ai_build/tree/main/tom_som_dart_runtime

environment:
  sdk: ^3.11.4

dependencies:
  # YAML parsing for the native `*.docspecs.yaml` load path. The
  # emitter is hand-written (self-verifying block scalars); only the reader
  # needs a parser.
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
