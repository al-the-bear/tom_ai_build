form-types:
  daent-iden-form:
    fields:
      - fieldname: entityName
        required: true
        description: "Singular noun or noun phrase (e.g., Customer, OrderItem)"
      - fieldname: tableName
        description: Database table name if different from logical name
      - fieldname: entityAlias
        description: "Short alias for diagrams and references (e.g., CUST, ORD)"
      - fieldname: description
        description: Clear definition of what this entity represents
      - fieldname: entityStereoType
        description: "Entity pattern: AggregateRoot | Entity | ValueObject | Event | View | Bridge"
  daent-clas-form:
    fields:
      - fieldname: category
        description: "Data category: MasterData | TransactionData | ReferenceData | ConfigurationData | AuditData"
      - fieldname: boundedContext
        description: Domain-driven design bounded context this entity belongs to
      - fieldname: owningDomain
        description: Business domain responsible for this entity
      - fieldname: dataOwner
        description: Role or team accountable for data quality
      - fieldname: dataSteward
        description: Person or role responsible for data governance
      - fieldname: sourceSystem
        description: System of record or originating system for migration
  daent-life-form:
    fields:
      - fieldname: lifecyclePhases
        description: "Phases: Active → Archived → Purged, or Active → Soft-deleted → Hard-deleted"
      - fieldname: retentionPolicy
        description: "How long data is retained and why (e.g., 7 years per tax regulations)"
      - fieldname: archivalTrigger
        description: "Condition for moving to archive (e.g., 2 years after last activity)"
      - fieldname: archivalDestination
        description: "Where archived data goes: ColdStorage | Archive | DataLake"
      - fieldname: purgePolicy
        description: When and how data is permanently deleted
      - fieldname: anonymizationPolicy
        description: "PII anonymization rules (e.g., hash email after deletion)"
      - fieldname: auditRequirements
        description: "What changes must be tracked: None | KeyFields | AllFields | FullHistory"
      - fieldname: auditRetention
        description: How long audit records are kept
  daent-rela-form:
    fields:
      - fieldname: parentEntities
        description: "Entities this depends on (e.g., Order depends on Customer)"
      - fieldname: childEntities
        description: "Entities that depend on this (e.g., OrderItem depends on Order)"
      - fieldname: referencedEntities
        description: "Lookup/reference entities used (e.g., OrderStatus, PaymentMethod)"
      - fieldname: crossDomainRelationships
        description: Relationships that cross bounded context boundaries
  daatt-iden-form:
    fields:
      - fieldname: columnName
        description: "Database column name if different (e.g., snake_case)"
      - fieldname: description
        description: Clear definition of what this attribute represents
      - fieldname: businessTerm
        description: Business glossary term this maps to
      - fieldname: exampleValues
        description: "Comma-separated examples (e.g., \"Draft, Confirmed, Shipped\")"
  daatt-data-form:
    fields:
      - fieldname: dataType
        description: The logical type — selects the promoted options subsection.
      - fieldname: physicalType
        description: "Database type: VARCHAR(255), BIGINT, DECIMAL(10,2), TIMESTAMP"
      - fieldname: format
        description: "Display or storage format (e.g., YYYY-MM-DD, E.164 for phone)"
  daatt-dttx-form:
    fields:
      - fieldname: length
        description: Maximum character length
      - fieldname: collation
        description: "Character collation for text (e.g., utf8_general_ci)"
  daatt-dtnu-form:
    fields:
      - fieldname: precision
        description: Total digits for numeric types
      - fieldname: scale
        description: Decimal places for numeric types
  daatt-dttm-form:
    fields:
      - fieldname: timezone
        description: "For datetime: UTC | Local | WithOffset"
  daatt-dtbi-form:
    fields:
      - fieldname: maxSizeBytes
        description: Maximum stored size in bytes
  daatt-dtfr-form:
    fields:
      - fieldname: storageGroup
        required: true
        description: Naming group the files are filed under — sets their retention and access partition (e.g. documents/attachment)
      - fieldname: fileStore
        description: Name of the configured file store holding the files; empty means the deployment default store
      - fieldname: deleteWithRecord
        description: "Yes | No — whether deleting the record also deletes the file (Yes unless the file outlives its reference by design)"
      - fieldname: acceptedContentKinds
        description: "Comma-separated content kinds accepted on upload (e.g. PDF, PNG); empty means unrestricted"
      - fieldname: defaultContentKind
        description: Content kind recorded when an upload declares none
      - fieldname: maxFileSizeBytes
        description: Maximum accepted file size in bytes
  daatt-dten-form:
    fields:
      - fieldname: domainEnum
        required: true
        description: "DomainEnumEntry.enumName this attribute is typed by (e.g. OrderStatus) — declared once in the domain enum register, not restated here"
  daatt-deri-form:
    fields:
      - fieldname: isComputed
        description: "Whether value is computed: Yes | No"
      - fieldname: computeFormula
        description: Formula or expression for computed fields
      - fieldname: isDerived
        description: "Whether derived from other attributes: Yes | No"
      - fieldname: derivationLogic
        description: How derived value is calculated
  daatt-secu-form:
    fields:
      - fieldname: sensitivityLevel
        description: "Public | Internal | Confidential | Restricted | PII | PHI"
      - fieldname: isPii
        description: "Personally identifiable information: Yes | No"
      - fieldname: maskingRule
        description: "How to mask in logs/displays: None | Partial | Full | Hash"
      - fieldname: encryptionLevel
        description: "Field-level encryption: None | Encrypted | Tokenized"
      - fieldname: auditLevel
        description: "Change tracking: None | ValueChanges | FullHistory"
  daatt-migr-form:
    fields:
      - fieldname: sourceSystem
        description: Originating system for data lineage
      - fieldname: sourceAttribute
        description: Source field name for migration mapping
      - fieldname: transformationRule
        description: Transformation applied during migration/ETL
      - fieldname: dataLineage
        description: Upstream sources that feed this attribute
      - fieldname: qualityRules
        description: "Data quality checks (e.g., completeness, accuracy)"
  keagn-form:
    fields:
      - fieldname: generationStrategy
        description: "Auto | Sequence | UUID | ULID | Custom | Natural"
      - fieldname: sequenceName
        description: Database sequence name if applicable
      - fieldname: isNaturalKey
        description: "Whether key has business meaning: Yes | No"
  kearf-form:
    fields:
      - fieldname: referencedEntity
        description: "For foreign keys: target entity name"
      - fieldname: referencedKey
        description: "For foreign keys: target key/column name"
      - fieldname: onDeleteAction
        description: "Cascade | SetNull | Restrict | NoAction | SetDefault"
      - fieldname: onUpdateAction
        description: "Cascade | SetNull | Restrict | NoAction | SetDefault"
  keagv-form:
    fields:
      - fieldname: deferrable
        description: "Whether constraint check can be deferred: Yes | No"
  enrle-iden-form:
    fields:
      - fieldname: relationshipType
        description: "Association | Aggregation | Composition | Generalization | Dependency"
      - fieldname: description
        description: Business meaning of this relationship
      - fieldname: businessJustification
        description: Why this relationship exists from business perspective
      - fieldname: implementationType
        description: "ForeignKey | JunctionTable | Embedded | Reference"
  enrle-card-form:
    fields:
      - fieldname: sourceCardinality
        description: "Source side: 1 | 0..1 | 0..* | 1..* | n..m"
      - fieldname: targetCardinality
        description: "Target side: 1 | 0..1 | 0..* | 1..* | n..m"
      - fieldname: sourceParticipation
        description: "Mandatory | Optional (whether source must participate)"
      - fieldname: targetParticipation
        description: "Mandatory | Optional (whether target must participate)"
      - fieldname: minSourceInstances
        description: Minimum number of source entity instances
      - fieldname: maxTargetInstances
        description: Maximum number of related target instances
  enrle-refe-form:
    fields:
      - fieldname: onDeleteAction
        description: "Cascade | SetNull | Restrict | NoAction | SetDefault | Archive"
      - fieldname: onUpdateAction
        description: "Cascade | SetNull | Restrict | NoAction"
      - fieldname: enforcementLevel
        description: "Database | Application | Both | None"
      - fieldname: isDeferrable
        description: "Whether constraint check can be deferred: Yes | No"
      - fieldname: cascadeScope
        description: "For cascading: DirectOnly | AllDescendants | Custom"
      - fieldname: orphanHandling
        description: "How orphaned records are handled: Prevent | Allow | AssignDefault"
  enrle-navi-form:
    fields:
      - fieldname: navigability
        description: "Bidirectional | SourceToTarget | TargetToSource"
      - fieldname: loadingStrategy
        description: "Eager | Lazy | Explicit | None"
      - fieldname: foreignKeyLocation
        description: "Where FK resides: Source | Target | JunctionTable"
      - fieldname: junctionTableName
        description: "For many-to-many: name of the junction/bridge table"
      - fieldname: inverseRelationship
        description: Name of the relationship from the other side
  datcl-over-form:
    fields:
      - fieldname: classificationFramework
        description: "Standard used: Custom | ISO27001 | NIST | IndustrySpecific"
      - fieldname: defaultClassification
        description: Default sensitivity for unclassified data
      - fieldname: classificationOwner
        description: Role responsible for data classification decisions
      - fieldname: reviewFrequency
        description: "How often classifications are reviewed: Annually | Quarterly | OnChange"
  dclse-iden-form:
    fields:
      - fieldname: classificationLevel
        description: "Sensitivity: Public | Internal | Confidential | Restricted | TopSecret"
      - fieldname: description
        description: What this classification means
      - fieldname: dataCategories
        description: "Types of data in this class: PII | PHI | Financial | Legal | Technical"
      - fieldname: examples
        description: Examples of data at this classification
  dclse-stor-form:
    fields:
      - fieldname: encryptionAtRest
        description: "Encryption requirement for storage: None | Standard | Strong | FieldLevel"
      - fieldname: encryptionInTransit
        description: "Encryption for transmission: TLS | mTLS | EndToEnd"
      - fieldname: storageLocations
        description: "Where data can be stored: OnPremise | Cloud | Either | Restricted"
      - fieldname: geographicRestrictions
        description: "Data residency requirements (e.g., EU only)"
      - fieldname: backupRequirements
        description: Special backup considerations
  dclse-acce-form:
    fields:
      - fieldname: accessLevels
        description: "Who can access: AllEmployees | RoleRestricted | NeedToKnow | SystemOnly"
      - fieldname: authenticationRequirements
        description: "Required auth: Basic | MFA | CertificateBased | Biometric"
      - fieldname: authorizationModel
        description: "RBAC | ABAC | MAC | DAC"
      - fieldname: auditRequirements
        description: "Access audit: None | ReadAudit | WriteAudit | FullAudit"
      - fieldname: accessRequestProcess
        description: "How access is granted: SelfService | ManagerApproval | SecurityApproval"
  dclse-rete-form:
    fields:
      - fieldname: retentionPeriod
        description: "How long data is retained (e.g., 7 years)"
      - fieldname: retentionBasis
        description: "Legal | Regulatory | Business | CustomerContract"
      - fieldname: archivalPolicy
        description: "When and how to archive: AfterPeriod | OnInactivity | Never"
      - fieldname: disposalMethod
        description: "How data is disposed: Delete | Anonymize | Shred | CryptoErase"
      - fieldname: disposalApproval
        description: "Who approves disposal: Automatic | DataOwner | Legal"
  dclse-comp-form:
    fields:
      - fieldname: applicableRegulations
        description: "Regulations: GDPR | HIPAA | SOX | PCI-DSS | CCPA | FERPA"
      - fieldname: complianceRequirements
        description: Specific compliance requirements
      - fieldname: breachNotificationSla
        description: "Time to notify on breach (e.g., 72 hours for GDPR)"
      - fieldname: dataSubjectRights
        description: "Applicable rights: Access | Rectification | Erasure | Portability"
  bjoen-iden-form:
    fields:
      - fieldname: objectAlias
        description: "Short alias for diagrams (e.g., ORD, CUST)"
      - fieldname: description
        description: Clear business definition of what this object represents
      - fieldname: businessGlossaryTerm
        description: Official business glossary term if different
      - fieldname: category
        description: "Transaction | MasterData | ReferenceData | Aggregate | ValueObject | Event"
      - fieldname: stereotypePattern
        description: "DDD pattern: AggregateRoot | Entity | ValueObject | DomainEvent | Saga"
  bjoen-doma-form:
    fields:
      - fieldname: boundedContext
        description: DDD bounded context this object belongs to
      - fieldname: owningDomain
        description: Business domain responsible for this object
      - fieldname: domainExpert
        description: Business expert who defines this object
      - fieldname: ubiquitousLanguageTerm
        description: How this is referred to in the ubiquitous language
      - fieldname: relatedObjects
        description: Key related business objects
  bjoen-life-form:
    fields:
      - fieldname: keyStates
        description: "Primary lifecycle states (e.g., Draft → Submitted → Confirmed → Closed)"
      - fieldname: initialState
        description: State when object is created
      - fieldname: terminalStates
        description: "States where lifecycle ends (e.g., Closed, Cancelled, Deleted)"
      - fieldname: stateTransitionRules
        description: Summary of allowed state transitions
      - fieldname: lifecycleOwner
        description: System or process responsible for lifecycle management
  bjoen-owne-form:
    fields:
      - fieldname: dataOwner
        description: Business role accountable for this object
      - fieldname: dataSteward
        description: Role responsible for data quality
      - fieldname: versioningStrategy
        description: "None | Sequential | Timestamp | Optimistic | EventSourced"
      - fieldname: concurrencyControl
        description: "Optimistic | Pessimistic | None"
      - fieldname: auditTrail
        description: "What changes are tracked: None | StateChanges | AllChanges | FullHistory"
  boaed-form:
    fields:
      - fieldname: format
        description: "Business format (e.g., currency, percentage, phone)"
      - fieldname: mandatory
        description: "Required | Optional | ConditionallyRequired"
      - fieldname: defaultValue
        description: Default value or derivation
  boaev-form:
    fields:
      - fieldname: validationRules
        description: Business validation rules
      - fieldname: allowedValues
        description: Enumerated values or range
      - fieldname: businessRules
        description: Rules affecting this attribute
      - fieldname: derivation
        description: How value is derived if calculated
  boaeg-form:
    fields:
      - fieldname: sensitivityLevel
        description: "Public | Internal | Confidential | PII | PHI"
      - fieldname: displayOrder
        description: Order for UI presentation
  ltet-form:
    fields:
      - fieldname: trigger
        description: What initiates this transition
      - fieldname: triggerType
        description: "UserAction | SystemEvent | Timer | ExternalEvent"
  ltec-form:
    fields:
      - fieldname: guardConditions
        description: Conditions that must be true for transition
