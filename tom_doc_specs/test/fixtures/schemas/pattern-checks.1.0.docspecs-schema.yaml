# Pattern checks on IDs and text
section-types:
  requirement:
    prefix: req
    pattern-check-id:
      pattern: "^REQ-\\d{3}$"
      error-message: "ID must match REQ-NNN"
    pattern-check-text:
      pattern: "shall|must"
      error-message: "Requirements must contain 'shall' or 'must'"

document:
  sections:
    requirements:
      section-type: requirement
