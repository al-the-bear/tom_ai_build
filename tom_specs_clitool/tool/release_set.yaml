# The release-1 set and its closure rules, read by
# bin/check_release_closure.dart (lib/src/release_closure.dart).
#
# This is the committed record of the release-1 scope: the Dart chain plus the
# eight non-Dart runtime/v0 pairs and the conformance assets. The editor,
# tom_spec_engine and tom_specs_reviewer are out of scope — excluding the
# engine is what removes the tom_assistant / tom_brain / tom_d4rt links — and
# the `forbid` list is that exclusion made mechanical: red wherever reached,
# allowlisted or not.

# Dart members: package name -> container-root-relative directory. The walk
# starts here and recurses through `dependencies`.
release_set:
  tom_specs_core: tom_ai/ai_build/tom_specs_core
  tom_doc_scanner: tom_ai/ai_build/tom_doc_scanner
  tom_doc_specs: tom_ai/ai_build/tom_doc_specs
  tom_som_dart_runtime: tom_ai/ai_build/tom_som_dart_runtime
  tom_som_dart_v0: tom_ai/ai_build/tom_som_dart_v0
  tom_specs_model: tom_ai/ai_build/tom_specs_model
  tom_specs_clitool: tom_ai/ai_build/tom_specs_clitool
  tom_code_specs: tom_ai/ai_build/tom_code_specs
  tom_core_codespecs: tom_ai/ai_build/tom_core_codespecs

# Non-Dart members: no Dart dependency graph, held to existence so a renamed
# or dropped directory fails the same gate.
source_only:
  - tom_ai/ai_build/tom_som_conformance
  - tom_ai/ai_build/tom_som_c_runtime
  - tom_ai/ai_build/tom_som_c_v0
  - tom_ai/ai_build/tom_som_cpp_runtime
  - tom_ai/ai_build/tom_som_cpp_v0
  - tom_ai/ai_build/tom_som_go_runtime
  - tom_ai/ai_build/tom_som_go_v0
  - tom_ai/ai_build/tom_som_java_runtime
  - tom_ai/ai_build/tom_som_java_v0
  - tom_ai/ai_build/tom_som_javascript_runtime
  - tom_ai/ai_build/tom_som_javascript_v0
  - tom_ai/ai_build/tom_som_python_runtime
  - tom_ai/ai_build/tom_som_python_v0
  - tom_ai/ai_build/tom_som_rust_runtime
  - tom_ai/ai_build/tom_som_rust_v0
  - tom_ai/ai_build/tom_som_typescript_runtime
  - tom_ai/ai_build/tom_som_typescript_v0

# Approved published crossings: workspace-authored, already on pub.dev,
# consumed hosted. The walk continues through their local pubspecs — approving
# the crossing must not approve whatever sits behind it.
allow:
  tom_analyzer_shared:
    path: tom_ai/basics/tom_analyzer_shared
    reason: >-
      Published to pub.dev; hosted dependency of tom_specs_clitool (the
      analyzer-summary infrastructure). A release consumer resolves the
      published closure.
  tom_build_base:
    path: tom_ai/basics/tom_build_base
    reason: >-
      Published to pub.dev; hosted dependency of tom_analyzer_shared. Its own
      dependencies are all third-party.

# Never reachable, allowlisted or not. Exact names, or `prefix*`.
forbid:
  - tom_spec_engine
  - tom_specs_editor
  - tom_specs_reviewer
  - tom_brain_*
  - tom_assistant*
  - tom_d4rt
  - tom_d4rt_generator

# Names with these prefixes are workspace-authored; any other dependency is
# third-party pub and permitted.
workspace_prefixes:
  - tom_

# ACKNOWLEDGED DRIFT — read by bin/check_release_drift.dart
# (lib/src/release_drift.dart).
#
# A release member whose tree has moved since the commit that set its current
# version has unpublished changes, and pub.dev says nothing about them. That is
# a legitimate cadence — a package is published when something needs it
# published — but it must be VISIBLE, and before this block the only way to see
# it was to diff by hand against a commit you had to know to pick. Measured
# 2026-09-08: `tom_specs_clitool` was 34,604 lines behind its published version
# and nothing reported it.
#
# So drift fails the gate unless it is acknowledged here, package -> reason.
# A hard failure on any drift would be red from the first edit after every
# publish, which is every working day, and a gate that is always red is a gate
# that gets switched off.
#
# EMPTY IS THE INTENDED STATE, and it is the state this block was created in:
# tsdocd8 published all nine members so that the published set is what the
# repository holds. An entry here is a deliberate exception with its reason,
# not a backlog.
# This manifest lives inside `tom_specs_clitool`, a release member, but it is
# `.pubignore`d: it records this workspace's releases, which a consumer of the
# tool has no use for. So writing an acknowledgement or a publish record here
# no longer drifts the package that holds it.
unpublished_drift:
  tom_som_dart_runtime: >-
    Since 1.9.0: spec_generation_units.dart (specGenerationUnits /
    specDefaultUnits, the document's generation-unit register) and the
    extract's default units — an entry with no stored units carries every
    unit whose mappings hold its area (tom_specs irspecs10). Additive; ships
    with the next release of the chain.
  tom_specs_clitool: >-
    Since 0.15.0: `irspecs map --spec <document> --unit <id>` writes one
    generation unit's package, and an IR file may carry `units`
    (irspecs_ir.md §8.1; tom_specs irspecs10); `irspecs emit`, the
    OpenAPI 3.1, JSON Schema 2020-12, ICU MessageFormat and AsyncAPI 3
    emitters (irspecs_ir.md §10; tom_specs irspecs11); the TypeScript
    mappers ts-shared, ts-react-client and ts-hono-server (irspecs_ir.md
    §11; tom_specs irspecs13). Needs the runtime's
    specGenerationUnits, so it ships with the next release of the chain.
  tom_core_codespecs: >-
    Documentation since 0.13.5: the authoring agent writes IR, not Dart
    (codespecs_derivation_contract.md §2.0, §2.9), the run procedure maps
    each generation unit (codespecs_mapping.md §1.1.1 item 4, §1.1.2),
    irspecs_ir.md §8.1 (tom_specs irspecs10). Ships with the next release.
  tom_specs_model: >-
    Documentation since 1.9.0: codespecs_prompt.md §1, §7, §8 (Stage C per
    generation unit, csgen todos name their IR), the SOM document's extract
    units and register reader, tom_specs_project_flow.md PF-PHA-P4
    (tom_specs irspecs10). Ships with the next release of the chain.

# Where each member was actually published from, when that is not the commit
# that set its version. A change that lands after the bump and before the
# publish ships with that version; without a record here the drift gate, which
# diffs from the bump, would call it unpublished for as long as the version
# stands. A record applies only while its version is the current one, so the
# next bump supersedes it without anyone having to delete it. Quote both values:
# a hash like 5e903509 is otherwise a YAML float, and is then ignored.
published_from:
  tom_specs_core: {version: '0.5.0', commit: '3b553290'}
  tom_som_dart_runtime: {version: '1.9.0', commit: '3b553290'}
  tom_specs_model: {version: '1.9.0', commit: '3b553290'}
  tom_som_dart_v0: {version: '1.9.0', commit: '3b553290'}
  tom_code_specs: {version: '0.14.2', commit: '47dba5ea'}
