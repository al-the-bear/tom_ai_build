[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tom_som_runtime"
version = "0.1.0"
description = "Python port of the generic TomSpecs object-model runtime (paths, model, reflection, document, validator, YAML/Markdown codecs)."
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools]
packages = ["tom_som_runtime"]
