# Schema Test - Comprehensive DocSpecs Schema v1.0
#
# This schema exercises ALL DocSpecs features for editor testing.
# Every feature is used at least once so the md editor can be tested
# against a single schema that covers the full feature surface.
#
# Features exercised:
#   - custom-tags (top-level arbitrary keys)
#   - [[generator;sep]] syntax
#   - [[placeholder]] syntax (without separator)
#   - prefix, max-count-in-document, max-subsection-levels
#   - subsection-types (max-count, min-count)
#   - pattern-check-id (pattern + error-message)
#   - pattern-check-text
#   - format (code block), format (form: -form suffix)
#   - text-required, min-text-length, max-text-length
#   - allowed-tags
#   - description
#   - validation-prompt (section-type level)
#   - required-fields
#   - form-types (fields, required, pattern-check)
#   - document.sections (section-type, access-key, optional)
#   - document.sections validation-prompt (section-level override)
#   - document.sections subsection-validation-prompt
#   - document.sections for-each
#   - top-level subsection declarations (position constraints)

# ============================================================================
# CUSTOM TAGS — arbitrary schema metadata accessible via customTags API
# ============================================================================

# Allowed priority levels — used in pattern validation + tag validation
priorities:
  - critical
  - high
  - medium
  - low

# Allowed environments for deployment targets
environments:
  - development
  - staging
  - production

# Status values for workflow tracking
statuses:
  - draft
  - review
  - approved
  - implemented

# Schema metadata — accessible as [[meta.author]], [[meta.version]]
meta:
  author: "Tom Framework"
  version: "1.0"
  purpose: "Comprehensive schema feature test"

# ============================================================================
# FORM TYPES — structured text formats referenced by format: <name>-form
# ============================================================================

form-types:

  # Feature: endpoint-form — exercises required/optional fields + pattern-check
  endpoint-form:
    fields:
      - fieldname: method
        required: true
        pattern-check:
          pattern: "^(GET|POST|PUT|DELETE|PATCH)$"
          error-message: "Method must be one of: GET, POST, PUT, DELETE, PATCH"
      - fieldname: path
        required: true
        pattern-check:
          pattern: "^/.*$"
          error-message: "Path must start with /"
      - fieldname: description
        required: true
      - fieldname: auth
        required: false
        pattern-check:
          pattern: "^(none|token|api-key|oauth2)$"
          error-message: "Auth must be one of: none, token, api-key, oauth2"

  # Feature: config-form — simple key-value config section
  config-form:
    fields:
      - fieldname: environment
        required: true
        pattern-check:
          pattern: "^([[environments;|]])$"
          error-message: "Environment must be one of: [[environments;, ]]"
      - fieldname: version
        required: true
      - fieldname: owner
        required: false

  # Feature: task-form — exercises all form field features
  task-form:
    fields:
      - fieldname: assignee
        required: true
      - fieldname: priority
        required: true
        pattern-check:
          pattern: "^([[priorities;|]])$"
          error-message: "Priority must be one of: [[priorities;, ]]"
      - fieldname: status
        required: true
        pattern-check:
          pattern: "^([[statuses;|]])$"
          error-message: "Status must be one of: [[statuses;, ]]"
      - fieldname: due-date
        required: false
        pattern-check:
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          error-message: "Due date must be YYYY-MM-DD format"

# ============================================================================
# SECTION TYPES — reusable definitions for section constraints and behavior
# ============================================================================

section-types:

  # --- Document-level sections ---

  overview:
    prefix: overview
    max-count-in-document: 1
    text-required: true
    min-text-length: 50
    max-text-length: 2000
    description: "Project overview with goals and scope — [[meta.purpose]]"
    # Feature: validation-prompt with ${...} placeholders
    validation-prompt: |
      Verify that the overview section ${id} provides:
      1. A clear project description (at least 50 chars)
      2. Stated goals or objectives
      3. Defined scope
      Current text length: ${text} chars at line ${lineNumber}.

  configuration:
    prefix: config
    max-count-in-document: 1
    format: config-form
    text-required: true
    description: "Project configuration settings"

  # --- Registry section for component definitions ---

  component-registry:
    prefix: components
    max-count-in-document: 1
    description: "Registry of all components — lists [[meta.version]] components"
    subsection-types:
      component-definition:
        min-count: 1
        max-count: infinite

  component-definition:
    prefix: comp
    max-subsection-levels: 0
    text-required: true
    min-text-length: 10
    # Feature: required-fields — these must appear in headline comment OR form text
    required-fields:
      - component-id
      - targets
    # Feature: pattern-check-id with generator syntax
    pattern-check-id:
      pattern: "^comp-[a-z][a-z0-9-]*$"
      error-message: "Component IDs must be comp-<lowercase-name> (e.g., comp-auth, comp-api)"
    description: "Individual component entry declaring its ID and target platforms"

  # --- Component detail sections ---

  component-detail:
    prefix: detail
    description: "Detailed specification for a single component"
    required-fields:
      - component-id
    subsection-types:
      api-section:
        max-count: 1
      data-model:
        max-count: 1
      implementation-notes:
        max-count: 1
      task-container:
        max-count: 1

  api-section:
    prefix: api
    description: "API endpoints for this component"
    subsection-types:
      endpoint:
        min-count: 1
        max-count: infinite

  endpoint:
    prefix: endpoint
    format: endpoint-form
    text-required: true
    # Feature: pattern-check-text — validates the actual text content
    pattern-check-text:
      pattern: "Description:"
      error-message: "Endpoint text must include a Description: field"
    description: "Single API endpoint definition with method, path, description"

  data-model:
    prefix: model
    max-subsection-levels: 1
    text-required: true
    min-text-length: 20
    description: "Data structures and type definitions"
    subsection-types:
      code-sample:
        max-count: infinite

  code-sample:
    prefix: code
    # Feature: format with multiple code block languages
    format: dart|typescript|python|sql
    text-required: true
    max-subsection-levels: 0
    description: "Code sample in a supported language"

  implementation-notes:
    prefix: impl
    text-required: true
    min-text-length: 20
    max-text-length: 5000
    description: "Implementation guidance, constraints, and technical decisions"

  # --- Task tracking ---

  task-container:
    prefix: tasks
    description: "Task tracking for this component"
    subsection-types:
      task:
        max-count: infinite

  task:
    prefix: task
    format: task-form
    text-required: true
    # Feature: pattern-check-id with pattern
    pattern-check-id:
      pattern: "^TASK-[0-9]{3}$"
      error-message: "Task IDs must be TASK-001, TASK-002, etc."
    # Feature: allowed-tags — whitelist of valid tags
    allowed-tags:
      - critical
      - high
      - medium
      - low
    description: "Individual task linked to a component"

  # --- Requirements ---

  requirements-section:
    prefix: requirements
    max-count-in-document: 1
    description: "All requirements for the project"
    subsection-types:
      requirement:
        min-count: 1
        max-count: infinite

  requirement:
    prefix: req
    text-required: true
    min-text-length: 15
    pattern-check-id:
      pattern: "^REQ-[0-9]{3}$"
      error-message: "Requirement IDs must be REQ-001, REQ-002, etc."
    allowed-tags:
      - critical
      - high
      - medium
      - low
    description: "A single functional or non-functional requirement"
    # Feature: validation-prompt with parent access
    validation-prompt: |
      Verify requirement ${id} tagged [${tags}]:
      - Has clear, testable acceptance criteria
      - Text: ${text}
      Parent section: ${parent.id}

  # --- Appendix ---

  appendix:
    prefix: appendix
    description: "Supplementary reference material"
    max-subsection-levels: 2

  # --- Glossary ---

  glossary:
    prefix: glossary
    max-count-in-document: 1
    description: "Glossary of terms used in this document"
    subsection-types:
      glossary-term:
        max-count: infinite

  glossary-term:
    prefix: term
    max-subsection-levels: 0
    text-required: true
    min-text-length: 5
    max-text-length: 500
    description: "Definition of a single term"

# ============================================================================
# DOCUMENT STRUCTURE — expected top-level sections in order
# ============================================================================

document:
  sections:

    overview:
      section-type: overview
      # Feature: document-level validation-prompt overrides type's prompt
      validation-prompt: |
        This is the document overview. Verify ${id} contains:
        - Project name and purpose
        - Target audience
        - Document scope
        Text: ${text}

    configuration:
      section-type: configuration
      optional: true
      # Feature: access-key — accessed as spec['config'] instead of spec['configuration']
      access-key: config

    component-registry:
      section-type: component-registry

    components:
      section-type: component-detail
      # Feature: for-each — one subsection per registry entry
      for-each:
        section-type: component-definition
        key: component-id
      # Feature: subsection-validation-prompt — validates all children
      subsection-validation-prompt: |
        Verify component detail section ${id} is complete:
        - Has API documentation
        - Has data model description
        - References component-id: ${fields.component-id}
        Parent: ${parent.id}

    requirements:
      section-type: requirements-section

    glossary:
      section-type: glossary
      optional: true

    appendix:
      section-type: appendix
      optional: true

# ============================================================================
# SUBSECTION DECLARATIONS — position constraints for component details
# ============================================================================

# Feature: top-level subsection declarations with position constraints
components:
  api:
    section-type: api-section
    position: first
  data-model:
    section-type: data-model
    position: any
  tasks:
    section-type: task-container
    position: any
  implementation:
    section-type: implementation-notes
    required: true
    position: last
