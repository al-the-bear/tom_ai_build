name: tom_spec_engine
description: >-
  TomSpecs scripting/engine plane — the pure-Dart host behind the editor's D4rt
  scripting & LLM tooling: the D4rt scope registry, the restricted dcli file
  facade, the structural/lexical search index, and the Tom-Brain-backed RAG
  memory + agent substrate. Linked in-process by the TomSpecs editor; usable
  headless (CLI/tests). See
  tom_ai/ai_build/tom_specs_model/doc/llm_and_d4rt_tools.md.
version: 0.0.1
# Internal engine consumed by path from the editor; depends by path on
# unpublished sibling SOM packages. Never published to pub.dev.
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  # The sandboxed D4rt interpreter the scope host runs scripts on. Pinned to the
  # latest published line (^1.10.1) — it carries the analyzer ^10 migration, so
  # there is no longer an analyzer ^8/^10 conflict with the Flutter editor's
  # tom_dart_editor. (The plan/Q4's earlier `^1.8.25` note is superseded — see
  # tom_specs_model/doc/llm_and_d4rt_tools.md §14.)
  tom_d4rt: ">=1.11.0"
  # dcli bridged into D4rt — the raw surface the `files` scope facade (§7)
  # wraps. Pinned to the latest published line (^1.1.6 — F4).
  tom_d4rt_dcli: ">=1.1.6"
  # The generic SOM runtime — the document memory representation + reflection +
  # validator the `spec` scope (§5) exposes to D4rt. publish_to: none →
  # consumed by path per the workspace convention for unpublished siblings.
  tom_som_dart_runtime:
    path: ../tom_som_dart_runtime
  # The generated typed editing facade over the runtime; the ergonomic layer of
  # the `spec` scope. publish_to: none → path dependency.
  tom_som_dart_v0:
    path: ../tom_som_dart_v0
  # Tom Brain memory plane (§9). The in-process, profile-isolated property
  # graph the RAG memory (§9.1 / §9.2) is built on: SqliteTomBrainMemory +
  # SqliteMemoryProfileRegistry + the bundled sqlite-vec (vec0) vector index.
  # Adopted here behind a thin engine-side facade. publish_to: none → path
  # (lives in the sibling tom_assistant repo).
  tom_brain_memory:
    path: ../../../tom_assistant/tom_brain_memory
  # The wire-capable contracts (MemoryConfig, NodeDraft, Scope, Vec, recall
  # query/result types, MemoryProfileRegistry) the facade speaks in.
  tom_brain_shared:
    path: ../../../tom_assistant/tom_brain_shared
  # The LLM/embedding-provider plane (§9.3). Ends the D7 deferral:
  # tier-2 RAG now embeds through the real provider-backed `EmbeddingService`
  # (OllamaEmbeddingService, nomic-embed-text, 768 dims, L2-normalised) instead
  # of the editor's deterministic hash placeholder. `SpecProviderEmbedder`
  # (lib/src/memory/provider_embedder.dart) wraps it so the editor needs only
  # tom_spec_engine. publish_to: none → path (see
  # tom_specs_model/doc/llm_and_d4rt_tools.md §9.3).
  tom_brain_substrate:
    path: ../../../tom_assistant/tom_brain_substrate

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  # Test/tool-only. `tool/som_surface.dart` fingerprints the public API surface
  # of the two SOM packages the bridges are generated from, so
  # `test/som_bridge_freshness_test.dart` can fail when that surface has moved
  # and the bridges have not been regenerated (see
  # _copilot_guidelines/bridge_regeneration.md § "How staleness is caught").
  # The parse is SYNTACTIC only — no resolution, no dependency graph — which is
  # what keeps a ~10 MB scan to about a second.
  analyzer: ">=8.0.0 <11.0.0"
  crypto: ^3.0.0
  # The D4rt bridge generator that produces the SOM `*.b.dart` binding surface
  # from the `d4rtgen:` block in buildkit.yaml. Used only by
  # tool/regenerate_bridges.dart — see _copilot_guidelines/bridge_regeneration.md.
  #
  # Consumed by PATH (not from pub.dev) on purpose. The engine's SOM inputs
  # (tom_som_dart_v0 / tom_som_dart_runtime) are unpublished path siblings under
  # active development, so a generator bug that only surfaces against the current
  # SOM source (e.g. the $-prefixed `$sectionId` escaping fix) has to be iterated
  # *and consumed* locally. As a hosted dev-dep that meant publish → bump → `pub
  # upgrade` for every iteration, and `pub upgrade` updates pubspec.lock without
  # refreshing .dart_tool/package_config.json — so `dart run` kept resolving the
  # OLD generator and regenerated stale bridges. A path dep removes the version
  # indirection entirely: the regenerator always runs the current generator
  # source, so the SOM bridges can never go stale against a not-yet-published
  # generator. Safe because this is a build-only DEV dependency and the engine is
  # itself `publish_to: none` (already all-path). The workspace "no path deps"
  # rule targets runtime missing-API errors on published artifacts — neither
  # applies here.
  tom_d4rt_generator:
    path: ../../d4rt/tom_d4rt_generator

# Local-development source unification for the co-developed SOM siblings.
# tom_som_dart_v0 declares its runtime dependency as hosted (`^1.0.0`) for
# publishing, but here it must resolve to the SAME path checkout that the engine
# depends on directly — otherwise pub sees tom_som_dart_runtime from two sources
# (path vs hosted) and version solving fails. This mirrors the tracked
# pubspec_overrides.yaml the SOM packages themselves carry. It is a build-time
# source override for unpublished path siblings (the engine is publish_to:none),
# NOT a workaround for a missing-API error on a published artifact.
dependency_overrides:
  tom_som_dart_runtime:
    path: ../tom_som_dart_runtime
