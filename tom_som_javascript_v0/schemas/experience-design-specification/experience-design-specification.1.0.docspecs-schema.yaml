form-types:
  erhaco-erro-form:
    fields:
      - fieldname: errorPhilosophy
        description: "Prevention-first, graceful degradation, user empowerment"
      - fieldname: errorToneOfVoice
        description: "Friendly, professional, apologetic, neutral"
      - fieldname: errorLanguageStyle
        description: "Plain language, technical, user-focused"
      - fieldname: blameAvoidance
        description: "Never blame user, focus on solutions"
  vafe-vali-form:
    fields:
      - fieldname: validationTiming
        description: "Real-time, on-blur, on-submit, debounced"
      - fieldname: debounceDelay
        description: Milliseconds before validation triggers
      - fieldname: validationSequence
        description: "Field-by-field, all-at-once, progressive"
  syerdi-syst-form:
    fields:
      - fieldname: networkErrorHandling
        description: How connectivity issues are displayed
      - fieldname: systemErrorDisplayMethod
        description: "Modal, snackbar, banner, full-page"
      - fieldname: gracefulDegradation
        description: How features degrade on partial failure
  erre-reco-form:
    fields:
      - fieldname: formDataPreservation
        description: How unsaved form data is preserved on error
      - fieldname: sessionRecovery
        description: How expired sessions are handled
      - fieldname: supportContactMethod
        description: "Chat, email, phone, ticket"
  usas-help-form:
    fields:
      - fieldname: helpPhilosophy
        description: "Self-service first, guided, on-demand"
      - fieldname: helpAccessibility
        description: "Always visible, contextual, searchable"
      - fieldname: helpPersonalization
        description: "Role-based, skill-based, contextual"
      - fieldname: helpContentStrategy
        description: "Video, text, interactive, mixed"
  cohe-cont-form:
    fields:
      - fieldname: tooltipTrigger
        description: "Hover, click, focus, icon click"
      - fieldname: tooltipDelay
        description: Milliseconds before showing
      - fieldname: tooltipDuration
        description: How long tooltip stays visible
      - fieldname: tooltipMaxWidth
        description: Maximum width in pixels
      - fieldname: tooltipPosition
        description: "Above, below, auto-position"
  onhe-onbo-form:
    fields:
      - fieldname: welcomeFlowEnabled
        description: Whether the welcome flow is enabled
      - fieldname: welcomeFlowStyle
        description: "Modal wizard, full-page, inline"
      - fieldname: welcomeFlowSkippable
        description: Whether users can skip the welcome flow
      - fieldname: welcomeFlowDuration
        description: Expected completion time
  suac-supp-form:
    fields:
      - fieldname: helpCenterAvailable
        description: Whether a help centre is provided
      - fieldname: liveChatAvailable
        description: Whether live chat support is provided
      - fieldname: ticketSubmission
        description: Whether users can submit support tickets
  access-acce-form:
    fields:
      - fieldname: wcagComplianceTarget
        description: "A, AA, AAA"
      - fieldname: wcagVersion
        description: "2.0, 2.1, 2.2"
      - fieldname: additionalStandards
        description: "Section 508, EN 301 549, ADA"
      - fieldname: accessibilityStatement
        description: Publish accessibility statement
  wcco-wcag-form:
    fields:
      - fieldname: textAlternatives
        description: Alt text for non-text content
      - fieldname: timeBasedMedia
        description: "Captions, audio descriptions"
      - fieldname: adaptableContent
        description: "Structure, sequence, sensory"
      - fieldname: distinguishableContent
        description: "Color, contrast, resize, audio"
  acchls-chec-form:
    fields:
      - fieldname: checklistStandard
        description: "Based on WCAG, custom additions"
      - fieldname: checklistOwner
        description: Who maintains the checklist
      - fieldname: checkFrequency
        description: "Per feature, per release, continuous"
      - fieldname: automatedChecks
        description: Automated accessibility testing coverage
      - fieldname: manualChecks
        description: Manual testing procedures
      - fieldname: userTesting
        description: Testing with users with disabilities
      - fieldname: reportingFormat
        description: How accessibility status is reported
      - fieldname: remediationProcess
        description: How issues are fixed
  rede-resp-form:
    fields:
      - fieldname: responsivePhilosophy
        description: "Mobile-first, desktop-first, adaptive"
      - fieldname: primaryTargetDevice
        description: "Mobile phone, tablet, desktop"
      - fieldname: deviceAssumptions
        description: Assumptions about target devices
      - fieldname: responsiveFramework
        description: "LayoutBuilder, MediaQuery, responsive_framework"
      - fieldname: breakpointPackage
