# Specification Document Schema
# Based on _copilot_guidelines/spec_writing_guide.md

section-types:
  overview:
    prefix: overview
    max-count-in-document: 1
    text-required: true
    min-text-length: 50
    description: "Brief description of what the component does and why it exists"
    
  terminology:
    prefix: terminology
    max-count-in-document: 1
    description: "Domain terms and their definitions"
    subsection-types:
      term:
        max-count: infinite
        
  term:
    prefix: term
    max-subsection-levels: 0
    text-required: true
    description: "Single term definition"
    
  data-structure:
    prefix: data
    description: "Type definitions, schemas, field definitions"
    subsection-types:
      field-reference:
        max-count: 1
      example:
        max-count: infinite
        
  field-reference:
    prefix: field
    max-subsection-levels: 0
    description: "Table of fields with type, required, default, description"
    
  processing-flow:
    prefix: flow
    description: "Step-by-step operations"
    subsection-types:
      step:
        max-count: infinite
        min-count: 1
        
  step:
    prefix: step
    text-required: true
    description: "Single processing step with input, output, process"
    
  error-handling:
    prefix: error
    max-count-in-document: 1
    description: "Error conditions, detection, and responses"
    
  example:
    prefix: example
    text-required: true
    description: "Complete working sample"
    
  edge-case:
    prefix: edge
    text-required: true
    description: "Boundary condition documentation"
    
  test-scenario:
    prefix: test
    text-required: true
    description: "Verification data and expected outcomes"
    
  dependency:
    prefix: dep
    description: "External dependencies that must exist first"
    
  contents:
    prefix: contents
    max-count-in-document: 1
    description: "Table of contents with anchor links"
    
  api-reference:
    prefix: api
    description: "API documentation section"
    subsection-types:
      api-class:
        max-count: infinite
      api-function:
        max-count: infinite
        
  api-class:
    prefix: apiclass
    description: "Class or interface documentation"
    
  api-function:
    prefix: apifunc
    max-subsection-levels: 0
    description: "Function or method documentation"

document:
  sections:
    title:
      section-type: overview
      access-key: title
    contents:
      section-type: contents
      optional: true
    overview:
      section-type: overview
    terminology:
      section-type: terminology
      optional: true
    data-structures:
      section-type: data-structure
      access-key: dataStructures
    processing-flow:
      section-type: processing-flow
      access-key: processingFlow
    error-handling:
      section-type: error-handling
      access-key: errorHandling
    examples:
      section-type: example
      optional: true
    edge-cases:
      section-type: edge-case
      access-key: edgeCases
      optional: true
    test-scenarios:
      section-type: test-scenario
      access-key: testScenarios
      optional: true
    api-reference:
      section-type: api-reference
      access-key: apiReference
      optional: true
    dependencies:
      section-type: dependency
      optional: true
