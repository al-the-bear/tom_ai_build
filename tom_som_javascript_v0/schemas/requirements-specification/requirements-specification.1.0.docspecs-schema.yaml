form-types:
  fr-summ-form:
    fields:
      - fieldname: totalFunctionalRequirements
        description: Total count of functional requirements
      - fieldname: mustHaveFunctional
        description: Count of Must-Have functional requirements
      - fieldname: shouldHaveFunctional
        description: Count of Should-Have functional requirements
      - fieldname: couldHaveFunctional
        description: Count of Could-Have functional requirements
      - fieldname: wontHaveThisTimeFunctional
        description: Count of Won't-Have-This-Time functional requirements
      - fieldname: coverageNote
        description: Notes on coverage and any gaps in the requirement set
  rus-uifo-form:
    fields:
      - fieldname: screenName
        description: Name of the screen or view
      - fieldname: screenType
        description: "List, Detail, Form, Dashboard, Dialog, or Wizard"
      - fieldname: navigationPath
        description: How the user navigates to reach this screen
      - fieldname: userRoles
        description: Roles allowed to access this screen
      - fieldname: responsiveBreakpoints
        description: "Responsive breakpoints: mobile, tablet, desktop"
  rt-trac-form:
    fields:
      - fieldname: relatedGoals
        description: IDs of related business goals
      - fieldname: relatedUseCases
        description: IDs of related use cases
      - fieldname: relatedProcesses
        description: IDs of related business processes
      - fieldname: relatedUserStories
        description: "Related user stories, if using Agile"
  tr1-summ-form:
    fields:
      - fieldname: totalTechnicalRequirements
        description: Total count of technical requirements captured
      - fieldname: criticalCount
        description: Number of requirements at Critical priority
      - fieldname: highCount
        description: Number of requirements at High priority
      - fieldname: mediumCount
        description: Number of requirements at Medium priority
      - fieldname: lowCount
        description: Number of requirements at Low priority
      - fieldname: architectureDrivers
        description: "e.g., 99.99% availability, sub-100ms latency, 10k concurrent users"
  sr1-summ-form:
    fields:
      - fieldname: totalSecurityRequirements
        description: Total count of security requirements captured
      - fieldname: criticalCount
        description: Number of requirements at Critical priority
      - fieldname: highCount
        description: Number of requirements at High priority
      - fieldname: mediumCount
        description: Number of requirements at Medium priority
      - fieldname: securityFramework
        description: Primary framework guiding the requirements
      - fieldname: complianceRequirements
        description: Regulations the system must comply with
      - fieldname: threatCategories
        description: Classes of attack the requirements mitigate
  or-summ-form:
    fields:
      - fieldname: totalOrgRequirements
        description: Total count of organizational requirements captured
      - fieldname: trainingRequirements
        description: Number of training-related requirements
      - fieldname: processChangeRequirements
        description: Number of process-change requirements
      - fieldname: roleChangeRequirements
        description: Number of role-change requirements
      - fieldname: supportRequirements
        description: Number of support-structure requirements
      - fieldname: communicationRequirements
        description: Number of communication requirements
      - fieldname: changeReadinessScore
        description: Assessed readiness of the organization to adopt the change
  orip-plan-form:
    fields:
      - fieldname: approach
        description: "Big Bang, Phased, Pilot, or Parallel rollout"
      - fieldname: phases
        description: "Sequence of phases, if phased"
      - fieldname: pilotGroup
        description: "Group used for the pilot, if piloting"
      - fieldname: trainingApproach
        description: How affected people are trained
      - fieldname: communicationPlan
        description: How the change is communicated to stakeholders
      - fieldname: supportPlan
        description: Support provided during and after the change
      - fieldname: rollbackPlan
        description: How to revert if the change fails
      - fieldname: resourcesNeeded
        description: "People, tools, or budget required"
      - fieldname: budget
        description: Estimated cost of the implementation
      - fieldname: timeline
        description: Schedule for the implementation
