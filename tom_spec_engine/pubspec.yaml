name: tom_spec_engine
description: >-
  TomSpecs scripting/engine plane — the pure-Dart host behind the editor's D4rt
  scripting & LLM tooling: the D4rt scope registry, the restricted dcli file
  facade, the structural/lexical search index, and the Tom-Brain-backed RAG
  memory + agent substrate. Linked in-process by the TomSpecs editor; usable
  headless (CLI/tests). See _ai/quests/tom_specs/d4rt_and_llm_tools.md.
version: 0.0.1
# Internal engine consumed by path from the editor; depends by path on
# unpublished sibling SOM packages. Never published to pub.dev.
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  # The sandboxed D4rt interpreter the scope host runs scripts on. Pinned to the
  # current published line (^1.10.1) — it carries the analyzer ^10 migration, so
  # there is no longer an analyzer ^8/^10 conflict with the Flutter editor's
  # tom_dart_editor. (The plan's earlier `1.8.25` note is superseded — see
  # d4rt_and_llm_tools_decisions.md D1.)
  tom_d4rt: ^1.10.1
  # dcli bridged into D4rt — the raw surface the `files` scope facade (step 8)
  # wraps. Hosted ^1.1.3 (the workspace pin the Tom Brain packages also use).
  tom_d4rt_dcli: ^1.1.3
  # The generic SOM runtime — the document memory representation + reflection +
  # validator the `spec` scope (step 7) exposes to D4rt. publish_to: none →
  # consumed by path per the workspace convention for unpublished siblings.
  tom_som_dart_runtime:
    path: ../tom_som_dart_runtime
  # The generated typed editing facade over the runtime; the ergonomic layer of
  # the `spec` scope. publish_to: none → path dependency.
  tom_som_dart_v0:
    path: ../tom_som_dart_v0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
