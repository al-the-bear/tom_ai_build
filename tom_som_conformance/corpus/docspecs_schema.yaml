title-format: "# <!--[D00]--> Demo Document"
section-types:
  goal-item:
    prefix: GOAL_ITEM_
    pattern-check-id:
      pattern: "^GOAL-ITEM-[0-9]+$"
      error-message: IDs of this section must match GOAL-ITEM-xxx
  d00-ovr:
    prefix: D00_OVR
    text-required: true
  d00-hdr:
    prefix: D00_HDR
    format: header-form
  gsum:
    prefix: GSUM
    max-text-length: 20
  diag:
    prefix: DIAG
    format: mermaid
  step:
    prefix: STEP_
  steps:
    prefix: STEPS
    subsection-types:
      step:
        min-count: 2
        max-count: infinite
  goals:
    prefix: GOALS
    subsection-types:
      goal-item:
        min-count: 1
        max-count: infinite
      gsum:
        max-count: 1
  refs-lst:
    prefix: REFS_LST
    max-text-length: 0
    subsection-types:
      ref-item:
        min-count: 2
        max-count: infinite
  ref-item:
    prefix: REFS_
    pattern-check-id:
      pattern: "^REFS-[0-9]+$"
    format: ref-form
  link-lst:
    prefix: LINK_LST
    max-text-length: 0
    subsection-types:
      link-item:
        min-count: 1
        max-count: infinite
  link-ref:
    prefix: LINK_REF
    format: ref-form
  link-item:
    prefix: LINK_
    subsection-types:
      link-ref:
        min-count: 1
        max-count: 1
  crit-lst:
    prefix: CRIT_LST
    max-text-length: 0
    subsection-types:
      crit-item:
        min-count: 2
        max-count: 3
  crit-item:
    prefix: CRIT_
    pattern-check-id:
      pattern: "^CRIT-[0-9]+$"
    format: crit-form
  attr:
    prefix: ATTR
    subsection-types:
      iden:
        min-count: 1
        max-count: 1
      cons-lst:
        max-count: 1
  iden:
    prefix: IDEN
    format: iden-form
  cons-lst:
    prefix: CONS_LST
    subsection-types:
      cons-item:
        min-count: 1
        max-count: infinite
  cons-item:
    prefix: CONS_
    format: cons-form
  note:
    prefix: NOTE
    subsection-types:
      gsum:
        max-count: 1
form-types:
  ref-form:
    fields:
      - fieldname: Target
        required: true
        pattern-check:
          pattern: "^[A-Z]"
  crit-form:
    fields:
      - fieldname: Given
        required: true
      - fieldname: When
      - fieldname: Then
        pattern-check:
          pattern: "^[a-z]"
  iden-form:
    fields:
      - fieldname: ColumnName
        required: true
      - fieldname: Description
  cons-form:
    fields:
      - fieldname: Mandatory
        required: true
        pattern-check:
          pattern: "^(Yes|No)$"
  header-form:
    fields:
      - fieldname: author
        required: true
      - fieldname: reviewer
        pattern-check:
          pattern: "^[A-Z]"
          error-message: Reviewer must start with an uppercase letter
document:
  sections:
    d00-ovr:
      section-type: d00-ovr
    d00-hdr:
      section-type: d00-hdr
      optional: true
    goals:
      section-type: goals
      optional: true
    steps:
      section-type: steps
      optional: true
    diag:
      section-type: diag
      optional: true
    refs-lst:
      section-type: refs-lst
      optional: true
    link-lst:
      section-type: link-lst
      optional: true
    crit-lst:
      section-type: crit-lst
      optional: true
    attr:
      section-type: attr
      optional: true
    note:
      section-type: note
      optional: true
      position: any
