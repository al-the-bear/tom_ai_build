# Sample instantiation-coverage manifest (SOM §19).
#
# The remaining set: every model structure reachable from the
# D00SolutionBlueprint root that no sample under samples/ yet
# instantiates. Held against reality by
# tool/check_sample_coverage.dart — an uncovered id missing here,
# an entry that became covered, or an entry the model no longer
# reaches all fail the gate. Coverage only ratchets forward:
# growing the samples deletes lines here, and an empty manifest
# is full coverage.
#
# Regenerate deliberately with:
#   dart tool/check_sample_coverage.dart --write-manifest
# and review the diff: added lines are newly recorded gaps,
# removed lines are coverage gained.
