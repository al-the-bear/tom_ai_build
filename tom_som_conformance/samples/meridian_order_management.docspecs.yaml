                        sectionType: |2-
                          DataTable
                      SSEL layout:
                        layoutDirection: |2-
                          Vertical
                        displayOrder: 2
                      SCREL-ELEM-LST elements:
                        SCREL-ELEM-1:
                          headline: |2-
                            Order ID column
                          content:
