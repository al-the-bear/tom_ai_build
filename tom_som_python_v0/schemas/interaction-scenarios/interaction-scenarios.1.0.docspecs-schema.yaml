form-types:
  acovna-form:
    fields:
      - fieldname: totalActorCount
        description: Enter the total number of actors
      - fieldname: humanActorCount
        description: Enter how many actors are human users
      - fieldname: systemActorCount
        description: Enter how many actors are internal systems
      - fieldname: externalActorCount
        description: Enter how many actors are external systems
      - fieldname: actorIdentificationApproach
        description: Describe the method used to discover actors
      - fieldname: actorPrioritization
        description: State which actors matter most and why
      - fieldname: actorGoalAlignment
        description: Explain how actor goals map to business goals
  acid-form:
    fields:
      - fieldname: actorType
        description: "State whether the actor is a person, system or scheduled job"
      - fieldname: category
        description: Classify using Cockburn primary/secondary/supporting/offstage
      - fieldname: description
        description: Explain the actor’s purpose in one or two sentences
      - fieldname: realWorldExamples
        description: Name concrete job titles or people that fill this role
      - fieldname: organizationalUnit
        description: Identify the department or team the actor belongs to
      - fieldname: estimatedCount
        description: Estimate the number of individuals in this role
      - fieldname: geographicDistribution
        description: Note the locations or regions where actors operate
  acchus-form:
    fields:
      - fieldname: usageDuration
        description: Estimate the length of a typical working session
      - fieldname: peakUsageTimes
        description: Note the times of day or periods of heaviest use
      - fieldname: taskComplexity
        description: Characterise the complexity of the actor’s tasks
      - fieldname: decisionAuthority
        description: State the decisions the actor is authorised to make
  acchsu-form:
    fields:
      - fieldname: supervisionLevel
        description: State how closely the actor’s work is supervised
      - fieldname: communicationPreference
        description: Note preferred channels for reaching the actor
      - fieldname: languageRequirements
        description: List the languages the actor needs supported
      - fieldname: accessibilityNeeds
        description: Describe any accessibility accommodations required
  actepr-form:
    fields:
      - fieldname: primaryAccessChannel
        description: Name the main channel the actor uses to access the system
      - fieldname: secondaryAccessChannels
        description: List alternative channels the actor may use
      - fieldname: deviceTypes
        description: List the device types the actor uses
      - fieldname: operatingSystems
        description: List the operating systems the actor runs
      - fieldname: browserRequirements
        description: Note the browsers that must be supported
      - fieldname: networkConnectivity
        description: Describe the actor’s typical network connectivity
      - fieldname: bandwidthExpectations
        description: State the bandwidth the actor typically has available
      - fieldname: integratedTools
        description: List other tools the actor integrates with
      - fieldname: authenticationMethod
        description: State how the actor authenticates to the system
  acinsu-form:
    fields:
      - fieldname: primaryInteractions
        description: List the main use cases the actor initiates or drives
      - fieldname: secondaryInteractions
        description: List supporting use cases the actor takes part in
      - fieldname: interactionFrequency
        description: State how often each interaction type occurs
      - fieldname: criticalInteractions
        description: Highlight the actor’s most important interactions
      - fieldname: complexInteractions
        description: Note the actor’s most challenging interactions
      - fieldname: collaborativeInteractions
        description: List interactions that involve other actors
      - fieldname: handoffPoints
        description: Identify points where work is handed off to others
  accasu-form:
    fields:
      - fieldname: primaryActors
        description: List the actors that initiate interactions
      - fieldname: secondaryActors
        description: List the actors that support primary actors
      - fieldname: offstageActors
        description: List stakeholders with interests but no direct interaction
      - fieldname: systemActors
        description: List external systems acting as actors
      - fieldname: timerActors
        description: List time-triggered or scheduled actors
  incaov-form:
    fields:
      - fieldname: totalInteractionCount
        description: Count of all documented interactions
      - fieldname: highPriorityCount
        description: Number of must-have interactions
      - fieldname: mediumPriorityCount
        description: Number of should-have interactions
      - fieldname: lowPriorityCount
        description: Number of could-have interactions
      - fieldname: coverageStatement
        description: State which processes and goals the catalog covers
      - fieldname: identificationMethod
        description: "e.g. actor-goal analysis, event storming, process decomposition"
      - fieldname: prioritizationCriteria
        description: "e.g. MoSCoW, business value vs. effort"
      - fieldname: traceabilityToProcesses
        description: Reference the TOM-xxx process each interaction realizes
  inid-form:
    fields:
      - fieldname: useCaseName
        required: true
        description: "Active-verb goal, e.g. \"Place order\""
      - fieldname: processReference
        description: The TOM-xxx process this use case realizes
      - fieldname: briefDescription
        description: One-sentence summary of the goal
      - fieldname: fullDescription
        description: Fuller narrative of what the interaction achieves
      - fieldname: primaryActor
        description: The actor with the goal who starts the interaction
      - fieldname: supportingActors
        description: Other actors or systems that contribute
      - fieldname: goalLevel
        description: "Cockburn level: + summary, ! user goal, - subfunction"
      - fieldname: designScope
        description: "Boundary in view: organization, system, subsystem, component"
  ucsc-form:
    fields:
      - fieldname: systemUnderDiscussion
        description: Name the system whose behavior is being described
      - fieldname: systemBoundary
        description: State what falls inside vs. outside the system
      - fieldname: level
        description: "Cockburn altitude: sea (user goal), fish (subfunction)"
      - fieldname: context
        description: Business situation in which this use case occurs
      - fieldname: assumption
        description: Facts assumed true but not verified in the flow
      - fieldname: dependency
        description: External systems or use cases this relies on
      - fieldname: constraint
        description: Limitations bounding how the use case may work
      - fieldname: relatedUseCases
        description: Use cases this one includes or extends
  exten-resu-form:
    fields:
      - fieldname: resumeStep
        required: true
        description: "The main-scenario step control resumes at, as that step's section id (MNSST-STEP-…). That step and everything after it run again from here."
  inpe-form:
    fields:
      - fieldname: expectedFrequency
        description: "How often the interaction runs, e.g. per day"
      - fieldname: peakVolume
        description: Maximum concurrent load expected
      - fieldname: responseTimeTarget
        description: Maximum acceptable response time
      - fieldname: throughputTarget
        description: Required transactions per second
      - fieldname: availabilityRequirement
        description: "Required uptime, e.g. 99.9%"
      - fieldname: concurrencyExpectation
        description: Expected number of simultaneous users
      - fieldname: dataVolumeHandled
        description: Typical data size processed per run
  inse-form:
    fields:
      - fieldname: authenticationRequired
        description: Whether and how the actor must authenticate
      - fieldname: authorizationRules
        description: Which roles are permitted to perform this
      - fieldname: dataClassification
        description: Sensitivity level of the data handled
      - fieldname: encryptionRequirements
        description: Encryption needed in transit and at rest
      - fieldname: auditLogging
        description: Security-relevant events to log
      - fieldname: sessionRequirements
        description: Session timeout and renewal rules
      - fieldname: complianceRequirements
        description: "Regulations to satisfy, e.g. GDPR, HIPAA"
  intr-form:
    fields:
      - fieldname: relatedProcess
        description: TOM-xxx process this interaction realizes
      - fieldname: relatedRequirements
        description: "Requirement ids satisfied here, comma-separated — each is a requirement section id (FRE-REQU-… / TERQ-REQU-… / SECRQ-REQU-… / ORRQ-REQU-…)"
      - fieldname: relatedUseCase
        description: ISC-xxx use case in the ISC document
      - fieldname: relatedDataEntities
        description: Data entities read or written
      - fieldname: relatedBusinessObjects
        description: BO-xxx business objects involved
      - fieldname: relatedBusinessRules
        description: BR-xxx business rules referenced
      - fieldname: relatedIntegrations
        description: INT-xxx integrations touched
      - fieldname: relatedTestCases
        description: TC-xxx test cases covering this
  inpr-form:
    fields:
      - fieldname: mustHaveInteractions
        description: List interactions the MVP cannot ship without
      - fieldname: shouldHaveInteractions
        description: Important but can slip to a later release
      - fieldname: couldHaveInteractions
        description: Desirable if capacity allows
      - fieldname: wontHaveInteractions
        description: Explicitly out of scope for this effort
      - fieldname: phaseOneInteractions
        description: Interactions targeted for the first delivery phase
      - fieldname: phaseTwoInteractions
        description: Interactions targeted for the second delivery phase
      - fieldname: futureInteractions
        description: Interactions deferred to an unscheduled future phase
  scov-form:
    fields:
      - fieldname: totalScenarioCount
        description: Number of scenarios documented
      - fieldname: scenarioCoverage
        description: Which end-to-end journeys the scenarios span
      - fieldname: scenarioTypes
        description: "Mix of happy-path, error, and edge-case scenarios"
      - fieldname: scenarioPrioritization
        description: How scenarios are ranked by importance
      - fieldname: scenarioToTestMapping
        description: How each scenario traces to TC-xxx test cases
  scid-form:
    fields:
      - fieldname: scenarioType
        description: "One of happy path, alternative, or exception"
      - fieldname: description
        description: One-paragraph narrative of the journey
      - fieldname: businessGoal
        description: The outcome the actor is trying to reach
      - fieldname: primaryActor
        description: The main actor driving the scenario
      - fieldname: supportingActors
        description: Other actors or systems that participate
      - fieldname: priority
        description: Business priority of this scenario
      - fieldname: complexity
        description: Relative implementation/test complexity
  scco-form:
    fields:
      - fieldname: preconditions
        description: State that must hold before the scenario starts
      - fieldname: trigger
        description: The event that initiates the scenario
      - fieldname: successCondition
        description: Observable state indicating success
      - fieldname: failureCondition
        description: Observable state indicating failure
      - fieldname: assumptions
        description: Assumptions taken as given for this scenario
      - fieldname: outOfScope
        description: What this scenario deliberately excludes
      - fieldname: relatedInteractions
        description: INT-xxx interactions referenced by this scenario
  ssec-form:
    fields:
      - fieldname: expectedResult
        description: The observable outcome after the step
      - fieldname: interactionReference
        description: INT-xxx interaction detailing this step
      - fieldname: dataInvolved
        description: Data read or written during the step
      - fieldname: uiElement
        description: Screen or component the actor uses
  scstenex-form:
    fields:
      - fieldname: decisionPoint
        description: Condition under which the flow branches here
      - fieldname: timing
        description: Expected time this step takes
      - fieldname: notes
        description: Additional clarifications for this step
  alfl-resu-form:
    fields:
      - fieldname: resumeStep
        required: true
        description: "The main-flow step control resumes at, as that step's section id (SCNST-STEP-…). That step and everything after it run again from here."
  scda-form:
    fields:
      - fieldname: inputData
        description: Data required before the scenario can run
      - fieldname: outputData
        description: Data the scenario produces on completion
      - fieldname: testDataRequirements
        description: Data needed to exercise this scenario in tests
      - fieldname: dataTransformations
        description: How data is transformed through the scenario
      - fieldname: dataValidations
        description: Validation checks applied to the data
      - fieldname: sampleDataValues
        description: Concrete example values for input/output
