form-types:
  fr-summ-form:
    fields:
      - fieldname: totalFunctionalRequirements
        description: Total count of functional requirements
      - fieldname: mustHaveFunctional
        description: Count of Must-Have functional requirements
      - fieldname: shouldHaveFunctional
        description: Count of Should-Have functional requirements
      - fieldname: couldHaveFunctional
        description: Count of Could-Have functional requirements
      - fieldname: wontHaveThisTimeFunctional
        description: Count of Won't-Have-This-Time functional requirements
      - fieldname: coverageNote
        description: Notes on coverage and any gaps in the requirement set
  fred-form:
    fields:
      - fieldname: description
        required: true
        description: Detailed "the system shall..." statement of the requirement
      - fieldname: requirementType
        description: "Feature, User Story, Business Rule, Report, Integration, etc."
      - fieldname: category
        description: Functional-area grouping for this requirement
  frep-form:
    fields:
      - fieldname: priority
        required: true
        description: "MoSCoW priority: Must, Should, Could, or Won't-This-Time"
      - fieldname: businessValue
        description: High / Medium / Low benefit to the business
      - fieldname: effort
        description: "Estimated effort: Small, Medium, Large, or XLarge"
      - fieldname: riskLevel
        description: High / Medium / Low risk of not meeting the requirement
  fres-form:
    fields:
      - fieldname: source
        required: true
        description: "Who requested it: stakeholder name, workshop, or document"
      - fieldname: requestDate
        description: Date the requirement was requested
      - fieldname: rationale
        description: Why this requirement is needed
  frev-form:
    fields:
      - fieldname: fitCriterion
        description: Measurable condition that must hold for acceptance
      - fieldname: customerSatisfaction
        description: 1-5 scale of satisfaction if the requirement is delivered
      - fieldname: customerDissatisfaction
        description: 1-5 scale of dissatisfaction if it is NOT delivered
  frec-form:
    fields:
      - fieldname: assumptions
        description: Conditions assumed to be true for this requirement
      - fieldname: constraints
        description: Limitations on how the requirement may be implemented
      - fieldname: conflictsWith
        description: IDs of requirements this one conflicts with
  frem-form:
    fields:
      - fieldname: version
        description: Version number of this requirement
      - fieldname: lastModified
        description: Date the requirement was last modified
      - fieldname: modifiedBy
        description: Who last modified the requirement
  rus-uifo-form:
    fields:
      - fieldname: screenName
        description: Name of the screen or view
      - fieldname: screenType
        description: "List, Detail, Form, Dashboard, Dialog, or Wizard"
      - fieldname: navigationPath
        description: How the user navigates to reach this screen
      - fieldname: userRoles
        description: Roles allowed to access this screen
      - fieldname: responsiveBreakpoints
        description: "Responsive breakpoints: mobile, tablet, desktop"
  sfdb-form:
    fields:
      - fieldname: dataBinding
        description: Entity.attribute the field binds to
      - fieldname: defaultValue
        description: Default value for the field
      - fieldname: placeholder
        description: Placeholder text shown when empty
      - fieldname: helpText
        description: Help text or tooltip for the field
  scfico-form:
    fields:
      - fieldname: required
        description: "Yes, No, or Conditional"
      - fieldname: requiredCondition
        description: Condition under which the field is required
      - fieldname: readOnly
        description: "Yes, No, or Conditional"
      - fieldname: readOnlyCondition
        description: Condition under which the field is read-only
      - fieldname: visible
        description: "Yes, No, or Conditional"
      - fieldname: visibilityCondition
        description: Condition under which the field is visible
  scfiva-form:
    fields:
      - fieldname: validationMessage
        description: Message shown when validation fails
  scfivt-form:
    fields:
      - fieldname: minLength
        description: Minimum allowed input length in characters
      - fieldname: maxLength
        description: Maximum allowed input length in characters
      - fieldname: pattern
        description: Regular expression the input must match
  scfivn-form:
    fields:
      - fieldname: minValue
        description: Smallest value the field accepts
      - fieldname: maxValue
        description: Largest value the field accepts
  scfivd-form:
    fields:
      - fieldname: earliestValue
        description: "Earliest accepted date/time, absolute or relative (e.g. today)"
      - fieldname: latestValue
        description: "Latest accepted date/time, absolute or relative (e.g. today + 30d)"
  scfich-form:
    fields:
      - fieldname: optionSource
        description: "Where the options come from: static, API, or entity"
      - fieldname: staticOptions
        description: "The option values, when the source is static"
  scfifi-form:
    fields:
      - fieldname: acceptedContentKinds
        description: "What may be supplied: a content-kind family (any/image/video/audio) and/or the accepted file extensions"
      - fieldname: maxFileSize
        description: "Largest file the field accepts, e.g. 10 MB"
  scfila-form:
    fields:
      - fieldname: dependsOn
        description: Field IDs that affect this field
      - fieldname: width
        description: "full, half, third, quarter, or custom"
      - fieldname: order
        description: Order in which the field is displayed
      - fieldname: grouping
        description: Group or section the field belongs to
  rt-trac-form:
    fields:
      - fieldname: relatedGoals
        description: IDs of related business goals
      - fieldname: relatedUseCases
        description: IDs of related use cases
      - fieldname: relatedProcesses
        description: IDs of related business processes
      - fieldname: relatedUserStories
