# TomSpecs document (*.docspecs.yaml). Hierarchical format v2.
version: 2
modelVersion: "1.0"
document:
  DEMO Demo:
    TTL title:
      codeSpec: |2-
        DemoTitle
      units: |2-
        demo_server
      content: |2-
        Hello
    SUM summary:
      headline: |2-
        Executive Summary
      content: |2-
        Line one
        Line two

        Line four
    PRI priority: high
    CNT count: 3
    DET details:
      headline: |2-
        Details & Contacts
      content: |2-
        Captured during the November review.
        Owner: this line is prose, not the field.
      owner: |2-
        Bob
      contact: |2-
        bob@example.com
        - on call: weekdays
        - backup: alice@example.com
      estimate: 8
      weight: 2.5
      active: true
      priority: |2-
        high
      pattern: |2-
        ^[a-z0-9](-?[a-z0-9]){1,62}$
    items:
      headline: |2-
        Work Items
      items-1:
        label: |2-
          First
        STS status: open
      items-2:
        label: |2-
          Second line A
          with ```triple``` ticks
        STS status: done
    REF-LST refs:
      REF-SPEC:
        headline: |2-
          Reference to the Spec
        content: spec §1.2
      REF-2: ADR7
    CARD-LST cards:
      CARD-ALPHA:
        headline: |2-
          Alpha Card
        content:
          note: |2-
            first card
      CARD-2:
        content:
          note: |2-
            second card
    META meta:
      OWNR owner: |2-
        alice
      tags:
        tags-1: |2-
          on
        tags-2: |2-
          no
        tags-3: |2-
          1:30
        tags-4: plain
    CTRL control:
      CTRL-SUM summary: |2-
        Controlled summary
      owner: |2-
        ctrl-owner
    NOTE notes:
      units: |2-
        demo_client,demo_server
      NOTE-BDY body: |2-
        Section-kind body
      remarks:
        content: |2-
          Wrapper-section text
    MIX mixed:
      headline: |2-
        Mixed
        slots
      content:
        content: |2-
          _Extrapolated._
        lead: |2-
          Ada
        risk: |2-
          low
      narrative: |2-
        First narrative.


        After two blank lines.
        Lead: label-shaped prose
      tail: |2-
        Tail text.
      alt:
        lead: |2-
          Bob
    DLV-LST deliverables:
      DLV-1:
        content:
          unitId: |2-
            demo_client
          kind: |2-
            client
          component: |2-
            ARCM-COMP-UI
        DLR-LST routes:
          DLR-1:
            content:
              area: |2-
                CE-NV
              mapping: |2-
                dart-tom
      DLV-2:
        content:
          unitId: |2-
            demo_server
          kind: |2-
            server
          deploymentTarget: |2-
            DEPTAR-DEPL-API
        DLR-LST routes:
          DLR-1:
            content:
              area: |2-
                CE-DB
              mapping: |2-
                dart-tom
          DLR-2:
            content:
              area: |2-
                CE-NV
              mapping: |2-
                dart-tom
