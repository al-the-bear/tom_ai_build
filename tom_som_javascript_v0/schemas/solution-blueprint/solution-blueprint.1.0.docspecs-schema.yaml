        description: "Shorter idle timeout for sensitive operations (e.g., 2min, 5min)"
      - fieldname: absoluteTimeout
        description: "Maximum session duration regardless of activity (e.g., 4h, 8h, 24h)"
      - fieldname: renewalTimeout
        description: "Interval at which the session ID is transparently rotated (e.g., 15min, 30min)"
      - fieldname: idleTimeoutAal1
        description: "Idle timeout for AAL1 sessions (NIST default: 30 days)"
      - fieldname: absoluteTimeoutAal1
        description: "Maximum session duration for AAL1 (NIST default: 30 days)"
      - fieldname: idleTimeoutAal2
        description: "Idle timeout for AAL2 sessions (NIST default: 1 hour)"
      - fieldname: absoluteTimeoutAal2
        description: "Maximum session duration for AAL2 (NIST default: 24 hours)"
      - fieldname: idleTimeoutAal3
        description: "Idle timeout for AAL3 sessions (NIST default: 15 minutes)"
      - fieldname: absoluteTimeoutAal3
        description: "Maximum session duration for AAL3 (NIST default: 12 hours)"
      - fieldname: timeoutEnforcement
        description: "ServerSide | ClientSide | Both — where session timeout is enforced (server-side mandatory)"
      - fieldname: timeoutWarningEnabled
        description: "Yes | No — whether users receive a warning before session expiry"
      - fieldname: timeoutWarningLeadTime
        description: "Time before expiry to show warning (e.g., 2min, 5min)"
      - fieldname: timeoutWarningAction
        description: "ExtendSession | SaveDraft | RedirectToLogin — action offered to user"
      - fieldname: sessionExtensionAllowed
        description: "Yes | No | Limited — whether users can extend an expiring session"
      - fieldname: maxExtensions
        description: "Maximum number of consecutive session extensions (e.g., 3, unlimited)"
      - fieldname: gracePeriodAfterExpiry
        description: "Brief window after expiry for saving work (e.g., 0s, 30s, 2min)"
  csp-form:
    fields:
      - fieldname: concurrentSessionsAllowed
        description: "Yes | No | Limited — whether multiple simultaneous sessions are permitted"
      - fieldname: maxConcurrentSessions
        description: "Maximum number of active sessions per user (e.g., 1, 3, 5, unlimited)"
      - fieldname: concurrentSessionScope
        description: "PerAccount | PerDeviceType | PerApplication — scope for counting sessions"
      - fieldname: conflictResolution
        description: "TerminateOldest | TerminateNewest | DenyNew | AskUser — action when limit exceeded"
      - fieldname: sessionListVisible
        description: "Yes | No — whether users can see a list of their active sessions"
      - fieldname: remoteTerminationEnabled
        description: "Yes | No — whether users can terminate other sessions remotely"
      - fieldname: sessionDeviceInfo
        description: "IPAddress | DeviceType | Browser | Location | All — info shown per session"
      - fieldname: concurrentLoginNotification
        description: "None | Email | Push | InApp | All — notification when new session starts"
      - fieldname: suspiciousConcurrentLoginAction
        description: "Notify | RequireMFA | TerminateAll | LockAccount — action for suspicious simultaneous access"
      - fieldname: privilegedAccountSessionLimit
        description: "Maximum sessions for admin/privileged accounts (typically stricter, e.g., 1)"
      - fieldname: crossDeviceSessionHandling
        description: "Independent | Synchronized | SingleDevice — how sessions relate across devices"
  srp-form:
    fields:
      - fieldname: logoutMechanism
        description: "ServerSideInvalidation | TokenBlacklist | CookieClear | All — how sessions are terminated"
      - fieldname: logoutButtonPlacement
        description: "Header | Menu | Both | EveryPage — where the logout action is accessible"
      - fieldname: logoutConfirmation
        description: "Immediate | ConfirmDialog | None — whether logout requires confirmation"
      - fieldname: postLogoutRedirect
        description: "LoginPage | HomePage | GoodbyePage | CustomUrl — where users go after logout"
      - fieldname: postLogoutCacheClear
        description: "Yes | No — whether Clear-Site-Data header is sent on logout"
      - fieldname: singleLogoutEnabled
        description: "Yes | No — whether logout propagates to all connected IdPs and services"
      - fieldname: singleLogoutProtocol
        description: "FrontChannel | BackChannel | Both — SLO propagation method"
      - fieldname: privilegeChangeRevocation
        description: "Regenerate | Terminate | NoAction — session handling when user roles change"
      - fieldname: passwordChangeRevocation
        description: "TerminateAll | TerminateOthers | KeepCurrent — session handling after password change"
      - fieldname: compromiseRevocation
        description: "TerminateAll | TerminateOthers | RequireReauth — action when account compromise suspected"
      - fieldname: adminTerminationEnabled
        description: "Yes | No — whether administrators can terminate user sessions"
      - fieldname: bulkRevocationEnabled
        description: "Yes | No — whether mass session invalidation is supported (e.g., security incident)"
      - fieldname: revocationPropagationDelay
        description: "Immediate | EventualConsistency | MaxDelay — how quickly revocation takes effect across nodes"
  rmp-form:
    fields:
      - fieldname: rememberMeEnabled
        description: "Yes | No — whether remember-me / keep-me-signed-in is offered"
      - fieldname: rememberMeDuration
        description: "Duration of persistent session (e.g., 7d, 30d, 90d)"
      - fieldname: rememberMeTokenType
        description: "PersistentCookie | DeviceToken | RefreshToken — mechanism for persistent login"
      - fieldname: rememberMeTokenStorage
        description: "HttpOnlyCookie | SecureStorage | EncryptedLocalStorage — client-side storage"
      - fieldname: rememberMeTokenRotation
        description: "Yes | No — whether persistent tokens are rotated on each use"
      - fieldname: rememberMeReuseDetection
        description: "Yes | No — whether reuse of old persistent tokens triggers revocation"
      - fieldname: rememberMeDeviceBinding
        description: "None | Fingerprint | CertificateBound — how persistent tokens are bound to devices"
      - fieldname: rememberMeRevocation
        description: "ManualOnly | OnPasswordChange | OnSecurityEvent | All — when persistent tokens are revoked"
      - fieldname: rememberMeAalReduction
        description: "Yes | No — whether remember-me reduces effective AAL (e.g., AAL2 to AAL1)"
      - fieldname: rememberMeRestrictedOperations
        description: "Operations requiring full reauthentication even with active remember-me (e.g., password change, payment)"
      - fieldname: trustedDeviceManagement
        description: "Yes | No — whether users can manage a list of trusted/remembered devices"
      - fieldname: maxTrustedDevices
        description: "Maximum number of devices in the trusted device list (e.g., 5, 10)"
      - fieldname: trustedDeviceExpiry
        description: "Duration a device stays trusted (e.g., 30d, 90d, indefinite)"
  ssp-form:
    fields:
      - fieldname: sessionFixationProtection
        description: "RegenerateOnLogin | RegenerateOnPrivilegeChange | Both — session ID regeneration strategy"
      - fieldname: sessionIdRegenerationTriggers
        description: "Login | PrivilegeChange | PasswordChange | MfaStep | All — events triggering session ID renewal"
      - fieldname: sessionBindingProperties
        description: "None | IPAddress | UserAgent | DeviceFingerprint | TlsCertificate — properties bound to session"
      - fieldname: bindingMismatchAction
        description: "Terminate | RequireReauth | LogAndContinue | StepUpAuth — action on session binding violation"
      - fieldname: sessionAnomalyDetection
        description: "Yes | No — whether session anomalies (IP change, user-agent change) are monitored"
      - fieldname: anomalyDetectionSignals
        description: "IPChange | UserAgentChange | GeoLocationJump | ConcurrentAccess — signals monitored"
      - fieldname: sessionCachePolicy
        description: "NoStore | NoCache | Private — Cache-Control directive for pages with session data"
      - fieldname: clearSiteDataOnLogout
        description: "Yes | No — whether Clear-Site-Data header clears cache, cookies, storage on logout"
      - fieldname: sessionTransportSecurity
        description: "HttpsOnly | HstsEnabled | CertificatePinning — transport layer requirements for sessions"
      - fieldname: sessionIdInUrlPrevention
        description: "Yes | No — whether session IDs in URL parameters are explicitly blocked"
      - fieldname: crossOriginSessionProtection
        description: "SameSiteCookies | CorsRestriction | Both — cross-origin session protection mechanisms"
      - fieldname: sessionDataMinimization
        description: "Yes | No — whether session stores only essential data (minimize sensitive data in session)"
  slm-form:
    fields:
      - fieldname: sessionCreationLogging
        description: "Yes | No — whether session creation events are logged"
      - fieldname: sessionDestructionLogging
        description: "Yes | No — whether session termination events are logged"
      - fieldname: sessionRenewalLogging
        description: "Yes | No — whether session ID renewal events are logged"
      - fieldname: sessionEventDetails
        description: "Timestamp | SourceIP | UserAgent | GeoLocation | SessionAction — details captured per event"
      - fieldname: sessionIdInLogs
        description: "SaltedHash | Truncated | Never — how session IDs appear in logs (never in plaintext)"
      - fieldname: sessionActivityTracking
        description: "Yes | No — whether per-session activity (page visits, actions) is tracked"
      - fieldname: sessionHistoryVisibleToUser
        description: "Yes | No — whether users can view their session activity history"
      - fieldname: failedSessionAccessLogging
        description: "Yes | No — whether invalid/expired session access attempts are logged"
      - fieldname: sessionMetricsCollection
        description: "Yes | No — whether session duration, count, and patterns are collected as metrics"
      - fieldname: sessionAuditRetention
        description: "Duration session audit logs are retained (e.g., 90d, 1y, 7y)"
      - fieldname: realTimeSessionAlerts
        description: "Yes | No — whether suspicious session events trigger real-time alerts"
      - fieldname: alertTriggers
        description: "BruteForce | AnomalousAccess | MassLogout | SessionHijack — events triggering alerts"
  dap-form:
    fields:
      - fieldname: databaseConnectionSecurity
        description: "TlsRequired | TlsOptional | LocalSocketOnly — transport security for DB connections"
      - fieldname: minimumTlsVersion
        description: "TLS 1.2 | TLS 1.3 — minimum TLS version for database connections"
      - fieldname: applicationAccountStrategy
        description: "PerService | PerModule | SharedPool — how application-level DB accounts are organized"
      - fieldname: applicationAccountPrivileges
        description: "SelectUpdateDelete | ReadOnly | Custom — default permissions for application accounts"
      - fieldname: schemaOwnershipSeparation
        description: "Yes | No — whether schema owner accounts are separate from application accounts"
      - fieldname: directTableAccess
        description: "Allowed | ViewsOnly | StoredProceduresOnly — whether direct table access is permitted"
      - fieldname: databaseCredentialStorage
        description: "SecretsVault | EnvironmentVariable | EncryptedConfig — where DB credentials are stored"
      - fieldname: credentialRotationPolicy
        description: "Automatic | Manual | Interval — how DB credentials are rotated (e.g., every 90d)"
      - fieldname: connectionPoolSecurity
        description: "PerUser | PerService | Shared — connection pool isolation level"
      - fieldname: privilegedAccessManagement
        description: "JustInTime | PermanentWithApproval | BreakGlass — how DBA access is managed"
      - fieldname: databaseFirewallRules
        description: "AllowlistOnly | VpcInternal | SubnetRestricted — network access restrictions"
      - fieldname: sqlInjectionPrevention
        description: "ParameterizedQueries | OrmOnly | PreparedStatements — SQL injection mitigation strategy"
      - fieldname: queryComplexityLimits
        description: "Yes | No — whether query complexity or execution time limits are enforced"
      - fieldname: databaseActivityMonitoring
        description: "DamEnabled | NativeAudit | None — database activity monitoring tool usage"
  rlsp-form:
    fields:
      - fieldname: rowLevelSecurityEnabled
        description: "Yes | No — whether row-level security (RLS) is implemented"
      - fieldname: rlsImplementation
        description: "DatabaseNative | ApplicationLayer | OrmFilter | Hybrid — where RLS is enforced"
      - fieldname: rlsFilteringStrategy
        description: "TenantId | UserId | OrganizationId | CustomPredicate — primary filtering dimension"
      - fieldname: rlsBypassPolicy
        description: "NeverBypass | SuperAdminOnly | ServiceAccountOnly — who can bypass RLS"
      - fieldname: hierarchicalVisibility
        description: "Yes | No — whether managers see subordinate data (organizational hierarchy)"
      - fieldname: hierarchyDepthLimit
        description: "Unlimited | DirectReports | NLevels — how deep hierarchical visibility extends"
      - fieldname: crossTenantAccess
        description: "Denied | PlatformAdminOnly | ConsentBased — cross-tenant data access rules"
      - fieldname: dataOwnerAccess
        description: "FullAccess | ReadOnly | Delegated — access level for the data owner/creator"
      - fieldname: sharedDataHandling
        description: "ExplicitGrant | GroupBased | LinkSharing — how shared records are authorized"
      - fieldname: rlsPerformanceStrategy
        description: "IndexedFilterColumn | PartitionedByTenant | MaterializedViews — performance optimization for RLS"
      - fieldname: rlsTestingStrategy
        description: "AutomatedTests | PenetrationTesting | Both — how RLS enforcement is verified"
  clsp-form:
    fields:
      - fieldname: columnLevelSecurityEnabled
        description: "Yes | No — whether column-level access control is implemented"
      - fieldname: columnAccessImplementation
        description: "DatabaseGrants | ViewRestriction | ApplicationLayer | FieldProjection — enforcement mechanism"
      - fieldname: sensitiveColumnClassification
        description: "PII | Financial | Health | Confidential | Internal | Public — classification scheme for columns"
      - fieldname: piiColumnAccess
        description: "RestrictedByRole | MaskedByDefault | EncryptedAtRest — access policy for PII columns"
      - fieldname: financialDataColumnAccess
        description: "RestrictedByRole | AuditedAccess | Masked — access policy for financial data columns"
      - fieldname: healthDataColumnAccess
        description: "HipaaCompliant | StrictRole | Encrypted — access policy for health/medical data"
      - fieldname: dynamicFieldVisibility
        description: "Yes | No — whether field visibility varies dynamically based on user role or context"
      - fieldname: columnAccessAudit
        description: "Yes | No — whether access to sensitive columns is individually audited"
      - fieldname: columnEncryptionPolicy
        description: "None | SelectedColumns | AllSensitive | AlwaysEncrypted — column-level encryption approach"
  tdip-form:
    fields:
      - fieldname: tenantIsolationModel
        description: "SharedDatabase_SharedSchema | SharedDatabase_SeparateSchema | SeparateDatabase — multi-tenancy architecture"
      - fieldname: tenantIdentifierColumn
        description: "Column name used for tenant filtering (e.g., tenant_id, org_id)"
      - fieldname: tenantContextInjection
        description: "SessionVariable | ConnectionString | MiddlewareFilter | RowPolicy — how tenant context is set"
      - fieldname: tenantIsolationEnforcement
        description: "DatabaseLevel | ApplicationLevel | Both — where isolation is enforced"
      - fieldname: crossTenantQueryPrevention
        description: "DatabaseRLS | QueryRewriting | GlobalFilter | AllLayers — how cross-tenant queries are blocked"
      - fieldname: tenantDataBackupIsolation
        description: "SharedBackup | PerTenantBackup | EncryptedShared — tenant-specific backup strategy"
      - fieldname: tenantDataDeletion
        description: "SoftDelete | HardDelete | CryptoShredding — how tenant data is removed on offboarding"
      - fieldname: tenantDataExport
        description: "SelfService | AdminAssisted | ApiExport — data portability for tenants"
      - fieldname: tenantResourceQuotas
        description: "Yes | No — whether storage/query quotas are enforced per tenant"
      - fieldname: tenantIsolationTesting
        description: "AutomatedTests | PenetrationTesting | Both — how tenant isolation is verified"
      - fieldname: sharedReferenceDataAccess
        description: "ReadOnly | CachedLocally | Replicated — how tenants access shared/global reference data"
  dmp-form:
    fields:
      - fieldname: dynamicDataMaskingEnabled
        description: "Yes | No — whether dynamic data masking is implemented in production"
      - fieldname: dynamicMaskingRules
        description: "FullMask | PartialMask | Redact | Tokenize — available masking transformations"
      - fieldname: dynamicMaskingScope
        description: "RoleBased | QueryBased | ColumnBased — how masking rules are applied"
      - fieldname: staticMaskingForNonProduction
        description: "Yes | No — whether production data is statically masked before copying to test/dev"
      - fieldname: staticMaskingTool
        description: "BuiltIn | ThirdParty | CustomScript — tool used for static data masking"
      - fieldname: maskingPreservesFormat
        description: "Yes | No — whether masked data maintains original format and referential integrity"
      - fieldname: maskingReversibility
        description: "Irreversible | Tokenized | Deterministic — whether masking can be reversed"
      - fieldname: piiMaskingPolicy
        description: "FullRedact | PartialMask | Pseudonymize — specific masking approach for PII fields"
      - fieldname: emailMaskingFormat
        description: "e.g., j***@example.com or completely redacted — how email addresses are masked"
      - fieldname: phoneMaskingFormat
        description: "e.g., ***-***-1234 or fully redacted — how phone numbers are masked"
      - fieldname: addressMaskingFormat
        description: "CityOnly | ZipCodeOnly | FullRedact — how addresses are masked"
      - fieldname: financialDataMasking
        description: "FullRedact | Last4Digits | Tokenized — how financial data (credit cards, bank accounts) is masked"
      - fieldname: maskingAuditTrail
        description: "Yes | No — whether masking/unmasking operations are audited"
      - fieldname: developmentDataStrategy
        description: "MaskedCopy | SyntheticData | SubsetExtract | SeedData — strategy for development/test environments"
  daap-form:
    fields:
      - fieldname: dataAccessLoggingEnabled
        description: "Yes | No — whether data access events are logged"
      - fieldname: dataAccessLoggingScope
        description: "AllTables | SensitiveTablesOnly | ByClassification — which data access is logged"
      - fieldname: loggedOperations
        description: "Read | Write | Delete | SchemaChange | All — which operations are captured"
      - fieldname: dataAccessLogDetail
        description: "QueryText | AffectedRows | ColumnAccess | Minimal — what detail is recorded per event"
      - fieldname: queryTextLogging
        description: "Full | Sanitized | HashOnly | Disabled — whether executed query text is logged"
      - fieldname: anomalyDetectionEnabled
        description: "Yes | No — whether unusual data access patterns trigger alerts"
      - fieldname: anomalySignals
        description: "BulkExport | OffHoursAccess | UnusualVolume | NewAccessPattern — signals monitored"
      - fieldname: dataBreachDetection
        description: "RealTime | BatchReview | ThirdPartyDLP — how potential data exfiltration is detected"
      - fieldname: dataAccessReviewCycle
        description: "Monthly | Quarterly | Annually — how often data access permissions are reviewed"
      - fieldname: privilegedQueryAlerts
        description: "Yes | No — whether queries by privileged accounts trigger real-time alerts"
      - fieldname: complianceReportingEnabled
        description: "Yes | No — whether automated compliance reports are generated from access logs"
      - fieldname: dataAccessRetention
        description: "Duration data access logs are retained (e.g., 90d, 1y, 7y)"
  aap-form:
    fields:
      - fieldname: authenticationMethod
        required: true
        description: "OAuth2 | APIKey | JWT | mTLS | HMAC | Basic — primary API authentication mechanism"
      - fieldname: multipleMethodsSupported
        description: "Yes | No — whether the API supports multiple authentication methods simultaneously"
      - fieldname: apiKeyTransmission
        description: "Header | QueryParam | Cookie — where API keys are transmitted (Header recommended)"
      - fieldname: apiKeyRotationPolicy
        description: Automatic periodic rotation interval and overlap/grace period for old keys
      - fieldname: apiKeyScoping
        description: "Global | PerEnvironment | PerService — whether keys are scoped to specific environments or services"
      - fieldname: jwtValidationPolicy
        description: "iss, aud, exp, nbf — required JWT claims to validate on every request"
      - fieldname: jwtSigningAlgorithm
        description: "RS256 | ES256 | EdDSA — required JWT signing algorithm (HS256 discouraged for APIs)"
      - fieldname: accessTokenLifetime
        description: "Maximum access token validity duration (e.g. 15 min, 1 hour)"
      - fieldname: refreshTokenPolicy
        description: "Rotation | Reuse | None — refresh token handling and lifetime"
      - fieldname: clientCredentialsFlow
        description: "Yes | No — whether OAuth2 client credentials flow is supported for service-to-service"
      - fieldname: authorizationCodeFlow
        description: "Yes | No — whether OAuth2 authorization code flow with PKCE is supported"
      - fieldname: tokenRevocationSupport
        description: "Yes | No — whether explicit token revocation is supported (RFC 7009)"
      - fieldname: mutualTlsRequired
        description: "Yes | No — require client certificate authentication for service-to-service communication"
      - fieldname: serviceAccountPolicy
        description: How service accounts authenticate and what credential types they use
      - fieldname: webhookSignatureVerification
        description: "HMAC-SHA256 | RSA | EdDSA — method used to verify incoming webhook requests"
      - fieldname: thirdPartyApiConsumption
        description: Security requirements when consuming external third-party APIs (OWASP API10)
      - fieldname: credentialTransmission
        description: "Header | Body — where credentials are transmitted (Header via Authorization recommended)"
      - fieldname: bearerTokenFormat
        description: "JWT | Opaque | Reference — format used for bearer tokens"
      - fieldname: notes
        description: Additional API authentication notes
  apaupo-form:
    fields:
      - fieldname: objectLevelAuthorization
        required: true
        description: How every API endpoint verifies the caller owns or may access the requested object (OWASP API1)
      - fieldname: functionLevelAuthorization
        description: How administrative vs. regular functions are separated and access-controlled (OWASP API5)
      - fieldname: propertyLevelAuthorization
        description: How field-level exposure is controlled — preventing excessive data exposure and mass assignment (OWASP API3)
      - fieldname: permissionGranularity
        description: "Endpoint | Resource | Field — granularity at which permissions are evaluated"
      - fieldname: scopeDefinitions
        description: "OAuth2 scopes required for API access (e.g. read:users, write:orders)"
      - fieldname: scopeEnforcementLevel
        description: "Gateway | Service | Both — where scope checks are enforced"
      - fieldname: delegatedAccessPolicy
        description: How delegation or impersonation is controlled (on-behalf-of flows)
      - fieldname: bulkOperationAuthorization
        description: How batch/bulk API operations are authorized — per-item or at collection level
      - fieldname: contextualAuthorization
        description: "IP, time-of-day, device, or geolocation-based access decisions"
      - fieldname: massAssignmentPrevention
        description: "How mass assignment attacks are prevented — allowlisted fields, DTOs, read-only markers"
      - fieldname: horizontalPrivilegeEscalation
        description: Controls preventing a user from accessing another user's data via direct object reference
      - fieldname: verticalPrivilegeEscalation
        description: Controls preventing regular users from accessing administrative functions
      - fieldname: sensitiveBusinessFlowProtection
        description: "How sensitive workflows (checkout, transfer) are protected from automated abuse (OWASP API6)"
      - fieldname: workflowStateValidation
        description: How out-of-order API execution is prevented (server-side state machine enforcement)
      - fieldname: notes
        description: Additional API authorization notes
  arvp-form:
    fields:
      - fieldname: inputValidationStrategy
        required: true
        description: "Allowlist | Blocklist | SchemaValidation — primary validation approach (Allowlist recommended)"
      - fieldname: schemaValidationEnforced
        description: "Yes | No — whether JSON Schema or OpenAPI schema validation is enforced on all requests"
      - fieldname: schemaValidationTool
        description: Library or framework used for request schema validation
      - fieldname: contentTypeValidation
        description: "Yes | No — whether Content-Type header is validated against expected types"
      - fieldname: acceptedContentTypes
        description: "application/json | application/xml — comma-separated list of accepted content types"
      - fieldname: rejectUnexpectedContentType
        description: "Yes | No — respond with HTTP 415 for unsupported media types"
      - fieldname: requestSizeLimit
        description: "Maximum request body size (e.g. 1 MB, 10 MB) — reject with HTTP 413"
      - fieldname: arrayLengthLimit
        description: Maximum number of elements allowed in any JSON array in request body
      - fieldname: nestedObjectDepthLimit
        description: Maximum nesting depth for JSON objects to prevent DoS via deep nesting
      - fieldname: stringFieldMaxLength
        description: Default maximum character length for string fields unless overridden per field
      - fieldname: parameterTypeEnforcement
        description: "Yes | No — enforce strong typing (number, boolean, date) on query/path parameters"
      - fieldname: numericRangeValidation
        description: "Yes | No — enforce min/max bounds on numeric parameters"
      - fieldname: dateFormatValidation
        description: "ISO 8601 | RFC 3339 | Custom — required date/time format for all date fields"
      - fieldname: encodingValidation
        description: "UTF-8 | ASCII — accepted character encoding for request bodies"
      - fieldname: fileUploadValidation
        description: "Allowed extensions, MIME types, max file size, and content scanning requirements"
      - fieldname: notes
        description: Additional request validation notes
  apcose-form:
    fields:
      - fieldname: corsEnabled
        required: true
        description: "Yes | No — whether CORS is enabled for the API"
      - fieldname: allowedOrigins
        description: "Explicit domain list or pattern — avoid wildcard * with credentials"
      - fieldname: allowedMethods
        description: "GET | POST | PUT | DELETE | PATCH — permitted HTTP methods"
      - fieldname: allowedHeaders
        description: "Authorization, Content-Type, X-Request-ID — allowed request headers"
      - fieldname: exposedHeaders
        description: "X-RateLimit-Remaining, X-Request-ID — response headers visible to client JavaScript"
      - fieldname: credentialsAllowed
        description: "Yes | No — Access-Control-Allow-Credentials (mutually exclusive with wildcard origin)"
      - fieldname: preflightCacheMaxAge
        description: Maximum time in seconds that preflight responses can be cached (e.g. 3600)
      - fieldname: wildcardRestriction
        description: "Yes | No — whether wildcard * origin is explicitly prohibited when credentials are used"
      - fieldname: contentSecurityPolicy
        description: "CSP directives for API responses (e.g. default-src none, frame-ancestors none)"
      - fieldname: strictTransportSecurity
        description: HSTS max-age and includeSubDomains directive for API endpoints
      - fieldname: securityHeadersRequired
        description: "X-Content-Type-Options: nosniff, X-Frame-Options: DENY, Referrer-Policy: no-referrer"
      - fieldname: privateNetworkAccess
        description: How CORS private network access requests are handled (Access-Control-Request-Private-Network)
      - fieldname: notes
        description: Additional CORS security notes
  apabpr-form:
    fields:
      - fieldname: rateLimitingEnabled
        required: true
        description: "Yes | No — whether security-focused rate limiting is enforced"
      - fieldname: rateLimitScope
        description: "PerClient | PerEndpoint | PerTenant | Global — at what level limits are applied"
      - fieldname: authenticationEndpointLimits
        description: Stricter rate limits for login/token endpoints to prevent brute-force attacks
      - fieldname: sensitiveEndpointLimits
        description: "Additional rate limits for password reset, MFA enrolment, payment endpoints"
      - fieldname: bruteForceProtection
        description: "Account lockout, progressive delays, CAPTCHA — how brute force authentication attacks are mitigated"
      - fieldname: botDetectionPolicy
        description: "CAPTCHA | BehavioralAnalysis | DeviceFingerprint | None — automated request detection"
      - fieldname: ipReputationFiltering
        description: "Yes | No — use IP reputation databases to filter known-malicious sources"
      - fieldname: automaticBlocking
        description: "Yes | No — automatically block clients exceeding abuse thresholds"
      - fieldname: blockDuration
        description: Temporary (minutes/hours) or permanent — duration of automatic blocks
      - fieldname: geographicRestrictions
        description: Region or country-based access restrictions for API endpoints
      - fieldname: requestThrottlingOnFailure
        description: Progressive delay or backoff on repeated authentication or validation failures
      - fieldname: businessFlowProtection
        description: How automated abuse of business-critical flows is detected and prevented (OWASP API6)
      - fieldname: webhookFloodProtection
        description: How webhook replay attacks and flood scenarios are prevented
      - fieldname: notes
        description: Additional abuse protection notes
  apsemo-form:
    fields:
      - fieldname: apiAccessLogging
        required: true
        description: "Yes | No — whether all API access is logged with caller identity and action"
      - fieldname: loggedAttributes
        description: "Timestamp, clientId, endpoint, method, statusCode, responseTime, sourceIP — attributes captured per request"
      - fieldname: sensitiveEndpointMonitoring
        description: "Yes | No — enhanced logging for authentication, payment, and admin endpoints"
      - fieldname: sensitiveDataRedaction
        description: "Yes | No — redact PII, credentials, and tokens from API logs"
      - fieldname: anomalyDetection
        description: "Yes | No — detect anomalous API usage patterns (unusual volume, timing, geography)"
      - fieldname: errorRateMonitoring
        description: "Threshold and window for error-rate alerting (e.g. >5% 4xx in 5-min window)"
      - fieldname: authenticationFailureTracking
        description: "Yes | No — track and alert on authentication failure patterns per client/IP"
      - fieldname: dataExfiltrationDetection
        description: "Yes | No — detect unusual data volume patterns that may indicate exfiltration"
      - fieldname: apiVersionInventory
        description: "Yes | No — maintain a current inventory of all API versions and endpoints (OWASP API9)"
      - fieldname: deprecatedEndpointMonitoring
        description: "Yes | No — monitor and alert on usage of deprecated API endpoints or versions"
      - fieldname: realTimeAlerts
        description: "Yes | No — trigger real-time security alerts on threshold breaches"
      - fieldname: securityResponseAutomation
        description: "Automated actions on security events — block, throttle, escalate, notify"
      - fieldname: complianceReporting
        description: Frequency and format of API security compliance reports
      - fieldname: notes
        description: Additional API security monitoring notes
  fuvp-form:
    fields:
      - fieldname: extensionValidationStrategy
        required: true
        description: "Allowlist | Blocklist | Both — approach to file extension validation (Allowlist recommended)"
      - fieldname: allowedFileExtensions
        description: "Comma-separated list of permitted extensions (e.g. jpg, png, pdf, docx)"
      - fieldname: blockedFileExtensions
        description: "Comma-separated list of explicitly blocked extensions (e.g. exe, bat, sh, php, js)"
      - fieldname: doubleExtensionPrevention
        description: "Yes | No — prevent bypass via double extensions like .jpg.php"
      - fieldname: contentTypeValidation
        description: "Yes | No — validate MIME type from Content-Type header against allowed types"
      - fieldname: fileSignatureValidation
        description: "Yes | No — validate file magic bytes match the declared content type"
      - fieldname: signatureMismatchAction
        description: "Reject | Quarantine | Log — action when file signature does not match extension"
      - fieldname: filenameStrategy
        description: "GenerateUUID | SanitizeOriginal | Preserve — how filenames are handled on upload"
      - fieldname: filenameMaxLength
        description: Maximum allowed filename length in characters
      - fieldname: filenameAllowedCharacters
        description: "Alphanumeric, hyphen, underscore, period — allowed characters in filenames"
      - fieldname: pathTraversalPrevention
        description: "Yes | No — strip or reject path components (../, /) in filenames"
      - fieldname: nullBytePrevention
        description: "Yes | No — reject filenames containing null bytes (%00)"
      - fieldname: maxFileSizeBytes
        description: "Maximum individual file size (e.g. 10 MB, 50 MB, 1 GB)"
      - fieldname: maxUploadBatchSize
        description: Maximum total size for multi-file uploads in a single request
      - fieldname: maxConcurrentUploads
        description: Maximum number of simultaneous file uploads per user
      - fieldname: compressedFileSizeLimit
        description: Maximum decompressed size for ZIP/archive files to prevent ZIP bombs
      - fieldname: imageRewriting
        description: "Yes | No — rewrite/re-encode images to strip embedded metadata and malicious payloads"
      - fieldname: documentSanitization
        description: "Yes | No — apply Content Disarm & Reconstruct (CDR) to office documents and PDFs"
      - fieldname: metadataStripping
        description: "Yes | No — remove EXIF, XMP, and other embedded metadata from uploaded files"
      - fieldname: notes
        description: Additional file upload validation notes
  stenpo-form:
    fields:
      - fieldname: encryptionAtRest
        required: true
        description: "Yes | No — whether stored files are encrypted at rest"
      - fieldname: encryptionAlgorithm
        description: "AES-256-GCM | AES-256-CBC | ChaCha20-Poly1305 — algorithm for file encryption"
      - fieldname: encryptionScope
        description: "Volume | Bucket | PerFile | PerTenant — granularity at which encryption keys are applied"
      - fieldname: serverSideEncryption
        description: "SSE-S3 | SSE-KMS | SSE-C | ManagedKey — server-side encryption method"
      - fieldname: clientSideEncryption
        description: "Yes | No — whether files are encrypted before upload by the client"
      - fieldname: clientSideEncryptionMethod
        description: "Envelope encryption, client-managed keys — method for client-side encryption"
      - fieldname: fileKeyRotation
        description: Frequency and method of rotating file encryption keys
      - fieldname: perTenantKeys
        description: "Yes | No — whether each tenant has its own encryption key for file storage"
      - fieldname: keyDeletionOnTenantRemoval
        description: "Yes | No — whether tenant file encryption keys are destroyed when tenant is deleted"
      - fieldname: encryptionInTransit
        description: "Yes | No — TLS for file upload/download transport"
      - fieldname: minimumTlsVersion
        description: "TLS 1.2 | TLS 1.3 — minimum TLS version for file transfers"
      - fieldname: backupEncryption
        description: "Yes | No — whether file storage backups are encrypted with the same or separate keys"
      - fieldname: notes
        description: Additional storage encryption notes
  facp-form:
    fields:
      - fieldname: fileAccessModel
        required: true
        description: "OwnerBased | RoleBased | ACL | Capability — how file access permissions are determined"
      - fieldname: authenticationRequired
        description: "Yes | No — whether authentication is required for all file access"
      - fieldname: anonymousDownloadAllowed
        description: "Yes | No — whether any files can be downloaded without authentication (public files)"
      - fieldname: fileOwnershipModel
        description: "User | Tenant | SharedOwnership — who owns uploaded files by default"
      - fieldname: permissionGranularity
        description: "Read | Write | Delete | Share | Admin — permission types supported on files"
      - fieldname: folderLevelPermissions
        description: "Yes | No — whether permissions can be set at folder/directory level with inheritance"
      - fieldname: permissionInheritance
        description: "Inherit | Override | None — how folder permissions propagate to contained files"
      - fieldname: sharingEnabled
        description: "Yes | No — whether files can be shared with other users or externally"
      - fieldname: shareableLinkSupport
        description: "Yes | No — support for time-limited or password-protected shareable URLs"
      - fieldname: shareableLinkExpiration
        description: "Default expiration time for shareable links (e.g. 24 hours, 7 days, never)"
      - fieldname: externalSharingPolicy
        description: "Allowed | RestrictedDomains | Disabled — whether files can be shared outside the tenant"
      - fieldname: storageLocationPolicy
        description: "SeparateServer | OutsideWebroot | CloudBucket — where files are stored relative to application"
      - fieldname: tenantStorageIsolation
        description: "SeparateBucket | PrefixPartition | SharedWithACL — how tenant files are isolated in storage"
      - fieldname: filesystemPermissions
        description: "Least-privilege file permission policy (read-only for web server, write for upload service)"
      - fieldname: presignedUrlSupport
        description: "Yes | No — use pre-signed URLs for time-limited direct file access"
      - fieldname: presignedUrlMaxExpiry
        description: "Maximum validity period for pre-signed URLs (e.g. 15 min, 1 hour)"
      - fieldname: notes
        description: Additional file access control notes
  coscpo-form:
    fields:
      - fieldname: antivirusScanningEnabled
        required: true
        description: "Yes | No — whether uploaded files are scanned by antivirus before acceptance"
      - fieldname: scanTiming
        description: "OnUpload | Asynchronous | OnAccess | Periodic — when scanning occurs"
      - fieldname: scanEngine
        description: "ClamAV | CloudProvider | ThirdPartyAPI | Multiple — scanning engine or service used"
      - fieldname: quarantinePolicy
        description: "Quarantine | Reject | NotifyAndQuarantine — action when malicious content is detected"
      - fieldname: quarantineRetentionDays
        description: Number of days quarantined files are retained before permanent deletion
      - fieldname: signatureUpdateFrequency
        description: "Hourly | Daily | RealTime — how often antivirus signatures are updated"
      - fieldname: cdrEnabled
        description: "Yes | No — whether CDR is applied to office documents, PDFs, and similar file types"
      - fieldname: cdrApplicableTypes
        description: "PDF | DOCX | XLSX | Images — file types processed by CDR"
      - fieldname: dlpScanningEnabled
        description: "Yes | No — scan file contents for sensitive data (PII, credit cards, health records)"
      - fieldname: dlpPolicies
        description: "Regex patterns, trained classifiers, keyword lists — methods for detecting sensitive data in files"
      - fieldname: dlpAction
        description: "Block | Redact | Notify | Quarantine — action when DLP detects sensitive content"
      - fieldname: contentModeration
        description: "Yes | No — scan for illegal, offensive, or policy-violating content"
      - fieldname: moderationMethod
        description: "Automated | ManualReview | Hybrid — approach to content moderation"
      - fieldname: hashBasedDetection
        description: "Yes | No — use file hash databases (e.g. VirusTotal) to detect known-malicious files"
      - fieldname: notes
        description: Additional content scanning notes
  fdsp-form:
    fields:
      - fieldname: downloadAuthenticationRequired
        required: true
        description: "Yes | No — whether authentication is required for file downloads"
      - fieldname: downloadRateLimiting
        description: "Yes | No — rate limit file downloads per user/IP to prevent DoS"
      - fieldname: downloadRateLimit
        description: Maximum downloads per minute/hour/day per user or IP
      - fieldname: bandwidthThrottling
        description: "Yes | No — throttle download bandwidth per user to prevent abuse"
      - fieldname: contentDispositionPolicy
        description: "Attachment | Inline | PerType — how Content-Disposition header is set (Attachment recommended for untrusted content)"
      - fieldname: cdnDelivery
        description: "Yes | No — serve files through a CDN for performance and DDoS protection"
      - fieldname: hotlinkPrevention
        description: "Yes | No — prevent direct linking to files from external sites"
      - fieldname: cacheControlPolicy
        description: "NoStore | Private | PublicShortTTL — cache directives for file download responses"
      - fieldname: downloadAuditLogging
        description: "Yes | No — log all file download events with user, timestamp, file, and IP"
      - fieldname: downloadAlerts
        description: "Yes | No — alert on unusual download patterns (bulk downloads, sensitive files)"
      - fieldname: watermarking
        description: "Yes | No — apply invisible watermarks to downloaded files for traceability"
      - fieldname: notes
        description: Additional file download security notes
  stlipo-form:
    fields:
      - fieldname: retentionPolicy
        required: true
        description: "TimeBased | Indefinite | ComplianceDriven — default file retention strategy"
      - fieldname: defaultRetentionPeriod
        description: "Default duration files are kept before eligible for deletion (e.g. 90 days, 7 years)"
      - fieldname: retentionByFileType
        description: "Yes | No — different retention periods for different file categories"
      - fieldname: legalHoldSupport
        description: "Yes | No — ability to place legal holds preventing deletion regardless of retention policy"
      - fieldname: archivingEnabled
        description: "Yes | No — whether files are moved to low-cost archival tiers after a defined period"
      - fieldname: archivalStorageTier
        description: "Glacier | ColdStorage | NearlineStorage — target tier for archived files"
      - fieldname: archivalTransitionDays
        description: Number of days after last access before files move to archival storage
      - fieldname: versioningEnabled
        description: "Yes | No — maintain previous versions of overwritten or modified files"
      - fieldname: maxVersions
        description: Maximum number of previous versions to retain per file
      - fieldname: versionRetentionDays
        description: Number of days previous versions are retained
      - fieldname: backupSchedule
        description: "Daily | Hourly | Continuous — frequency of file storage backups"
      - fieldname: backupRetentionDays
        description: Number of days file backups are retained
      - fieldname: crossRegionReplication
        description: "Yes | No — replicate file storage to a secondary region for disaster recovery"
      - fieldname: secureDeletionMethod
        description: "CryptoShred | Overwrite | StandardDelete — method for permanent file deletion"
      - fieldname: deletionConfirmation
        description: "Yes | No — require explicit confirmation or approval for permanent file deletion"
      - fieldname: deletionAuditLogging
        description: "Yes | No — log all file deletion events for compliance and forensics"
      - fieldname: notes
        description: Additional storage lifecycle notes
  acms-form:
    fields:
      - fieldname: primaryModel
        required: true
        description: "RBAC | ABAC | ReBAC | Hybrid-RBAC-ABAC | Hybrid-RBAC-ReBAC | Hybrid-ABAC-ReBAC | Hybrid-All — primary access control paradigm"
      - fieldname: modelRationale
        description: Why this model was chosen over alternatives
      - fieldname: rbacEnabled
        description: "Yes | No — role-based access control with permissions assigned to roles rather than directly to users"
      - fieldname: abacEnabled
        description: "Yes | No — attribute-based access control using subject, resource, action, and environment attributes per NIST SP 800-162"
      - fieldname: rebacEnabled
        description: "Yes | No — relationship-based access control granting access based on relationships between resources and users (e.g. Zanzibar model)"
      - fieldname: policyLanguage
        description: "XACML | OPA-Rego | CedarPolicy | CustomDSL | None — formal policy language for expressing access control rules"
      - fieldname: policyDecisionPoint
        description: "Embedded | ExternalPDP | Sidecar | CloudService — where access control decisions are evaluated"
      - fieldname: policyEnforcementPoint
        description: "APIGateway | Middleware | ServiceMesh | InApplication — where access control decisions are enforced"
      - fieldname: policyAdministrationPoint
        description: "AdminUI | ConfigFile | PolicyRepository | ExternalService — where policies are managed and maintained"
      - fieldname: policyInformationPoint
        description: "UserDirectory | AttributeStore | ExternalIdP | Database — source of attributes used in access decisions"
      - fieldname: delegationModel
        description: "None | Administrative | UserInitiated | Hierarchical — whether and how permissions can be delegated between users"
      - fieldname: notes
        description: Additional access control model selection notes
  pegrpo-form:
    fields:
      - fieldname: functionLevelControl
        description: "Yes | No — permissions control access to entire functions, operations, or API endpoints"
      - fieldname: dataLevelControl
        description: "Yes | No — permissions control access to specific data records, rows, or resource instances (horizontal access control)"
      - fieldname: fieldLevelControl
        description: "Yes | No — permissions control access to individual fields or attributes within a record (column-level security)"
      - fieldname: uiElementControl
        description: "Yes | No — permissions control visibility or availability of UI components, menus, or actions"
      - fieldname: apiOperationControl
        description: "Yes | No — permissions are specific to individual API operations (GET, POST, PUT, DELETE on specific resources)"
      - fieldname: objectLevelControl
        description: "Yes | No — permissions apply to individual business object instances (IDOR prevention through ownership checks)"
      - fieldname: tenantLevelControl
        description: "Yes | No — permissions provide isolation between tenants in a multi-tenant system"
      - fieldname: finestGranularity
        description: "Function | Data | Field | UIElement | APIOperation | Object — the finest level of permission granularity supported"
      - fieldname: dynamicPermissions
        description: "Yes | No — permissions can change dynamically based on runtime context (time, location, device, risk score)"
      - fieldname: notes
        description: Additional permission granularity notes
  pecost-form:
    fields:
      - fieldname: compositionModel
        required: true
        description: "Additive | Subtractive | MostRestrictive | LeastRestrictive | OrderedPrecedence | WeightedPriority — how permissions compose"
      - fieldname: defaultPolicy
        required: true
        description: "DenyByDefault | AllowByDefault — action when no explicit rule matches (OWASP: always deny by default)"
      - fieldname: explicitDenyOverride
        description: "Yes | No — whether explicit deny always overrides any allow (deny-trumps-allow semantics)"
      - fieldname: rolePermissionInheritance
        description: "Yes | No — whether child roles inherit permissions from parent roles in a hierarchy"
      - fieldname: groupPermissionAggregation
        description: "Union | Intersection | FirstMatch — how permissions from multiple group memberships combine"
      - fieldname: conflictResolution
        description: "DenyWins | AllowWins | MostSpecificWins | ExplicitWins | PriorityBased — how conflicting permissions are resolved"
      - fieldname: permissionBoundary
        description: "Yes | No — whether a maximum permission boundary constrains effective permissions regardless of assigned roles"
      - fieldname: scopedPermissions
        description: "Yes | No — whether permissions can be scoped to specific contexts (e.g. project, department, time window)"
      - fieldname: temporaryElevation
        description: "Yes | No — whether time-limited permission elevation is supported (just-in-time access, break-glass procedures)"
      - fieldname: notes
        description: Additional permission composition notes
  accopo-form:
    fields:
      - fieldname: separationOfDuties
        description: "Yes | No — enforce static or dynamic separation of duties to prevent conflicts of interest (e.g. creator cannot approve)"
      - fieldname: sodEnforcement
        description: "Static | Dynamic | Both — whether separation of duties is enforced at role-assignment time (static) or at runtime (dynamic)"
      - fieldname: temporalConstraints
        description: "Yes | No — time-based access restrictions (business hours, maintenance windows, embargo periods)"
      - fieldname: locationConstraints
        description: "Yes | No — geographic or network-based access restrictions (IP range, geofencing, VPN requirement)"
      - fieldname: deviceConstraints
        description: "Yes | No — device-based access restrictions (managed devices, compliance status, device type)"
      - fieldname: riskAdaptiveAccess
        description: "Yes | No — access decisions consider real-time risk scores (user behavior, threat intelligence, anomaly detection)"
      - fieldname: contextualAttributes
        description: "Comma-separated list of contextual attributes used in access decisions (e.g. time, location, device, riskScore, authenticationLevel, networkZone)"
      - fieldname: maxSessionPermissions
        description: "Yes | No — limit the maximum number of active permissions per session to reduce exposure from compromised sessions"
      - fieldname: leastPrivilegeEnforcement
        description: "Manual | Automated | ContinuousReview — how least privilege principle is enforced and verified over time"
      - fieldname: privilegeCreepDetection
        description: "Yes | No — automatically detect users who accumulate excessive permissions over time through role changes"
      - fieldname: notes
        description: Additional access constraint notes
  peevbe-form:
    fields:
      - fieldname: evaluationLocation
        required: true
        description: "ServerSide | Gateway | ServiceMesh | Serverless — where permission checks are performed (OWASP: never client-side only)"
      - fieldname: evaluationFrequency
        required: true
        description: "EveryRequest | SessionStart | Cached | Lazy — how often permissions are re-evaluated (OWASP: validate on every request)"
      - fieldname: cachingStrategy
        description: "None | ShortLived | SessionBound | DistributedCache — permission decision caching approach and TTL"
      - fieldname: cacheTtlSeconds
        description: Maximum time in seconds before cached permission decisions expire
      - fieldname: failureMode
        required: true
        description: "DenyOnFailure | LastKnownGood | DegradedAccess — behavior when the authorization service is unavailable (OWASP: exit safely)"
      - fieldname: authorizationLogging
        description: "Yes | No — log all access control decisions including grants and denials for audit and incident response"
      - fieldname: logDeniedRequests
        description: "Yes | No — log details of all denied access attempts"
      - fieldname: logSuccessfulAccess
        description: "Yes | No — log successful access to sensitive resources for forensic analysis"
      - fieldname: automatedTesting
        description: "Yes | No — unit and integration tests verify authorization logic (OWASP: catch low-hanging security issues early)"
      - fieldname: clientSideHints
        description: "Yes | No — provide permission hints to UI for UX purposes while enforcing all checks server-side"
      - fieldname: notes
        description: Additional permission evaluation behavior notes
  rohipo-form:
    fields:
      - fieldname: hierarchyModel
        required: true
        description: "Tree | DAG | Flat | Layered — structure of the role hierarchy (tree = single parent, DAG = multiple parents, flat = no inheritance, layered = tiered levels)"
      - fieldname: maxHierarchyDepth
        description: Maximum number of inheritance levels allowed (e.g. 5); 0 = unlimited depth
      - fieldname: inheritanceMode
        description: "Full | Selective | None — whether child roles automatically inherit all parent permissions (full), selected permissions (selective), or none"
      - fieldname: multipleInheritance
        description: "Yes | No — whether a role can inherit from more than one parent role (DAG model)"
      - fieldname: permissionOverride
        description: "Yes | No — whether child roles can override (restrict or extend) inherited permissions from parent roles"
      - fieldname: activationConstraints
        description: "Yes | No — whether role activation is subject to constraints (time-based, prerequisite roles, approval workflows)"
      - fieldname: maxActiveRolesPerUser
        description: Maximum number of roles a single user can hold simultaneously; 0 = unlimited
      - fieldname: rolePriorityScheme
        description: "HierarchyLevel | ExplicitWeight | None — how conflicts between equal-level roles are resolved"
      - fieldname: automaticInheritanceRevocation
        description: "Yes | No — whether removing a parent role automatically revokes inherited child-role permissions"
      - fieldname: notes
        description: Additional role hierarchy policy notes
  rocepo-form:
    fields:
      - fieldname: certificationRequired
        description: "Yes | No — whether periodic role certification (access review) is mandated"
      - fieldname: certificationFrequency
        description: "Monthly | Quarterly | SemiAnnual | Annual | OnChange — how often role certifications are conducted"
      - fieldname: certifier
        description: "Manager | RoleOwner | SecurityOfficer | Automated — who performs the certification review"
      - fieldname: nonResponseAction
        description: "Revoke | Escalate | Extend | NoAction — what happens if the certifier does not respond within the deadline"
      - fieldname: riskBasedScheduling
        description: "Yes | No — whether high-risk role assignments are reviewed more frequently than low-risk ones"
      - fieldname: automatedDetection
        description: "Yes | No — whether the system automatically detects and flags anomalous or dormant role assignments"
      - fieldname: dormantRoleThresholdDays
        description: Number of days after which an unused role assignment is flagged as dormant (e.g. 90)
      - fieldname: certificationAuditTrail
        description: "Yes | No — whether certification decisions are logged for compliance and audit purposes"
      - fieldname: notes
        description: Additional role certification notes
  tecopo-form:
    fields:
      - fieldname: contextResolutionMethod
        required: true
        description: "Token | Header | Domain | Path | Session | IDP-Asserted — how tenant identity is determined from incoming requests"
      - fieldname: contextPropagation
        description: "ThreadLocal | RequestScoped | ServiceMesh | TokenBased — how tenant context flows through application layers during authorization evaluation"
      - fieldname: contextValidation
        description: "SessionBinding | TokenClaim | DatabaseLookup | IDP-Asserted — how tenant context is validated against the authenticated user"
      - fieldname: contextImmutability
        description: "Yes | No — whether the tenant context is immutable once established for a request (prevents mid-request tampering)"
      - fieldname: crossServicePropagation
        description: "JwtClaim | Header | gRPC-Metadata | ContextObject — how tenant context propagates across service boundaries in distributed architectures"
      - fieldname: missingContextBehavior
        description: "Reject | DefaultTenant | Anonymous — what happens when tenant context cannot be determined (reject = deny access; defaultTenant = use platform default)"
      - fieldname: notes
        description: Additional tenant context policy notes
  ctap-form:
    fields:
      - fieldname: crossTenantAccessAllowed
        required: true
        description: "Yes | No — whether any form of cross-tenant access is permitted in the system"
      - fieldname: crossTenantAccessModel
        description: "GlobalAdmin | ServiceAccount | ExplicitGrant | Federation | None — model governing how cross-tenant access is structured"
      - fieldname: authorizationMechanism
        description: "SuperAdminRole | ServiceAccountToken | ExplicitGrant | FederationAgreement — how cross-tenant operations are authorized when allowed"
      - fieldname: resourceSharingModel
        description: "None | ReferenceOnly | Copy | SharedOwnership | Linked — how resources can be shared across tenant boundaries"
      - fieldname: idorPreventionStrategy
        description: "CompositeKeys | QueryFilter | RLS | ScopedTokens — strategy to prevent insecure direct object references across tenants"
      - fieldname: crossTenantAuditRequirement
        description: "All | AdminOnly | None — level of audit logging required for cross-tenant operations"
      - fieldname: accessReviewFrequency
        description: "Monthly | Quarterly | SemiAnnual | Annual | OnChange — how often cross-tenant access grants are reviewed"
      - fieldname: notes
        description: Additional cross-tenant access policy notes
  teonpo-form:
    fields:
      - fieldname: authorizationProvisioningModel
        required: true
        description: "Template | Clone | Custom | Minimal — how authorization resources (roles, permissions, policies) are provisioned for new tenants"
      - fieldname: defaultRoleTemplate
        description: "Name or ID of the role template used to bootstrap initial roles for a new tenant (e.g. StandardSaaS, Enterprise, Minimal)"
      - fieldname: adminRoleProvisioning
        description: "AutoCreate | ManualAssign | InviteBased — how the initial tenant administrator role is set up"
      - fieldname: initialPermissionSet
        description: "Full | Minimal | Custom — what permissions are granted to a new tenant upon creation"
      - fieldname: offboardingStrategy
        description: "SoftDelete | HardDelete | Archive | Anonymize — how tenant authorization data is handled on offboarding"
      - fieldname: resourceCleanupOnOffboarding
        description: "Immediate | Deferred | Manual | PolicyBased — when authorization resources are cleaned up after tenant removal"
      - fieldname: dataRetentionDays
        description: "Number of days tenant authorization data (roles, assignments, audit logs) is retained after offboarding (0 = immediate)"
      - fieldname: offboardingApproval
        description: "None | PlatformAdmin | ComplianceOfficer | Both — who must approve tenant offboarding and data deletion"
      - fieldname: notes
        description: Additional tenant onboarding/offboarding notes
  tbep-form:
    fields:
      - fieldname: enforcementLayer
        required: true
        description: "API | Service | Database | All — at which architectural layer tenant authorization boundaries are enforced"
      - fieldname: authorizationFilterStrategy
        description: "QueryFilter | TokenScope | PolicyEngine | Middleware — how tenant boundaries are applied in authorization decisions"
      - fieldname: implicitTenantFilter
        description: "Yes | No — whether all authorization queries automatically include a tenant filter (defense-in-depth)"
      - fieldname: escalationPrevention
        description: "StrictScoping | RoleSeparation | TokenIsolation | All — how privilege escalation across tenant boundaries is prevented"
      - fieldname: sharedServiceAuthorization
        description: "ServiceAccount | PlatformRole | TenantAgnostic | ScopedProxy — how shared platform services authorize operations that span or are independent of tenants"
      - fieldname: tenantSwitchingPolicy
        description: "ReAuthenticate | SessionSwitch | TokenExchange | NotAllowed — how users belonging to multiple tenants switch their active tenant context"
      - fieldname: multiTenantUserSupport
        description: "Yes | No — whether a single user identity can belong to and operate within multiple tenants"
      - fieldname: authorizationCaching
        description: "None | PerTenant | SharedWithValidation | InvalidateOnSwitch — how authorization decisions are cached with respect to tenant context to prevent cross-tenant cache leakage"
      - fieldname: notes
        description: Additional tenant boundary enforcement notes
  earp-form:
    fields:
      - fieldname: defaultAlgorithm
        required: true
        description: "AES-256 | AES-128 | ChaCha20 | 3DES | Other — symmetric encryption algorithm used as the default for data at rest (AES-256 recommended per OWASP/NIST)"
      - fieldname: defaultKeyLength
        required: true
        description: "128 | 192 | 256 — minimum key length in bits for symmetric encryption (256-bit recommended for sensitive data)"
      - fieldname: cipherMode
        description: "GCM | CCM | CTR | CBC | XTS — block cipher mode of operation (GCM or CCM recommended for authenticated encryption; XTS for full-disk encryption)"
      - fieldname: encryptionLayer
        description: "Application | Database | Filesystem | Hardware | Multiple — at which architectural layer encryption is primarily applied (multiple = defense-in-depth across layers)"
      - fieldname: fieldLevelEncryption
        description: "Yes | No — whether individual sensitive fields (e.g. SSN, credit card) are encrypted at the application level beyond database/disk encryption"
      - fieldname: transparentDataEncryption
        description: "Yes | No — whether TDE (Transparent Data Encryption) is used at the database engine level (e.g. SQL Server TDE, Oracle TDE, PostgreSQL pgcrypto)"
      - fieldname: fullDiskEncryption
        description: "Yes | No — whether full-disk or volume-level encryption is required (e.g. LUKS, BitLocker, AWS EBS encryption)"
      - fieldname: minimizeSensitiveStorage
        description: "Yes | No — whether the system actively minimizes storage of sensitive data (e.g. tokenization, truncation, avoiding unnecessary PII retention)"
      - fieldname: complianceFramework
        description: "FIPS-140-2 | PCI-DSS | HIPAA | GDPR | SOC2 | None — regulatory or compliance framework dictating encryption requirements"
      - fieldname: notes
        description: Additional encryption at rest policy notes
  daenpo-form:
    fields:
      - fieldname: databaseEncryptionMethod
        required: true
        description: "TDE | ColumnLevel | CellLevel | ApplicationLayer | None — method of encrypting data within the database"
      - fieldname: encryptedColumnStrategy
        description: "Deterministic | Randomized | Homomorphic | Envelope — how individual columns are encrypted (deterministic allows equality search; randomized provides stronger security)"
      - fieldname: indexOnEncryptedColumns
        description: "Yes | No — whether indexes are maintained on encrypted columns (requires deterministic encryption or specialized schemes)"
      - fieldname: searchOnEncryptedData
        description: "None | DeterministicMatch | BlindIndex | Searchable Encryption | DecryptThenSearch — strategy for querying encrypted data without full decryption"
      - fieldname: connectionEncryption
        description: "Yes | No — whether database connections use TLS/SSL for data in transit to/from the database"
      - fieldname: databaseEngine
        description: "PostgreSQL | MySQL | SQLServer | Oracle | MongoDB | Other — target database engine (encryption capabilities vary by engine)"
      - fieldname: notes
        description: Additional database encryption notes
  fsep-form:
    fields:
      - fieldname: fileEncryptionMethod
        required: true
        description: "FileLevel | VolumeLevel | ObjectLevel | ClientSide | ServerSide | None — how files and blobs are encrypted at rest"
      - fieldname: cloudStorageEncryption
        description: "SSE-S3 | SSE-KMS | SSE-C | AzureSSE | GCS-CMEK | None — cloud provider server-side encryption method if applicable"
      - fieldname: clientSideEncryption
        description: "Yes | No — whether files are encrypted before upload (client-side encryption for defense-in-depth)"
      - fieldname: encryptedFileFormats
        description: "Comma-separated list of file types that must be encrypted (e.g. PDF, XLSX, CSV, backup dumps, log archives)"
      - fieldname: localDeviceEncryption
        description: "Yes | No — whether local device storage (mobile, desktop) must be encrypted for cached or offline data"
      - fieldname: temporaryFileEncryption
        description: "Yes | No — whether temporary files and caches must be encrypted (prevents data leakage through temp files)"
      - fieldname: notes
        description: Additional file and storage encryption notes
  baenpo-form:
    fields:
      - fieldname: backupEncryptionRequired
        required: true
        description: "Yes | No — whether all backups (database, file, system) must be encrypted"
      - fieldname: backupEncryptionMethod
        description: "SameAsSource | SeparateKey | EnvelopeEncryption | CloudProviderManaged — how backup data is encrypted (SameAsSource = same keys as live data)"
      - fieldname: separateBackupKeys
        description: "Yes | No — whether backups use separate encryption keys from production data (recommended for key rotation independence)"
      - fieldname: backupKeyRotation
        description: "OnEveryBackup | Monthly | Quarterly | Annual | OnKeyChange — how often backup encryption keys are rotated"
      - fieldname: encryptedBackupVerification
        description: "Yes | No — whether backup integrity and encryption are periodically verified through test restores"
      - fieldname: offSiteBackupEncryption
        description: "Yes | No — whether off-site or disaster recovery backups have additional encryption requirements"
      - fieldname: notes
        description: Additional backup encryption notes
  tlprpo-form:
    fields:
      - fieldname: minimumTlsVersion
        required: true
        description: "TLS1.2 | TLS1.3 — minimum acceptable TLS version (TLS 1.3 recommended; TLS 1.0/1.1 are deprecated and should not be used; PCI DSS forbids TLS 1.0)"
      - fieldname: preferredTlsVersion
        description: "TLS1.3 | TLS1.2 — preferred TLS version for new connections (TLS 1.3 provides improved security and performance)"
      - fieldname: allowedCipherSuites
        description: "Comma-separated cipher suite names or categories (e.g. TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256; disable NULL, Anonymous, EXPORT, DES, RC4 ciphers)"
      - fieldname: preferAuthenticatedEncryption
        description: "Yes | No — whether GCM/CCM authenticated cipher modes are preferred over CBC (recommended: Yes)"
      - fieldname: dhGroups
        description: "Comma-separated DH groups for key exchange (e.g. x25519, prime256v1, ffdhe3072; per RFC 7919)"
      - fieldname: tlsCompressionDisabled
        description: "Yes | No — whether TLS compression is disabled to prevent CRIME/BREACH attacks (recommended: Yes)"
      - fieldname: sessionResumption
        description: "Tickets | SessionID | None — TLS session resumption mechanism (tickets recommended for TLS 1.3; session IDs for TLS 1.2)"
      - fieldname: complianceFramework
        description: "FIPS-140-2 | PCI-DSS | HIPAA | NIST-800-52 | None — regulatory framework dictating TLS requirements"
      - fieldname: notes
        description: Additional TLS protocol policy notes
  cemapo-form:
    fields:
      - fieldname: certificateAuthority
        required: true
        description: "LetsEncrypt | DigiCert | GlobalSign | InternalCA | Other — certificate authority used for issuing TLS certificates"
      - fieldname: validationType
        description: "DV | OV | EV — Domain Validated, Organization Validated, or Extended Validation (DV is sufficient for most applications; EV provides no additional browser security benefits)"
      - fieldname: minimumKeyLength
        description: "2048 | 3072 | 4096 — minimum RSA key length in bits for certificates (2048 minimum per NIST; 3072+ recommended)"
      - fieldname: keyType
        description: "RSA | ECDSA | Ed25519 — certificate key type (ECDSA with P-256/P-384 or Ed25519 preferred for performance; RSA for broadest compatibility)"
      - fieldname: hashingAlgorithm
        description: "SHA-256 | SHA-384 | SHA-512 — certificate hashing algorithm (SHA-256 minimum; MD5 and SHA-1 must not be used)"
      - fieldname: wildcardCertificatePolicy
        description: "Allowed | Restricted | Prohibited — policy on wildcard certificates (* certs; use with caution per OWASP — violates least privilege principle)"
      - fieldname: certificateLifetimeDays
        description: "Maximum certificate validity in days (e.g. 90 for LetsEncrypt auto-renewal, 365 for annual, 730 for 2-year)"
      - fieldname: automatedRenewal
        description: "Yes | No — whether certificates are automatically renewed via ACME or similar protocol before expiration"
      - fieldname: certificateTransparency
        description: "Yes | No — whether certificates are logged in Certificate Transparency logs for public auditability"
      - fieldname: caaRecords
        description: "Yes | No — whether CAA DNS records restrict which CAs can issue certificates for the domain"
      - fieldname: notes
        description: Additional certificate management notes
  mutlpo-form:
    fields:
      - fieldname: mtlsEnabled
        required: true
        description: "Yes | No — whether mutual TLS is used anywhere in the system (client certificates for authentication)"
      - fieldname: mtlsScope
        description: "AllServices | InternalOnly | HighValueAPIs | SpecificEndpoints — which communication paths require mTLS"
      - fieldname: clientCertificateIssuance
        description: "InternalCA | ExternalCA | SelfSigned | Automated — how client certificates are issued and distributed"
      - fieldname: revocationChecking
        description: "CRL | OCSP | OCSPStapling | None — how certificate revocation status is verified"
      - fieldname: fallbackOnMtlsFailure
        description: "Reject | FallbackToTLS | DegradeWithWarning — behavior when mTLS handshake fails (Reject recommended for high-security channels)"
      - fieldname: clientCertificateRotation
        description: "Automated | Manual | OnExpiry — how client certificates are rotated"
      - fieldname: notes
        description: Additional mutual TLS policy notes
  trsepo-form:
    fields:
      - fieldname: hstsEnabled
        required: true
        description: "Yes | No — whether HTTP Strict Transport Security header is sent to force browsers to use HTTPS"
      - fieldname: hstsMaxAgeDays
        description: HSTS max-age value in days (e.g. 365 = 1 year; 730 = 2 years; must be sufficiently long to prevent downgrade)
      - fieldname: hstsIncludeSubdomains
        description: "Yes | No — whether HSTS applies to all subdomains (recommended: Yes when all subdomains support HTTPS)"
      - fieldname: hstsPreload
        description: "Yes | No — whether the domain is submitted to the HSTS preload list (hardcoded into browsers; requires includeSubDomains and long max-age)"
      - fieldname: httpToHttpsRedirect
        description: "Yes | No — whether HTTP requests are permanently redirected (301) to HTTPS"
      - fieldname: secureCookieFlag
        description: "Yes | No — whether all cookies are marked with Secure flag (browsers only send them over HTTPS)"
      - fieldname: preventMixedContent
        description: "Yes | No — whether loading of non-TLS resources from TLS pages is blocked"
      - fieldname: sensitiveDataCaching
        description: "NoCache | NoStore | Private | Default — cache-control headers for responses containing sensitive data (NoStore recommended per OWASP)"
