form-types:
  estec-form:
    fields:
      - fieldname: primaryPlatform
        description: "Dominant platform, e.g. \".NET\", \"Java EE\", \"SAP NetWeaver\"."
      - fieldname: programmingLanguages
        description: "Languages in use, comma-separated, e.g. \"Java, JavaScript, SQL\"."
      - fieldname: databaseTechnology
        description: "Database engine, e.g. \"Oracle 19c\", \"PostgreSQL\", \"MS SQL\"."
      - fieldname: operatingSystem
        description: "Host OS, e.g. \"RHEL 8\", \"Windows Server 2019\"."
      - fieldname: frameworksMiddleware
        description: "Key frameworks/middleware, e.g. \"Spring Boot, WebLogic\"."
      - fieldname: frontendTechnology
        description: "Frontend stack, e.g. \"Angular\", \"JSP\", \"SAP GUI\" — blank if none."
  esbct-form:
    fields:
      - fieldname: purpose
        required: true
        description: "What the system does for the business, in one or two sentences."
      - fieldname: businessDomain
        description: "Primary domain served, e.g. Finance, Sales, Operations, HR."
      - fieldname: owningDepartment
        description: Business unit accountable for the system.
      - fieldname: businessCriticality
        description: "How critical to operations: Mission Critical, Business Critical, Standard, or Low."
      - fieldname: businessOwner
        description: "Person or role owning the business outcomes, e.g. \"Head of Sales\"."
      - fieldname: technicalOwner
        description: Person or role owning the technical operation of the system.
  esusg-form:
    fields:
      - fieldname: activeUsers
        description: "Total registered/licensed users, e.g. 1200."
      - fieldname: dailyActiveUsers
        description: Typical number of users active on a normal day.
      - fieldname: peakConcurrentUsers
        description: Highest number of simultaneous users observed.
      - fieldname: transactionVolumeDaily
        description: "Average daily transactions, e.g. \"~50k orders/day\"."
      - fieldname: dataVolumeCurrent
        description: "Size of the data set today, e.g. \"2.5 TB\"."
      - fieldname: dataGrowthRate
        description: "How fast data grows, e.g. \"~50 GB/month\"."
      - fieldname: availabilityRequirement
        description: "Required uptime, e.g. \"99.9%\", \"24x7\", \"business hours\"."
  eslcy-form:
    fields:
      - fieldname: goLiveDate
        description: When the system first went into production (ISO 8601).
      - fieldname: lastMajorUpgrade
        description: Date of the most recent major upgrade (ISO 8601).
      - fieldname: currentVersion
        description: Version currently running in production.
      - fieldname: supportStatus
        description: "Vendor support state: Active, Limited, Extended, or End-of-Life."
      - fieldname: supportExpiryDate
        description: "Date vendor support ends (ISO 8601), if known."
      - fieldname: plannedRetirementDate
        description: "Target decommission date, if one is planned."
      - fieldname: migrationUrgency
        description: "How soon migration is needed: Immediate, Within 1 year, etc."
  esint-form:
    fields:
      - fieldname: apiTypesAvailable
        description: "APIs the system exposes: REST, SOAP, GraphQL, gRPC, or none."
      - fieldname: integrationMethods
        description: "How it integrates: API, File Transfer, Database Link, MQ, manual."
      - fieldname: dataFormats
        description: "Formats exchanged: JSON, XML, CSV, EDI, etc."
      - fieldname: realTimeCapable
        description: True if the system supports real-time integration.
      - fieldname: batchProcessingWindows
        description: "Scheduled batch windows, e.g. \"nightly 01:00–03:00\"."
      - fieldname: externalInterfaceCount
        description: Count of interfaces to systems outside the organization.
      - fieldname: internalInterfaceCount
        description: Count of interfaces to other internal systems.
  esinf-form:
    fields:
      - fieldname: hostingModel
        description: "Where it runs: On-Premise, Private Cloud, Public Cloud, Hybrid, SaaS."
      - fieldname: cloudProvider
        description: "Cloud provider, e.g. \"AWS\", \"Azure\", \"GCP\" — blank if on-prem."
      - fieldname: environmentCount
        description: "How many environments exist (Dev, Test, Staging, Prod, ...)."
      - fieldname: geographicDeployment
        description: "Deployment reach: Single region, Multi-region, or Global."
      - fieldname: disasterRecovery
        description: "DR posture: Hot standby, Warm standby, Cold backup, or None."
      - fieldname: backupFrequency
        description: "How often backups run, e.g. \"hourly\", \"nightly\"."
  esqua-form:
    fields:
      - fieldname: technicalDebtLevel
        description: "Accumulated technical debt: Low, Medium, High, or Critical."
      - fieldname: codeQuality
        description: "Code quality judgement: Good, Acceptable, Poor, or Unknown."
      - fieldname: documentationStatus
        description: "State of docs: Current, Outdated, Minimal, or None."
      - fieldname: availabilitySla
        description: "Actual availability achieved, e.g. \"99.5%\" — not the target."
      - fieldname: securityComplianceStatus
        description: "Compliance standing, e.g. \"PCI-DSS compliant\", \"gaps open\"."
      - fieldname: lastSecurityAudit
        description: Date of the most recent security audit (ISO 8601).
      - fieldname: lastPenetrationTest
        description: Date of the most recent penetration test (ISO 8601).
      - fieldname: accessibilityCompliance
        description: "Accessibility standing, e.g. \"WCAG 2.1 AA\", \"Section 508\"."
  sdem-form:
    fields:
      - fieldname: mechanism
        description: API / DatabaseLink / FileTransfer / MessageQueue / SharedStorage / Manual / ETL
      - fieldname: couplingStrength
        description: Tight / Moderate / Loose — degree of coupling between systems
      - fieldname: criticality
        description: Critical / High / Medium / Low
  sdede-form:
    fields:
      - fieldname: dataExchanged
        description: Key data entities or types flowing through this dependency
      - fieldname: dataVolume
        description: "Typical volume, e.g. ~5k records/day, 200 MB/hour"
      - fieldname: dataFreshness
        description: RealTime / NearRealTime / Hourly / Daily / OnDemand
  sder-form:
    fields:
      - fieldname: failureImpact
        description: What happens when this dependency fails — business consequences
      - fieldname: cascadeRisk
        description: None / Contained / ModerateCascade / SevereCascade — propagation to other systems
      - fieldname: latencyRequirement
        description: "Maximum acceptable latency, e.g. <500ms, within same business day"
      - fieldname: availabilityRequirement
        description: "Required uptime, e.g. 99.9%, business hours only"
      - fieldname: sla
        description: "Formal SLA reference or key terms, e.g. 4h response, 24h resolution"
      - fieldname: fallbackProcedure
        description: Manual or automated fallback when this dependency is unavailable
  sdeo-form:
    fields:
      - fieldname: monitoringStatus
        description: Monitored / PartiallyMonitored / Unmonitored
      - fieldname: documentationStatus
        description: Documented / PartiallyDocumented / Undocumented
      - fieldname: dependencyOwner
        description: Team or role responsible for maintaining this dependency
      - fieldname: technicalDebt
        description: None / Low / Moderate / High — accumulated technical debt
      - fieldname: technicalDebtDetails
        description: "Description of known issues, outdated protocols, or maintenance burden"
      - fieldname: plannedChanges
        description: Any known upcoming changes to this dependency
  exsrl-form:
    fields:
      - fieldname: dependentSystems
        description: List of internal systems that use this external service
      - fieldname: criticality
        description: Critical / High / Medium / Low
      - fieldname: contractStatus
        description: Active / Renewal Due / Negotiating / Month-to-Month
      - fieldname: contractExpiry
        description: Date the current contract expires (ISO 8601).
  exsop-form:
    fields:
      - fieldname: slaGuarantee
        description: "Vendor-provided availability guarantee, e.g., 99.9%"
      - fieldname: actualAvailability
        description: Measured availability over past period
      - fieldname: dataExchanged
        description: Types of data sent to/received from service
      - fieldname: dataResidency
        description: Where vendor stores/processes data - relevant for compliance
      - fieldname: securityCertifications
        description: "SOC2, ISO 27001, HIPAA, etc."
  exsrk-form:
    fields:
      - fieldname: vendorLockIn
        description: None / Low / Moderate / High / Severe
      - fieldname: switchingCost
        description: Estimated effort to migrate to alternative
      - fieldname: alternativeProviders
        description: Known alternatives if migration needed
      - fieldname: fallbackProcedure
        description: Manual workaround or degraded operation mode
      - fieldname: lastOutage
        description: Date and impact of last vendor outage
      - fieldname: communicationChannel
        description: How incidents are reported and tracked
  sier-form:
    fields:
      - fieldname: criticality
        description: Critical / High / Medium / Low
      - fieldname: singlePointOfFailure
      - fieldname: redundancyLevel
        description: None / Active-Passive / Active-Active / Multi-Region
      - fieldname: failoverTime
        description: Time to recover if component fails
      - fieldname: lastFailure
        description: Date and summary of last significant failure
  siec-form:
    fields:
      - fieldname: capacityHeadroom
        description: "Current utilization vs capacity, e.g., 60% of max"
      - fieldname: scalingLimitations
        description: Constraints on horizontal or vertical scaling
  sieo-form:
    fields:
      - fieldname: managedBy
        description: Team or vendor responsible for this component
      - fieldname: maintenanceWindow
        description: Regular maintenance schedule
      - fieldname: documentationStatus
        description: Current / Outdated / Minimal / None
  syinpr-form:
    fields:
      - fieldname: protocol
        description: REST / SOAP / gRPC / SFTP / JDBC / AMQP / Kafka / Custom
      - fieldname: direction
        description: Inbound / Outbound / Bidirectional
      - fieldname: frequency
        description: Continuous / Hourly / Daily / Weekly / OnDemand
      - fieldname: middlewareUsed
        description: "MuleSoft, Azure Service Bus, none"
      - fieldname: authenticationMethod
        description: OAuth2 / APIKey / mTLS / BasicAuth / SAML / None
  side-form:
    fields:
      - fieldname: dataExchanged
        description: Key data entities or payloads exchanged
      - fieldname: messageFormat
        description: JSON / XML / CSV / Avro / Protobuf / EDI / Custom
      - fieldname: schemaVersion
        description: Current schema or API version
      - fieldname: transformationRequired
        description: Yes / No
      - fieldname: dataMappingComplexity
        description: Simple / Moderate / Complex
  sieh-form:
    fields:
      - fieldname: errorHandling
        description: Retry / DeadLetter / Alert / ManualIntervention
      - fieldname: retryPolicy
        description: 3 retries with exponential backoff
  syinth-form:
    fields:
      - fieldname: throughputCapacity
        description: "10k msg/sec, 500 records/batch"
      - fieldname: currentUtilization
        description: Typical load vs capacity
      - fieldname: peakLoadHandling
        description: Scales / Queues / Throttles / Degrades
  syinmo-form:
    fields:
