[build-system]
# setuptools >= 77 for PEP 639 SPDX licence-expression metadata (the plain
# `license = "BSD-3-Clause"` string below).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tom_som_python_runtime"
# Version tracks the TomSpecs model version; the typed `tom_som_python_v0`
# facade pins the same version. Realigned by
# tom_specs_clitool/bin/generate_som.dart.
version = "1.0.0"
description = "Python port of the generic TomSpecs object-model runtime (paths, model, reflection, document, validator, YAML/Markdown codecs)."
requires-python = ">=3.9"
readme = "README.md"
# PEP 639 SPDX licence expression, per the release-1 licence decision.
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/al-the-bear/tom_ai_build"

# The importable package is `tom_som_runtime`; the distribution name above is
# `tom_som_python_runtime` (parallel to tom_som_dart_runtime). Listed explicitly
# so setuptools does not try flat-layout auto-discovery over the tests/ folder.
[tool.setuptools]
packages = ["tom_som_runtime"]
