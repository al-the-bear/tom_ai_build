# TomSpecs document (*.docspecs.yaml). Hierarchical format v2.
version: 2
modelVersion: "1.0"
document:
  DEMO Demo:
    TTL title: |2-
      Hello
    SUM summary:
      headline: |2-
        Executive Summary
      content: |2-
        Line one
        Line two

        Line four
    PRI priority: high
    CNT count: 3
    DET details:
      headline: |2-
        Details & Contacts
      content: |2-
        Captured during the November review.
        Owner: this line is prose, not the field.
      owner: |2-
        Bob
      contact: |2-
        bob@example.com
      estimate: 8
      weight: 2.5
      active: true
      priority: |2-
        high
    items:
      headline: |2-
        Work Items
      items-1:
        label: |2-
          First
        STS status: open
      items-2:
        label: |2-
          Second line A
