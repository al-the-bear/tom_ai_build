name: tom_md_export
description: >-
  Exports Markdown carrying the reading notation (fenced divs, bracketed spans,
  citation shapes) to PDF through Typst. General Markdown; in TomSpecs its input
  is a readable rendition.
version: 0.1.0
publish_to: none

repository: https://github.com/al-the-bear/tom_ai_build
homepage: https://github.com/al-the-bear/tom_ai_build/tree/main/tom_md_export

environment:
  sdk: ^3.11.4

dependencies:
  path: ^1.9.0
  tom_build_base: ^2.47.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  md_export: md_export
