# Multiple code-block languages
section-types:
  dart-code:
    prefix: dart
    format: dart
  yaml-code:
    prefix: yaml
    format: yaml
  any-code:
    prefix: code
    format: code

document:
  sections:
    dart-examples:
      section-type: dart-code
      optional: true
    yaml-examples:
      section-type: yaml-code
      optional: true
    generic-code:
      section-type: any-code
      optional: true
