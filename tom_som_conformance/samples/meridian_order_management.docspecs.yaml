                            State selector
                          content:
                            elementId: |2-
                              SCR-01-EL-1
                            elementType: |2-
                              selectField
                          SEER resources:
                            labelResource: |2-
                              screen.orders.filter.state
                            hintResource: |2-
                              screen.orders.filter.state.hint
                    SCRSC-ITEM-2:
                      headline: |2-
                        Order table
                      content:
