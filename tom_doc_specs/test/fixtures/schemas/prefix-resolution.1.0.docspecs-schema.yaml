# Prefix-based section type resolution
section-types:
  overview:
    prefix: overview
  requirement:
    prefix: req
  configuration:
    prefix: config
  note:
    prefix: note

document:
  sections:
    overview:
      section-type: overview
    requirements:
      section-type: requirement
    configuration:
      section-type: configuration
      optional: true
    notes:
      section-type: note
      optional: true
