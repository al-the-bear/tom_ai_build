  tom_som_dart_v0: >-
    section automation in progress — 02_sau5 (2026-11-23): regenerated for
    model 1.12.3 (LocaleRolloutPlan, 14 more @DetailedIn). 03_sau11:
    regenerated for model 1.13.0 (the link annotations and qualifiers of the
